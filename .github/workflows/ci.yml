name: CI

# Calidad automática en cada cambio: ejecuta las pruebas y revisa el estilo (Pint).
# Replica el entorno local (PHP 8.5, SQLite en memoria, assets compilados con Vite).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests y estilo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, bcmath, intl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Preparar entorno (.env)
        run: cp .env.example .env

      - name: Instalar dependencias de Composer
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generar APP_KEY
        run: php artisan key:generate

      - name: Instalar y compilar assets (Vite)
        run: |
          npm ci
          npm run build

      - name: Revisar estilo de código (Pint)
        run: ./vendor/bin/pint --test

      - name: Ejecutar pruebas
        run: php artisan test
