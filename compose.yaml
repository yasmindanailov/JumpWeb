services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - mysql
            - mailpit
            - redis
    mysql:
        image: 'mysql:8.4'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
            MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS:-}'
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s
    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail
    # ⚠️⚠️ REDIS EN LOCAL NO ES COMODIDAD: es la única forma de VERIFICAR los tags
    # (`DECISIONES #137`). Medido ejecutándolo: el store `array` —el que usa la suite—
    # SOPORTA tags, y `database`/`file` LANZAN. Sin un Redis real, un test con
    # `Cache::tags()` sale VERDE aquí y revienta en la primera petición de producción,
    # que es exactamente la trampa de `#129` («la guarda salía verde en SQLite»).
    #
    # ⚠️ La versión está CLAVADA a la de staging (7.0.15, medida el 2026-08-25) y no en
    # `redis:alpine`, que hoy sirve una rama mayor distinta: probar contra una versión que
    # producción no ejecuta es la otra mitad del mismo error.
    #
    # ⚠️ Puerto propio (como web 8081, MySQL 3308 y Mailpit 8028): esta máquina puede tener
    # otro Redis escuchando en el 6379.
    redis:
        image: 'redis:7.0-alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6382}:6379'
        # Sin volumen a propósito: es una CACHÉ. Persistirla entre reinicios haría que un
        # test dependiera de lo que dejó otro, que es la clase de acoplamiento que
        # `SUITE-02` persigue con los memos estáticos.
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
