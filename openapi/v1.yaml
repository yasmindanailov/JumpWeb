# JumpWeb — API v1
#
# Documento ESCRITO A MANO y versionado (`DECISIONES #21`). No se genera desde el código: con
# generación, el contrato pasa a ser un reflejo de la implementación y cualquier refactor lo
# cambiaría en silencio — inaceptable para un contrato contra el que la app móvil de Fase 6 se
# construye y despliega por separado. La relación va al revés: **este fichero manda**, y los tests
# de contrato (Spectator) caen cuando el código se desvía.
#
# Se sirve como fichero estático; ningún paquete de runtime lo publica por HTTP (`DECISIONES #21c`).
#
# Alcance actual: Fase 3 · pasos 0 (cimientos), 1a (lectura de la cuenta), 1b (catálogo), 3 (auth),
# 4a (presupuesto), 4b (disponibilidad), 4c (pedido y cobro), 4d (desenlace del pago) y 5
# (post-form de invitados). Con el paso 5, la superficie de Fase 3 queda COMPLETA.

openapi: 3.0.3

info:
  title: JumpWeb API
  version: 1.10.0
  description: |
    API de la plataforma de reservas JumpWeb. Sus clientes son la SPA del sidebar (Fase 4) y la
    app móvil (Fase 6); ambos son clientes de igual rango sobre el mismo dominio.

    **Autenticación** (spec §4.2): la SPA de primera parte usa la cookie de sesión de Sanctum con
    CSRF —nunca un token en `localStorage`—; el cliente móvil usa un Bearer emitido por
    `POST /auth/tokens`, con caducidad y revocación.

    **Errores**: todos comparten un único sobre (`Error`). El campo que un cliente debe programar
    es `code`, no `message` ni el texto de ninguna traducción.

    **Idioma**: se negocia por `Accept-Language` entre `es`, `en` y `fr`. Un cliente que comparta
    sesión con la web (la SPA) hereda la elección del visitante sin enviar nada.

servers:
  - url: /api/v1
    description: La versión va en la URL. `v1` es evolutiva hasta el primer cliente móvil (Fase 6).

tags:
  - name: Sesión
    description: |
      Abrir y cerrar sesión. La SPA de primera parte usa la **cookie de sesión de Sanctum con
      CSRF**: pide `GET /sanctum/csrf-cookie` y envía el token en `X-XSRF-TOKEN`. La EMISIÓN de
      tokens Bearer llega en Fase 6, con la app que los consuma.
  - name: Cuenta
    description: El usuario autenticado y sus datos.
  - name: Instalación
    description: |
      Cómo está configurada ESTA instalación. Superficie pública y estática entre despliegues: lo
      que un cliente necesita para pintar bien a la primera, no para decidir nada. El estado que
      cambia en caliente —la pausa de reservas— no vive aquí.
  - name: Catálogo
    description: |
      Qué se vende. Superficie PÚBLICA: se consulta sin identidad, igual que el escaparate de la
      web. Describe la oferta, nunca la disponibilidad ni el precio final de una cesta — eso
      depende de la fecha y de la selección, y lo sirven `availability/*` y `orders/quote`.
  - name: Invitación
    description: |
      La invitación digital de una fiesta, **vista desde fuera**. Es la única superficie del contrato
      cuya credencial es un **token en la URL** —doce caracteres opacos, una fila que se puede
      anular— y no una sesión ni una firma HMAC, porque su enlace se reparte a un grupo de clase
      entero por un chat de padres.

      ⚠️⚠️ De ahí sale su propiedad central: **es una hoja en blanco**. Quien tiene el enlace ve la
      fiesta, pero **no puede averiguar quién va** — ni la lista, ni los contadores, ni si un nombre
      concreto ya contestó. Lo que el anfitrión ve de su propia invitación vive en `Reservas`, en un
      objeto distinto a propósito.
  - name: Reservas
    description: |
      Lo que el cliente hace con una reserva YA pagada. Su particularidad es la autorización: el
      post-form de invitados se abre desde un enlace que viaja por correo semanas antes del evento,
      así que se autoriza con **una firma** —no con una sesión—, y esa firma cubre la URL exacta.
  - name: Compra
    description: |
      El camino del dinero. El carrito NO se guarda en el servidor —es estado del cliente—, pero el
      servidor sí participa en él: pone el **precio** (`orders/quote`), decide la **disponibilidad**
      con la cesta delante y **admite y crea** el pedido. Ninguna de esas tres cosas puede
      calcularla el cliente sin quedarse con una copia del negocio que acabaría divergiendo.

paths:

  /auth/login:
    post:
      tags: [Sesión]
      operationId: login
      summary: Abrir sesión
      description: |
        Autentica con correo y contraseña y devuelve el perfil, con la misma forma que `GET /me`:
        quien acaba de identificarse necesita justo eso, y devolverlo ahorra una segunda petición.

        **Anti-enumeración** (`SEC-06`): unas credenciales que no casan devuelven siempre
        `invalid_credentials`, sin distinguir si el correo existe. Lo que sí se distingue es el
        limitador, que no revela nada de la cuenta y sí le dice a un cliente legítimo cuánto
        esperar: hay un tope por (correo, IP) y otro por IP sola —este último es el que corta un
        barrido de muchas cuentas desde el mismo origen—.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión abierta. El cuerpo es el perfil del usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Las credenciales no casan (`invalid_credentials`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '419':
          description: Token CSRF ausente o caducado (modo SPA). Vuelve a pedir `GET /sanctum/csrf-cookie`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

  /auth/tokens:
    post:
      tags: [Sesión]
      operationId: issueToken
      summary: Emitir un token (cliente nativo)
      description: |
        La puerta de quien NO es un navegador de primera parte: autentica con correo y contraseña y
        devuelve un token Bearer, sin abrir sesión ni pedir CSRF. El cajón de la web no la usa: vive
        en el mismo dominio y sigue con la cookie de sesión.

        **Es la misma puerta que `POST /auth/login` a efectos de ataque** (`SEC-06`): mismas
        credenciales genéricas (`invalid_credentials`, sin distinguir si el correo existe) y los
        MISMOS dos limitadores con las mismas claves —por (correo, IP) y por IP sola—, así que los
        intentos fallidos en una cuentan en la otra.

        El token caduca (`expires_at`) y se renueva con `POST /auth/tokens/rotate`. Muere además por
        `POST /auth/logout` (solo ese), «cerrar las demás sesiones», el cambio o el
        restablecimiento de contraseña y la supresión de la cuenta. Cada cuenta conserva un máximo
        de diez tokens vivos: al emitir el undécimo se retira el que lleva más tiempo sin usarse.

        La respuesta lleva `Cache-Control: no-store`: transporta una credencial.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '201':
          description: Token emitido. El valor de `token` no se vuelve a mostrar nunca.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedToken'
        '401':
          description: Las credenciales no casan (`invalid_credentials`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

  /auth/tokens/rotate:
    post:
      tags: [Sesión]
      operationId: rotateToken
      summary: Cambiar el token por uno nuevo
      description: |
        Emite un token nuevo con el mismo nombre de dispositivo y **revoca el de esta petición**, en
        una sola operación. El cliente lo llama al arrancar si su token tiene más de siete días: así
        quien usa la app no vuelve a teclear la contraseña y un token olvidado caduca solo.

        Solo tiene sentido con Bearer: una petición con cookie de sesión no trae ningún token que
        rotar y recibe `bad_request`.
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Token nuevo emitido; el anterior ya no sirve.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedToken'
        '400':
          description: La petición no viene por Bearer (`bad_request`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

  /auth/register:
    post:
      tags: [Sesión]
      operationId: register
      summary: Alta de cliente
      description: |
        Crea la cuenta. **El contexto decide la política**, y lo aplica el servidor:

        - `standalone` (por defecto): no se inicia sesión y se envía el correo de verificación.
        - `purchase`: alta dentro del flujo de compra («pay-first»). Se inicia sesión para poder
          seguir al pago y **no** se envía verificación — el pago la sustituye, y un bot no paga.

        **Si el correo ya tiene cuenta, se dice** (422 con el mensaje en `error.fields.email`). Es
        una decisión de producto deliberada: prima la conversión sobre ocultar qué correos existen,
        y es la misma que aplica la web. Lo que acota la enumeración masiva es el límite de tres
        altas por hora y correo.

        Responde **201 también cuando no ha creado nada**: si el señuelo `website` viene relleno o
        se agotó el límite por correo, la respuesta es indistinguible de un alta buena —si no lo
        fuera, el señuelo dejaría de servir—.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: |
            Alta aceptada, **sin cuerpo**. No lo lleva a propósito: si la respuesta trajera el
            perfil cuando hay cuenta y nada cuando se finge (señuelo o límite por correo), un bot
            distinguiría las dos de un vistazo. Quien se registra en la compra queda identificado y
            puede pedir su perfil a `GET /me`.
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

  /auth/google/pending:
    get:
      tags: [Sesión]
      operationId: googleSignupPending
      summary: El alta con Google que espera a completarse
      description: |
        Lo que la pantalla de §7 necesita para pintarse: el nombre que sugiere Google —editable,
        porque a veces devuelve «Ana G.»— y el correo, que es **fijo**: es la identidad verificada.

        ⚠️⚠️ **El perfil vive en la SESIÓN DEL SERVIDOR**, donde lo dejó el retorno de Google, y por
        eso este endpoint no recibe ningún parámetro. Si el `sub` o el correo viajaran por el
        navegador, cualquiera crearía una cuenta con la identidad verificada de otro — y a esa cuenta
        se le firma un descargo probatorio.

        **404 cuando no hay nada esperando**: la sesión caducó, el alta ya se completó, o esta
        persona nunca pasó por Google. No es un error del cliente: es «vuelve a empezar».

        ⚠️ Responde **404 también cuando la instalación no tiene Google configurado**, igual que sus
        rutas web.
      responses:
        '200':
          description: El perfil verificado que espera.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleSignupPending'
        '400':
          description: |
            La petición no puede abrir sesión (no viene de un origen declarado *stateful*), y sin
            sesión no hay perfil de Google que consumir. No es falta de identidad: es que el cliente
            no habla el modo SPA.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

  /auth/google/complete:
    post:
      tags: [Sesión]
      operationId: completeGoogleSignup
      summary: Completar el alta con Google
      description: |
        Crea la cuenta con lo que Google **no** puede dar —el nombre corregido y el descargo— y **abre
        sesión**: quien llega acaba de demostrar su identidad ante Google y no tiene contraseña que
        teclear (es la misma decisión que el alta suelta desde `#331`).

        En la misma operación se escriben el sello de privacidad y su fila de `consents`, el vínculo
        con Google y **la firma del descargo**, que aquí se puede hacer en el acto porque el correo
        queda verificado (`[DECIDIDO owner]`).

        ⚠️ **Consume el perfil**: un segundo envío —dos pestañas, doble clic— ya no encuentra nada que
        crear y responde 404.

        ⚠️ **La privacidad no es una casilla** (§7.1): el RGPD pide INFORMAR, no que se acepte, y la
        base legal de una reserva es el contrato. El rastro sí se escribe.

        ⚠️⚠️ **Ni el teléfono ni las condiciones se piden aquí, desde la T8·c**
        (`[DECIDIDO owner, 2026-09-02]`): los reclama `POST /orders`, que es el momento del contrato —
        donde los sitúan la LCGC (art. 5) y el TRLGDCU (art. 97)—. La cuenta nace **sin teléfono y sin
        aceptación de condiciones registrada**, y el checkout no deja crear un pedido sin las dos.

        ⚠️ El **marketing no se pide aquí** (art. 7.4, no empaquetado): vive en el interruptor de la
        cuenta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleSignupRequest'
      responses:
        '201':
          description: Cuenta creada y sesión abierta, **sin cuerpo**. El cliente pide `GET /me`.
        '400':
          description: |
            La petición no puede abrir sesión (no viene de un origen declarado *stateful*), y sin
            sesión no hay perfil de Google que consumir. No es falta de identidad: es que el cliente
            no habla el modo SPA.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No hay ningún alta de Google esperando (caducó, ya se usó, o nunca la hubo).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            El texto del descargo se publicó de nuevo entre servirlo y aceptarlo
            (`waiver_document_stale`). El cliente vuelve a pedir `GET /legal/waiver`, lo presenta
            otra vez y **desmarca la casilla**: lo que se leyó ya no es lo que se firmaría.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

  /auth/email/resend:
    post:
      tags: [Sesión]
      operationId: resendVerification
      summary: Reenviar la verificación del correo
      description: |
        Público a propósito: quien acaba de darse de alta todavía no tiene sesión y es justo cuando
        necesita pedirlo.

        Responde **202 siempre**, haya enviado o no. Si el cooldown o la inexistencia de la cuenta
        se notaran en la respuesta, esto sería un oráculo de correos registrados. Los dos cooldowns
        —por IP y por correo destinatario— son los que impiden usarlo para llenar un buzón ajeno.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Petición aceptada. No dice si se ha enviado algo.
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

  /auth/password/forgot:
    post:
      tags: [Sesión]
      operationId: requestPasswordReset
      summary: Pedir el enlace de recuperación
      description: |
        Responde **202 exista o no la cuenta**. Aquí la anti-enumeración es estricta, al contrario
        que en el alta: en el registro hay alguien intentando comprar y esconderlo cuesta la venta;
        aquí no se gana nada diciéndolo y sí se regala un oráculo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Petición aceptada. No dice si esa cuenta existe.
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

  /auth/password/reset:
    post:
      tags: [Sesión]
      operationId: resetPassword
      summary: Fijar la nueva contraseña
      description: |
        Con el token del correo. Al conseguirlo se invalidan **todas** las credenciales anteriores
        del titular —sesiones y tokens de API—: es el caso de uso de quien ha perdido el control de
        su cuenta.

        Un token inválido, uno caducado y un correo inexistente devuelven el **mismo** 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '204':
          description: Contraseña cambiada. Toda credencial anterior deja de valer.
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

  /auth/logout:
    post:
      tags: [Sesión]
      operationId: logout
      summary: Cerrar sesión
      description: |
        Cierra **la credencial con la que se llama**, y solo esa: la sesión si viene por cookie, el
        token si viene por Bearer. Cerrar las demás es otra operación distinta («cerrar sesión en
        los demás dispositivos»).

        Responde `204` sin cuerpo: no hay nada que contar.
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '204':
          description: Sesión cerrada.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '419':
          description: Token CSRF ausente o caducado (modo SPA).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

  /config:
    get:
      tags: [Instalación]
      operationId: getPublicConfig
      summary: Ajustes públicos de la instalación
      description: |
        Los valores que un cliente necesita para pintar el cajón de reserva **bien a la primera**:
        el bloque de registro externo del negocio, el umbral a partir del cual se ofrece el buscador
        del catálogo, la clave pública del anti-bot y el tope de líneas de la cesta.

        Sin esto un cliente aprende las reglas **chocándose** —descubre el tope de cesta con un 422—,
        que es una regla de negocio naciendo en el cliente.

        **Regla de admisión de este endpoint**, para que no degenere en cajón de sastre: solo entra
        lo que es de la INSTALACIÓN (no del titular, no del catálogo, no de un pedido), **estático
        entre despliegues o cambios de ajuste**, y necesario para PINTAR y no para decidir.

        ⚠️ Lo que cambia mientras el cliente navega **no está aquí**: la pausa de reservas vive en
        `GET /booking/status`, porque un snapshot de arranque mentiría en cuanto el operador
        accionara el interruptor.

        ⚠️ Nunca lleva datos del titular ni secretos. La *sitekey* de Turnstile es pública por
        diseño; su clave secreta no sale de aquí jamás.
      responses:
        '200':
          description: Ajustes públicos de esta instalación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicConfig'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

  /site:
    get:
      tags: [Instalación]
      operationId: getSiteFacts
      summary: Identidad, dirección y contacto de la instalación — el primer plato del menú de hechos
      description: |
        Lo que una landing necesita para pintar su pie, su página de contacto y sus datos legales **sin
        teclearlos**: hasta la F5 esos datos solo existían dentro del producto, y una landing propia no
        tenía forma de leerlos (la alternativa era copiarlos y que envejecieran).

        **Es un MENÚ y todo es opcional**: se usa lo que se quiera. Y **lo que la instalación no ha
        rellenado NO viaja** — sin TikTok no hay clave `tiktok`, no hay `""`—, así que quien pinta
        pregunta si la clave existe en vez de repetir la misma condición de cadena vacía.

        Se cachea en público (`Cache-Control: public, max-age=300` y `ETag`; con `If-None-Match`
        responde `304`). No lleva idioma: ninguno de sus campos se traduce.

        ⚠️ **`address` es dónde está el local y `legal.fiscal_address` es el domicilio fiscal**, que
        puede ser otro municipio. Para un bloque de contacto, `address`.
      responses:
        '200':
          description: Los hechos de la instalación, sin las claves que no tiene.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteFacts'
        '304':
          description: Sin cambios desde el `ETag` enviado en `If-None-Match`.

  /schedule:
    get:
      tags: [Instalación]
      operationId: getSchedule
      summary: El horario de la instalación — semana, temporadas y fechas especiales
      description: |
        Los hechos del calendario, de la **misma fuente que las reservas** (`special_dates` > `seasons` >
        `opening_hours`): lo que la web anuncia es lo que el embudo respeta. Es el dato del menú que más
        envejece si una landing lo teclea — se queda viejo el primer festivo.

        Sin una palabra traducida: números y horas `HH:MM`. El nombre del día lo pone quien pinta.

        ⚠️ **`weekday` es 0 = domingo** (la convención de `Date.getDay()` en el navegador), **no** la ISO
        donde 1 = lunes y 7 = domingo. Asumir la otra desplaza la semana entera.

        Las tres capas se pisan en este orden: una **fecha especial** manda sobre una **temporada**, y una
        temporada sobre el **horario semanal**.

        El estado EN VIVO no está aquí: es `/schedule/now`, porque no se cachea igual.
      responses:
        '200':
          description: El calendario de la instalación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '304':
          description: Sin cambios desde el `ETag` enviado en `If-None-Match`.

  /schedule/now:
    get:
      tags: [Instalación]
      operationId: getOpeningNow
      summary: ¿Está abierto ahora mismo?
      description: |
        El estado de apertura en este momento, resuelto por el servidor con la ventana efectiva del día
        (fecha especial, temporada u horario semanal) y en la zona horaria de la instalación.

        **Ruta aparte del horario a propósito**: esto cambia dos veces al día y justo en ese minuto es
        cuando importa, así que se cachea **un minuto**, mientras que el calendario se cachea cinco.

        ⚠️ `closes_at` viaja **solo si está abierto** y `opens_at` **solo si está cerrado**: decir «cierra a
        las 21:30» de un parque cerrado es un cartel que miente. Y `opens_at` puede faltar estando cerrado:
        es una instalación que aún no ha configurado horario.
      responses:
        '200':
          description: Abierto o cerrado, con el dato que aplica.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpeningNow'
        '304':
          description: Sin cambios desde el `ETag` enviado en `If-None-Match`.

  /rules:
    get:
      tags: [Instalación]
      operationId: getRules
      summary: Las normas del recinto, en el orden del recorrido de una visita
      description: |
        Las normas que el negocio opera desde el panel. Solo las **activas**: una norma desactivada es una
        norma retirada, y publicarla aquí la devolvería a la web por la puerta de atrás.

        **El orden es parte del dato**: primero por momento —`before`, `gate`, `inside`, que es el recorrido
        de una visita— y dentro de cada uno por la posición que fija el panel. Las que no tienen momento van
        al final. Una landing puede agrupar por `moment` sin decidir nada; el orden ya viene hecho, y
        `moments` trae el catálogo en su orden canónico.

        **El idioma viaja en la URL** (`lang`, obligatorio), como en `/sidebar/boot` y por lo mismo: la
        respuesta se cachea. La cadena de respaldo cuando una norma no está traducida —idioma → respaldo →
        la primera que haya— la resuelve el servidor; el cliente recibe texto, no un mapa de idiomas.

        `updated_at` es la fecha de la norma tocada más recientemente, **no la de hoy**: quien las leyó hace
        un año necesita saber si siguen siendo éstas.
      parameters:
        - $ref: '#/components/parameters/SidebarLang'
      responses:
        '200':
          description: Las normas activas en ese idioma.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rules'
        '304':
          description: Sin cambios desde el `ETag` enviado en `If-None-Match`.
        '422':
          description: Falta `lang` o no es uno de los idiomas soportados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /prices:
    get:
      tags: [Instalación]
      operationId: getPrices
      summary: Los precios de cada producto en cada tarifa
      description: |
        El desglose que pinta un carril de tarifas: por producto, lo que cuesta en cada tarifa, con el
        rótulo de la tarifa tal y como lo escribe el panel («Lunes a jueves», «Viernes, fines de semana,
        vísperas y festivos»).

        ⚠️ **No es lo mismo que `/catalog/products`**, aunque lo parezca: aquél publica el **«desde»** de
        cada producto (`from_price_cents`) para abrir su ficha en el embudo, y aquí está el precio de CADA
        tarifa. Un hecho, un sitio: el «desde» no se repite.

        Solo productos y zonas **activos**: lo que no se vende hoy no tiene precio público.

        Los importes van en **céntimos enteros**. El símbolo y el formato los pone quien pinta.

        ⚠️ Un producto que no se vende en una tarifa **omite esa entrada**; no viaja con `0`, que sería un
        precio, y uno muy llamativo.
      parameters:
        - $ref: '#/components/parameters/SidebarLang'
      responses:
        '200':
          description: Los precios activos en ese idioma.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prices'
        '304':
          description: Sin cambios desde el `ETag` enviado en `If-None-Match`.
        '422':
          description: Falta `lang` o no es uno de los idiomas soportados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /social-proof:
    get:
      tags: [Instalación]
      operationId: getSocialProof
      summary: La cifra de prueba social de la instalación
      description: |
        La valoración agregada de la instalación: media, número de opiniones que la sostienen, quién lo
        dice y su ficha pública. Es lo que hace falta para pintar una chapa de «4,8 sobre 5 · 320
        opiniones en Google» sin depender de la web del producto.

        ⚠️ **Es la única ruta de este bloque SIN `lang`**, y a propósito: una media, un recuento y una URL
        son los mismos en los tres idiomas. El texto de la atribución lo pone quien pinta.

        ⚠️⚠️ **`{}` es una respuesta NORMAL, no un fallo.** No hay cifra cuando la instalación no tiene
        fuente configurada, cuando su caché está fría o cuando no llega al umbral que hace publicable una
        media. Nunca viaja un `0`: una landing lo pintaría como «0,0 sobre 5».

        ⚠️⚠️ **Las RESEÑAS todavía no están aquí, y llegarán dentro de este mismo objeto** como una clave
        hermana de `rating`. Hoy no se publican porque su fuente está a mitad de cambio y su forma cambia
        con ella —gana la respuesta del negocio, las fotos, la marca de anónimo y la línea que declara el
        filtro aplicado—. Publicarlas antes obligaría a romper este contrato después.

        ▶ **Dos obligaciones de quien publique esta cifra**: acreditar la fuente (`source`) allí donde se
        enseñe, y **no** emitirla como `aggregateRating` de JSON-LD — son opiniones de un tercero sobre el
        negocio, no una valoración que el negocio pueda declarar como propia.
      responses:
        '200':
          description: La cifra, o un objeto vacío si no hay ninguna que se pueda sostener.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialProofFacts'
        '304':
          description: Sin cambios desde el `ETag` enviado en `If-None-Match`.

  /legal/documents:
    get:
      tags: [Instalación]
      operationId: getLegalDocuments
      summary: El índice de los textos legales
      description: |
        Los documentos ACTIVOS con su título y su fecha, sin el cuerpo: lo que hace falta para pintar los
        enlaces de un pie. El texto de cada uno, en `/legal/documents/{clave}`.

        `signed_version` aparece solo donde existe un documento **publicado y versionado** —hoy,
        `condiciones` y `waiver`—, y es un dato, no el texto: sirve para escribir «Condiciones v1, de tal
        fecha» sin inventárselo.
      parameters:
        - $ref: '#/components/parameters/SidebarLang'
      responses:
        '200':
          description: Los documentos activos en ese idioma.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalDocumentIndex'
        '304':
          description: Sin cambios desde el `ETag` enviado en `If-None-Match`.
        '422':
          description: Falta `lang` o no es uno de los idiomas soportados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /legal/documents/{clave}:
    get:
      tags: [Instalación]
      operationId: getLegalDocument
      summary: Un texto legal, con los marcadores ya resueltos
      description: |
        El documento en secciones `{h, p}`.

        ⚠️ **El cuerpo viaja INTERPOLADO**: el texto guardado lleva marcadores (`:legal_name`, `:legal_nif`,
        `:legal_address`, `:legal_email`) que resuelve el servidor. En crudo, una landing publicaría «El
        responsable del tratamiento de tus datos es :legal_name» en su política de privacidad.

        ⚠️ **Viaja la PÁGINA, no el documento firmado.** Donde hay versión publicada son dos textos
        distintos con dos oficios distintos: la página explica y la versión es a lo que alguien se obligó
        —en la instalación de referencia, el justificante tiene once secciones como página y una como
        versión—. La versión viaja al lado, en `signed_version`; el texto firmable vive en `/legal/waiver`.
      parameters:
        - name: clave
          in: path
          required: true
          schema: { type: string }
          description: 'La clave del documento: `privacidad`, `cookies`, `condiciones`, `aviso-legal`, `waiver`.'
        - $ref: '#/components/parameters/SidebarLang'
      responses:
        '200':
          description: El documento en ese idioma.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalDocument'
        '304':
          description: Sin cambios desde el `ETag` enviado en `If-None-Match`.
        '404':
          description: No hay documento activo con esa clave.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Falta `lang` o no es uno de los idiomas soportados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sidebar/boot:
    get:
      tags: [Instalación]
      operationId: getSidebarBoot
      summary: El arranque del cajón — la parte que no depende de quién mira
      description: |
        Los rótulos del cajón en un idioma y las rutas que pinta. Es lo que el layout del producto
        escribe en el atributo `data-boot`; una página que no pinte el producto (la landing propia de
        una instalación) lo pide aquí y recibe **exactamente lo mismo**.

        **El idioma viaja en la URL** (`lang`, obligatorio), al revés que en el resto de la API,
        donde sale de la sesión o de `Accept-Language`: esta respuesta se **cachea**
        (`Cache-Control: public, max-age=300` y `ETag`; con `If-None-Match` responde `304`), y una
        respuesta cacheable tiene que ser función de su URL.

        Los diccionarios conservan el camino de `lang/` (`account.login.email`) y van podados a lo
        que el cajón pinta. No llevan datos de nadie.
      parameters:
        - $ref: '#/components/parameters/SidebarLang'
      responses:
        '200':
          description: Rótulos y rutas del cajón en ese idioma.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SidebarBoot'
        '304':
          description: Sin cambios desde el `ETag` enviado en `If-None-Match`.
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

  /sidebar/session:
    get:
      tags: [Instalación]
      operationId: getSidebarSession
      summary: El arranque del cajón — la parte de quien mira
      description: |
        Quién es el titular (`null` para el visitante anónimo: la ruta es pública a propósito), su
        contexto de cuenta, los rótulos y rutas que solo viajan con sesión, y **el desenlace de un
        pago pendiente de enseñar**.

        ⚠️ **Leerla CONSUME ese desenlace**: `outcome` y `orderCode` llegan una vez y la siguiente
        lectura devuelve `null`, igual que ocurre al pintar una página del producto. Sin eso, el
        cajón se reabriría en cada página con el mismo «pago confirmado».

        `Cache-Control: no-store`: lleva datos del titular. Se identifica por la cookie de sesión.
      parameters:
        - $ref: '#/components/parameters/SidebarLang'
      responses:
        '200':
          description: El estado de quien mira.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SidebarSession'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

  /legal/waiver:
    get:
      tags: [Instalación]
      operationId: getWaiverDocument
      summary: El texto firmable del waiver, vigente
      description: |
        El SNAPSHOT vigente del waiver en el idioma negociado, con el identificador que el cliente
        devuelve al aceptar (`POST /auth/register` con `accept_waiver`, o `POST /me/waiver`).
        Fase 6 (`specs/waiver-probatorio.md` §4.2, §4.4).

        **Público a propósito**: quien se está dando de alta todavía no tiene sesión y es justo cuando
        lo necesita. Lo que publica es lo que se firma —una versión inmutable, ya interpolada—, nunca
        la página editable del CMS.

        `document` es `null` cuando no hay nada que firmar aquí: `mode` distinto de `interno`, o ninguna
        versión publicada todavía. **No es un error**: es un estado legítimo de la instalación.

        Si el idioma pedido no se publicó en la versión vigente, cae al de respaldo (el mismo respaldo
        que aplica la web al pintar el texto) y `document.locale` dice cuál se sirvió: el idioma es
        parte de la prueba.
      responses:
        '200':
          description: El modo de la instalación y, si lo hay, el texto vigente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaiverDocument'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

  /booking/status:
    get:
      tags: [Compra]
      operationId: getBookingStatus
      summary: ¿Se puede reservar online ahora?
      description: |
        Estado del interruptor de reservas online (#218) y el aviso que lo sustituye: título,
        mensaje y canales de contacto, **ya traducidos** al idioma resuelto para la petición.

        Sin esto, un cliente solo se entera de la pausa **después** de intentar crear el pedido, por
        el 409 `reservations_paused` — mientras que la web sustituye el flujo entero por el aviso
        antes de que el cliente elija nada.

        **Es ESTADO, no configuración**, y por eso vive aquí y no en `GET /config`: el operador
        acciona el interruptor con clientes navegando. Conviene releerlo al abrir el flujo de compra
        y de nuevo al recibir un 409 `reservations_paused`.

        ⚠️ Los canales se ofrecen **a la vez**, no en cascada: si hay teléfono y WhatsApp, se pintan
        los dos. `contact_url` no es «la URL de contacto» sino **el último recurso**, y llega ya
        decidido por el servidor —`null` cuando hay algún canal directo—, para que el cliente pinte
        lo que no sea nulo sin evaluar ninguna condición.
      responses:
        '200':
          description: Estado de las reservas online y su aviso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingStatus'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

  /catalog/zones:
    get:
      tags: [Catálogo]
      operationId: getCatalogZones
      summary: Zonas operativas
      description: |
        Zonas que OPERAN, en el orden configurado en el panel. Una zona desactivada no vende: sus
        productos ya no aparecen en el catálogo, así que tampoco se lista la zona.

        La zona es un constructo OPERATIVO (franjas y aforo), no una categoría comercial: los
        nombres de producto ya la llevan («Jump · 1 hora»). Se expone porque el `slug` es la clave
        del deep-link con el que la landing enlaza «Comprar» a una zona concreta.

        Desde el contrato **1.8.0** sirve además la FICHA de la zona: su descripción y su foto. Es
        lo que necesita para pintarse quien venda SIN landing del producto —la app nativa, o la
        landing propia de una instalación—, y por eso no es material de presentación sino un hecho
        más del menú.

        ⚠️ **Los dos campos de la ficha son OPCIONALES y no viajan si la instalación no los
        rellenó**: una zona sin descripción no trae la clave `description`, en vez de traerla como
        `""`. Lo que sigue fuera es la presentación propiamente dicha —color de acento, superficie,
        número de atracciones—, y la zona anidada dentro de cada producto sigue siendo solo
        identidad: ahí cada campo se paga en todas las filas.
      responses:
        '200':
          description: Zonas operativas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogZoneList'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

  /catalog/products:
    get:
      tags: [Catálogo]
      operationId: getCatalogProducts
      summary: Productos en venta
      description: |
        Entradas y packs en venta online cuya zona opera, en el orden configurado. Los complementos
        no están: no se contratan sueltos, viven dentro de un producto y llegan en su ficha.

        **No pagina**: el catálogo de una instalación se cuenta por decenas y sus clientes lo
        pintan y lo filtran entero. `meta.total` viaja igual que en cualquier otra lista.
      parameters:
        - name: type
          in: query
          required: false
          description: Filtra a un tipo de producto. Sin él, llegan los dos.
          schema:
            type: string
            enum: [entry, pack]
      responses:
        '200':
          description: Catálogo de productos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogProductList'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

  /catalog/products/{product}:
    get:
      tags: [Catálogo]
      operationId: getCatalogProduct
      summary: Ficha de un producto
      description: |
        La ficha completa: lo mismo que trae la lista, más los mínimos y máximos contratables, los
        campos del formulario de evento (packs) y los complementos que ese producto ofrece.

        Un id que no está en el catálogo devuelve **404**, sin distinguir si no existe, si no está
        en venta o si su zona no opera: distinguirlo describiría el contenido de la base de datos a
        quien pregunta a ciegas.
      parameters:
        - name: product
          in: path
          required: true
          description: Id del producto.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Ficha del producto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogProductDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

  /catalog/products/{product}/addons:
    post:
      tags: [Catálogo]
      operationId: resolveProductAddons
      summary: Los complementos, resueltos contra tu selección
      description: |
        La ficha del producto publica la **configuración** de cada complemento; esto publica el
        **resultado de aplicarla** a lo que llevas elegido: la partición en grupos excluyentes, la
        nota de precio, la etiqueta, las unidades gratis, los topes, la poda **en cadena** de las
        dependencias «requiere» y la regla de que un complemento de pago sin tarifa ese día ni
        siquiera se ofrece. Nada de eso se puede deducir desde el cliente sin reimplementar reglas
        de servidor.

        Es `POST` porque lleva tu selección, **no porque tenga efectos**: no reserva, no cobra y no
        guarda nada.

        ### Qué mandar

        - **`quantity`** es la cantidad de la LÍNEA (los invitados de un pack). Decide la cantidad de
          los complementos por invitado, así que cambiarla cambia el importe.
        - **`addons`** son las cantidades de los complementos de cantidad libre. Una cantidad `0`
          vale y significa «este ya no lo quiero», para no tener que rehacer la lista entera.
        - **`choices`** es el elegido de cada grupo excluyente. Va aparte de las cantidades porque
          dentro de un grupo lo que selecciona es **ser el elegido**, no tener cantidad: con una
          lista plana, dos miembros marcados serían ambiguos. Un grupo que no mandes se resuelve con
          su elegido por defecto, así que la **primera** llamada puede ir sin `choices` y ya
          devuelve el estado inicial correcto.
        - **`date` y `time`** son opcionales y hacen DOS cosas: tarifican la línea (`line`) y, desde
          la hora extra, deciden la oferta de los complementos que **OCUPAN aforo**
          (`occupies_after_parent`): uno que a esa hora no aterriza —su franja siguiente no existe,
          está cerrada o está llena— **no se ofrece** (la misma regla que el complemento de pago sin
          tarifa) y `selection` lo suelta aunque lo mandes; el que aterriza sale con
          `max_quantity`/`can_increase` capados por sus plazas reales y por «no se quedan más de los
          que entran». Cambiar de hora obliga a re-preguntar. Sin `date`/`time`, los ocupantes viajan
          sin decorar y `line` va nula — el checkout siempre re-valida y su rechazo es
          `line_addon_occupancy`/`line_addon_over_quantity`.
          ⚠️ El **precio** de un complemento sigue siendo el de HOY (no varía por el día reservado):
          fecha del precio y fecha de la ocupación son dos preguntas distintas.

        ### Qué devuelve, y por qué junto

        Es la pantalla con más clics del embudo, y cada clic cambia el importe. Con dos endpoints
        cada clic costaría **2 peticiones** contra un `throttle:api` de 60/min **compartido** con
        disponibilidad, catálogo y presupuesto. Por eso `line` —el pie de la línea— viene en la misma
        respuesta. ⚠️ **El dinero no se calcula aquí**: sale del mismo cálculo que sirve
        `orders/quote` y que alimenta la creación del pedido.

        Y **`selection` es lo que hay que guardar en la cesta**: ya lleva los obligatorios inyectados
        y los dependientes huérfanos fuera, así que una cesta construida con ella es la que el
        checkout aceptará. Traducir a mano lo pintado en lo que se guarda es un error fácil y caro.
      parameters:
        - name: product
          in: path
          required: true
          description: Id del producto BASE (una entrada o un pack, nunca un complemento).
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddonSelectionRequest'
      responses:
        '200':
          description: Los complementos resueltos, y el pie de la línea si mandaste día y hora.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedAddons'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

  /availability/{product}/dates:
    get:
      tags: [Compra]
      operationId: availabilityDates
      summary: Días reservables de un producto
      description: |
        Los días con alguna franja viva, con el precio de cada uno. El precio va aquí porque un
        calendario de compra sin precios obliga a entrar día a día para comparar, y porque
        calcularlo en el cliente significaría reimplementar la resolución de tarifas.

        **No lleva cesta a propósito**: un día se ofrece si tiene franjas. Si cabe o no la cantidad
        que se quiere lo decide la franja, y saberlo aquí exigiría evaluar el cupo de todas las
        horas de todos los días del horizonte para pintar un calendario.

        ⚠️ Que un día aparezca **no reserva nada**: lo dicho es cierto en el instante en que se
        calcula, y el checkout vuelve a comprobarlo todo bajo bloqueo.
      parameters:
        - name: product
          in: path
          required: true
          description: Id del producto.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Días reservables, en orden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferedDateList'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

  /availability/{product}/times:
    post:
      tags: [Compra]
      operationId: availabilityTimes
      summary: Horas reservables de un día
      description: |
        Las horas de entrada de ese día con el cupo que les queda.

        **Es `POST` y lleva la cesta, y las dos cosas son necesarias.** El cupo se calcula
        descontando los ocupantes que la propia cesta del cliente ya retiene: sin ellos, una segunda
        línea sobre la misma franja vería libres las plazas que su primera línea ya ocupa, y el
        checkout la rechazaría después. La cesta —líneas con complementos anidados— no cabe con
        garantías en una URL, así que viaja en el cuerpo. **No cambia nada del servidor.**

        La cesta es OPCIONAL: la primera compra empieza sin nada elegido, y ausente equivale a vacía.
        La línea que se está configurando **no** debe ir en ella; si no, se contaría a sí misma.

        ⚠️ **`available` no es `max_quantity`.** En una entrada coinciden; en un pack, `available`
        son las plazas que le quedan a la franja y `max_quantity` cuántos invitados admite esa
        fiesta. Un selector de cantidad construido sobre `available` dejaría pedir de más.
      parameters:
        - name: product
          in: path
          required: true
          description: Id del producto.
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvailabilityTimesRequest'
      responses:
        '200':
          description: Horas reservables de ese día, en orden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferedTimeList'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

  /reservations/{reservation}/guest-form:
    get:
      tags: [Reservas]
      operationId: getGuestForm
      summary: El formulario de invitados de una reserva
      description: |
        Los datos por invitado de un evento ya reservado y pagado: quién viene, con qué alergias y
        qué observaciones. Se rellena DESPUÉS de comprar, porque al reservar todavía no se sabe.

        **Lleva el ESQUEMA, no solo los datos.** Las columnas por invitado las decide cada
        instalación desde su panel (`guest_fields`), así que un cliente que las llevara quemadas
        dejaría de funcionar en cuanto alguien añadiera una. Vienen con la etiqueta ya traducida y
        con su `required`.

        ### Autorización — es el único endpoint que se abre con una FIRMA

        Se entra de dos formas: **con el enlace firmado** que llega por correo (sin cuenta) o **como
        titular autenticado** del pedido. La firma cubre la URL exacta, así que la del correo —que
        apunta a una página web— **no** vale aquí: la respuesta de este endpoint incluye `save_url`,
        que es la URL de guardar ya firmada y con la misma caducidad. Ese es el canje.

        ### Qué significa cada «no»

        - **403** — ni firma válida ni titularidad. Es lo primero que se comprueba, a propósito.
        - **410** — el titular ejerció su derecho de supresión: el canal queda cerrado y los datos
          de los menores ya no se pueden abrir ni reescribir.
        - **404** — no es una reserva con formulario de invitados de un pedido pagado. Solo lo ve
          quien ya demostró acceso, así que no revela qué reservas existen.

        ⚠️ La respuesta va con `Cache-Control: no-store`: contiene datos personales de menores.
      parameters:
        - name: reservation
          in: path
          required: true
          description: Id de la reserva (la línea de pack del pedido).
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: El formulario, su esquema y lo ya rellenado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestForm'
        '403':
          description: Ni firma válida ni titularidad (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: El titular se anonimizó; el canal está cerrado (`not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

    put:
      tags: [Reservas]
      operationId: saveGuestForm
      summary: Guardar el formulario de invitados
      description: |
        **`PUT` y no `PATCH`**: el envío sustituye la lista de invitados entera —se mandan las N
        fichas que hay ahora—, no la parchea ficha a ficha.

        Todo se sanea en el servidor contra el esquema del pack y contra la cantidad ACTUAL de
        invitados: las claves que no estén en `guest_fields` se descartan, y si el operador subió el
        número de invitados aparecen fichas nuevas vacías. Los datos generales se MEZCLAN
        conservando lo que se respondió al reservar.

        Se autoriza igual que el `GET`, y la URL firmada que hay que usar es la `save_url` que aquél
        devuelve.

        **409 `guest_form_closed`** cuando la fiesta ya se ha celebrado: entonces el formulario se
        consulta pero no se edita. No es un problema de permisos —el enlace sigue siendo válido—,
        es que ha pasado el momento.
      parameters:
        - name: reservation
          in: path
          required: true
          description: Id de la reserva (la línea de pack del pedido).
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestFormRequest'
      responses:
        '200':
          description: Guardado. Devuelve el formulario con el progreso recalculado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestForm'
        '403':
          description: Ni firma válida ni titularidad (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: La fiesta ya se celebró; el formulario es de solo lectura (`guest_form_closed`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: El titular se anonimizó; el canal está cerrado (`not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

  /reservations/{reservation}/invitation:
    put:
      tags: [Reservas]
      operationId: personalizeInvitation
      summary: Personalizar la invitación digital de una reserva
      description: |
        Tema, nombre y edad de quien cumple, la línea «Te invita» y si se enseña el teléfono.

        **Se entra igual que al formulario de invitados**: con el enlace firmado o como titular del
        pedido, y con la misma escalada 403 → 410 → 404. No hay una puerta nueva.

        ⚠️⚠️ **Escribe SOLO la invitación, nunca la reserva**, y ésa es la razón de que sea un
        endpoint aparte y no un campo del `PUT` del formulario: `order_items.updated_at` es el
        testigo con el que ese formulario detecta que el parque movió la reserva, y tocarlo aquí
        dejaría obsoleta la página del anfitrión **por cambiar el color de una banda**.

        ⚠️ Un `honoree_name` o un `host_line` con un enlace o un correo **se rechaza sin 422**: ese
        campo se queda como estaba y el resto se guarda. Lo que se publica bajo el dominio del parque
        no puede mandar a nadie a pagar a otro sitio, y un 422 por ello convertiría un descuido de
        redacción en un formulario que no guarda nada.
      parameters:
        - name: reservation
          in: path
          required: true
          description: Id de la reserva (la línea de pack del pedido).
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationPersonalizeRequest'
      responses:
        '200':
          description: La invitación ya personalizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '403':
          description: Ni firma válida ni titularidad (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: El titular ejerció su derecho de supresión y el canal queda cerrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

  /reservations/{reservation}/invitation/replies/{reply}:
    delete:
      tags: [Reservas]
      operationId: dismissInvitationReply
      summary: Quitar una respuesta de la lista («no lo apuntes»)
      description: |
        El anfitrión retira una respuesta que no quiere apuntar.

        ❗❗ **Sin esto el anfitrión se queda ATRAPADO.** Un «sí» pendiente es una plaza con dueño y
        sube el suelo por debajo del cual no se puede bajar el número de invitados: una respuesta que
        el anfitrión no quiere le bloquearía esa bajada **sin darle forma de retirarla**.

        ⚠️ **No borra nada.** La respuesta sigue en su tabla hasta que la poda se la lleve a los 14
        días de la visita; lo que cambia es que deja de contar, de proponerse y de ocupar plaza.
      parameters:
        - name: reservation
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: reply
          in: path
          required: true
          description: Id de la respuesta, tal y como viene en `pending_replies[].id`.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: |
            Retirada. **También cuando ya lo estaba**: el gesto es idempotente y dos pestañas del
            anfitrión no tienen por qué pelearse por quién llegó antes.
        '403':
          description: Ni firma válida ni titularidad (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: El titular ejerció su derecho de supresión y el canal queda cerrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

  /invitations/{token}:
    get:
      tags: [Invitación]
      operationId: getInvitationCard
      summary: La invitación que abre un padre
      description: |
        La tarjeta pública de una fiesta: quién cumple, cuándo, dónde y qué menú hay.

        ### Es una HOJA EN BLANCO, y de ahí sale todo lo demás

        No lleva **ni una respuesta**, ni cuántos han contestado, **ni si un nombre concreto ya
        contestó**. Ése es exactamente el motivo por el que su enlace se puede repartir a un grupo de
        clase entero por un chat de padres: quien lo tiene no puede averiguar quién va a la fiesta.

        ### Un solo «no», y el mismo

        Token inexistente, invitación anulada, pedido cancelado o titular anonimizado responden **el
        mismo 404**. Distinguirlos sería un oráculo: un 410 para «cancelada» frente a un 404 para
        «no existe» le diría a un desconocido que ese token existió.

        ⚠️ **No hace falta sesión**, así que la respuesta lleva su propio `Cache-Control: no-store`:
        el `no-store` de la superficie autenticada no la cubriría, y lo que sirve es el nombre y la
        edad de un menor.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          description: Los doce caracteres del enlace, opacos — no llevan el nombre ni la edad de nadie.
          schema:
            type: string
            minLength: 12
            maxLength: 12
      responses:
        '200':
          description: La tarjeta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationCard'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'
    post:
      tags: [Invitación]
      operationId: replyToInvitation
      summary: Contestar a una invitación
      description: |
        Lo que manda un padre: el nombre del niño y si viene. Todo lo demás es opcional.

        ### Lo que se puede saber por la respuesta está ACOTADO

        Un nombre **repetido** devuelve `accepted: true`, exactamente igual que la primera vez, y
        **no existe un motivo «repetido»**. Decir «ya nos habéis contestado por Hugo» le confirmaría
        a cualquiera con el enlace quién va a esa fiesta, y bastaba con ir probando nombres. La hoja
        es en blanco también en sus errores.

        ### Los «no» que sí se dicen, y por qué son seguros

        `closed` (la reserva ya no admite cambios), `cutoff` (pasó el plazo), `no_name` y `too_many`.
        **Ninguno depende del nombre que traiga la respuesta**, así que contestan igual a todo el
        mundo y no sirven para preguntarle nada a la lista.

        ❗❗ **La lista completa NO rechaza** (`DECISIONES #700`). Hacerlo abría el mismo oráculo que el
        motivo «repetido»: un nombre ya escrito se aceptaba y uno nuevo recibía «full», así que se
        podía reconstruir la lista probando. El «sí» que no cabe se acepta igual y sale en el aviso
        del anfitrión — «hay N respuestas que ya no caben: sube el número o avisa a esas familias» —,
        que es quien sabe quién va. Lo que frena el abuso es `too_many`, que no mira el nombre.

        ⚠️ Todo se vuelve a comprobar **al contestar**, no al pintar la tarjeta: entre que el padre
        abre el enlace y pulsa pueden pasar la fiesta, el plazo o los demás «sí».
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            minLength: 12
            maxLength: 12
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationReplyRequest'
      responses:
        '200':
          description: |
            El desenlace. ⚠️ **200 también cuando `accepted` es `false`**: que la lista esté completa
            no es un error del padre, y un 4xx haría que un cliente lo tratara como tal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationReplyResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

  /orders:
    post:
      tags: [Compra]
      operationId: createOrder
      summary: Crear la reserva y abrir su cobro
      description: |
        Convierte la cesta en un pedido y devuelve, junto a él, **el formulario firmado que hay que
        POSTear a la pasarela**. El cliente reenvía `payment.fields` tal cual a `payment.url`: van
        firmados y tocar uno solo invalida la firma.

        **Crea estado**: desde este momento el pedido existe y RETIENE aforo, se complete el pago o
        no. `order.expires_at` dice hasta cuándo; si nadie paga, la plaza vuelve al inventario.

        **Todo se recalcula en el servidor.** Los importes no se envían: se derivan de la cesta con
        las mismas reglas que `orders/quote` había anticipado. Un precio manipulado en el cliente no
        tiene por dónde entrar.

        **Qué puede salir mal**, y todos con su `code`:

        - **422** — esa cesta no se puede vender: agotada, fuera de horario, sin precio ese día,
          faltan datos del pack… El `code` distingue cada motivo y `params` trae el producto y la
          fecha de la línea culpable.
        - **409** — las reservas están en pausa, o ya tienes demasiadas pendientes de pago.
        - **429** — has creado reservas demasiado seguidas.
        - **502** — el pedido se creó pero la pasarela no abrió el cobro. **El pedido ya se ha
          soltado**: no retiene plaza y hay que volver a empezar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Reserva creada y cobro abierto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPayment'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: La reserva no se admite (`reservations_paused`, `too_many_pending_orders`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          description: |
            No se pudo abrir el cobro (`payment_unavailable`). El pedido se ha soltado y no retiene
            aforo: se puede volver a intentar la compra desde el principio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/Maintenance'

  /orders/{code}:
    get:
      tags: [Compra]
      operationId: getOrder
      summary: Un pedido del titular
      description: |
        Para recuperar un pedido concreto sin recorrer la paginación de `me/orders` — el caso real es
        un cliente que perdió la respuesta de la creación y necesita saber si su reserva existe y
        hasta cuándo aguanta.

        Un código que no es de quien pregunta responde **404**, igual que uno inexistente: decir
        «existe pero no es tuyo» convertiría esto en un oráculo de códigos ajenos.
      parameters:
        - name: code
          in: path
          required: true
          description: Código visible del pedido.
          schema:
            type: string
      responses:
        '200':
          description: El pedido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

  /orders/{code}/event-data:
    get:
      tags: [Compra]
      operationId: getOrderEventData
      summary: Las respuestas del pack de un pedido
      description: |
        Lo que el cliente contestó **al reservar** un pack: por convención de la instalación de
        origen, el nombre del homenajeado, su edad y las alergias. Es lo que el resumen de la compra
        confirmada enseña bajo cada línea.

        ### Por qué es un endpoint y no un campo del pedido

        Son datos personales de un **MENOR**, y las alergias son dato de salud del **art. 9**. Como
        campo de `OrderItem` viajarían en cada página de `me/orders` —una lista paginada que se pide
        para ver el historial, no para leer alergias de niños—, así que pedirlos es un acto explícito
        del cliente. `me/orders` y `GET orders/{code}` **no los llevan**, y hay test de ello.

        ### Qué NO devuelve

        - **Nada que no sea sensible.** Ni nombre de producto, ni fecha, ni importes: eso ya está en
          `GET orders/{code}`. Empareja por `reservation_id`, que es el `id` de la línea de allí.
        - **Las respuestas del post-form.** `event_data` guarda juntas las de las dos fases y aquí
          solo salen las de la RESERVA; lo que se rellena después vive en
          `GET reservations/{id}/guest-form`, que se abre con firma. Dos caminos hacia el mismo dato
          del art. 9 es superficie que nadie pidió.
        - **Las respuestas cuyo campo ya no existe.** Si el pack se editó tras la compra, lo
          contestado a un campo retirado no sale: sin campo no hay etiqueta ni fase que emparejar.

        Una reserva sin respuestas **sí aparece**, con `answers` vacío: así se distingue «este pack
        no pedía nada» de «esta línea no venía en la respuesta».

        ⚠️ La respuesta va con `Cache-Control: no-store`. Un código que no es de quien pregunta
        responde **404**, igual que uno inexistente.
      parameters:
        - name: code
          in: path
          required: true
          description: Código visible del pedido.
          schema:
            type: string
      responses:
        '200':
          description: Las respuestas del evento, por reserva.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEventData'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

  /orders/{code}/guest-minors:
    get:
      tags: [Compra]
      operationId: getOrderGuestMinors
      summary: Los justificantes de menores invitados de un pedido
      description: |
        Quién ha firmado ya la autorización de un **menor invitado** a esta reserva, y **el enlace**
        para repartir a los padres que faltan.

        Un menor invitado es un niño que **no es menor a cargo** de quien reservó: el amigo del hijo,
        o los cien niños de una excursión de colegio. Un adulto sin cuenta lo autoriza desde una
        pantalla pública, y quien reservó es el **responsable**.

        ### Por qué es un endpoint y no un campo del pedido

        Dos razones, y la segunda es propia:

        - **Son datos de menores de OTRAS familias.** Mismo principio que `event-data`: como campo
          irían en cada página de `me/orders`, que se pide para ver el historial.
        - **El `link` es una credencial portadora.** Quien lo tenga puede abrir la pantalla de firma
          sin sesión. No puede viajar en nada que se siembre en el HTML de cada página: por eso vive
          aquí, donde se pide a propósito.

        ### Qué NO devuelve

        - **Nada de los otros padres.** Ni su nombre, ni su relación con el menor, ni su correo o
          teléfono. El responsable ve **quién viene y si está firmado**, y nada más.
        - **Un denominador inventado.** No se dice «3 de 100»: no se puede saber cuántos de los
          comprados son menores. Lo que sí se dice es `places` —las plazas de esa reserva que
          todavía no tienen dueño—, que es un hecho y no una estimación.

        ### Una entrada por RESERVA

        El justificante cuelga de la **visita**, no de la compra: un pedido con una excursión el
        lunes y una entrada el miércoles devuelve **dos** entradas, cada una con su enlace, su día y
        su cupo. Un padre autoriza que su hijo entre a una visita concreta.

        `link` es `null` cuando el pedido no está pagado o la visita ya pasó: repartirlo entonces
        sería mandar a un padre a una pantalla que le dirá que no.

        ⚠️ La respuesta va con `Cache-Control: no-store`. Un código que no es de quien pregunta
        responde **404**, igual que uno inexistente.
      parameters:
        - name: code
          in: path
          required: true
          description: Código visible del pedido.
          schema:
            type: string
      responses:
        '200':
          description: Los justificantes del pedido y su enlace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderGuestMinors'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

  /orders/{code}/payment:
    post:
      tags: [Compra]
      operationId: retryOrderPayment
      summary: Reintentar el cobro de un pedido
      description: |
        Abre un intento de cobro NUEVO sobre un pedido que sigue vivo, y **extiende su retención de
        aforo** al hacerlo. Devuelve lo mismo que crear la reserva, así que la respuesta trae el
        pedido con su `expires_at` ya actualizado.

        No crea aforo nuevo: reusa la plaza que ese pedido ya retiene. Por eso —a diferencia de
        `POST /orders`— **no** se aplica el tope de pedidos pendientes; aplicarlo dejaría sin poder
        pagar justo a quien más reservas pendientes tiene.

        Sin cuerpo: no hay nada que enviar. El importe y la cesta ya son los del pedido.

        **Qué puede salir mal:**

        - **409 `reservations_paused`** — hay una pausa del operador; tu reserva sigue intacta.
        - **409 `order_not_retryable`** — ese pedido ya no se puede pagar: no existe para ti, no
          está pendiente, o su retención venció y la plaza volvió al inventario. Los tres casos dan
          la misma respuesta a propósito.
        - **429** — has reintentado demasiadas veces seguidas. **Tu reserva sigue intacta**: espera
          y vuelve a intentarlo.
        - **502** — la pasarela no abrió el cobro. El pedido **no** se ha tocado y se puede
          reintentar.
      parameters:
        - name: code
          in: path
          required: true
          description: Código visible del pedido.
          schema:
            type: string
      responses:
        '200':
          description: Cobro reabierto; la retención del pedido queda extendida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPayment'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: El reintento no se admite (`reservations_paused`, `order_not_retryable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          description: No se pudo abrir el cobro (`payment_unavailable`). El pedido sigue vivo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/Maintenance'

  /orders/{code}/payment-status:
    get:
      tags: [Compra]
      operationId: getOrderPaymentStatus
      summary: En qué ha quedado el pago
      description: |
        Endpoint de SONDEO: se consulta en bucle mientras se espera el desenlace. Es deliberadamente
        pequeño —no devuelve el pedido entero— porque se pregunta cada pocos segundos; para eso está
        `GET orders/{code}`.

        Existe porque el desenlace no siempre vuelve por donde se fue: con un terminal que no incluye
        los datos firmados en la redirección, la única confirmación llega por la notificación
        server-to-server de la pasarela, y llega cuando llega.

        **Dos ejes, y hacen falta los dos.** `order_status` dice qué ha sido de la RESERVA y
        `payment_status` qué ha sido del último INTENTO de cobro. Con uno solo, un pedido cuya
        tarjeta fue rechazada y uno que nadie ha intentado pagar son idénticos —ambos `pending`—, y
        el cliente no sabría que puede reintentar.

        **Cómo leerlo:**

        - `payment_status: pending` → sigue esperando; vuelve a preguntar.
        - `order_status: paid` → hecho.
        - `payment_status: failed` + `can_be_retried: true` → ofrece reintentar, y usa
          `declined_reason` para decir por qué («tarjeta caducada» invita a probar otra,
          «denegada por tu banco» invita a llamar al banco).
        - `order_status: expired` → la retención venció y la plaza volvió al inventario; hay que
          rehacer la reserva.

        ⚠️ **Consultar no confirma.** Este endpoint no transiciona nada: el único autorizado a dar
        un pedido por pagado es el receptor de la respuesta firmada de la pasarela.

        ### Para un cliente NATIVO (app móvil)

        **El sondeo es tu único camino al desenlace, y eso es una decisión declarada, no un
        descuido.** La vuelta de la pasarela es una redirección de NAVEGADOR: un cliente nativo no la
        recibe, y la URL de retorno no admite parámetros donde colgar un identificador de sesión, así
        que hoy no hay deep link que dispare. Abre la pasarela en un navegador del sistema y sondea
        aquí.

        ⚠️ **Y el sondeo solo llega a `paid` si la instalación tiene configurada la notificación
        server-to-server** de la pasarela (`redsys_merchant_url`). Sin ella, y con un terminal que no
        incluye los datos firmados en la redirección, el ÚNICO camino a `paid` es la vuelta del
        navegador — que en una app nativa no ocurre—: el pedido acabaría caducando con la tarjeta ya
        cobrada. **Es un prerequisito duro de la instalación**, no una recomendación.
      parameters:
        - name: code
          in: path
          required: true
          description: Código visible del pedido.
          schema:
            type: string
      responses:
        '200':
          description: Estado del pago.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentStatus'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

  /orders/quote:
    post:
      tags: [Compra]
      operationId: quoteCart
      summary: Presupuestar una cesta
      description: |
        Devuelve lo que suma una cesta y lo que se cobraría ahora, **sin crear nada**: no reserva
        plaza, no comprueba disponibilidad y no admite la reserva. Existe para que ningún cliente
        tenga que reimplementar el precio —tarifa del día, complementos y señal— ni crear un pedido
        (que sí bloquea aforo) solo para enseñar un total.

        Los importes son los que se cobrarán: salen del mismo contrato de dominio que consume la web
        y que alimenta la creación del pedido.

        **Dos avisos sobre lo que NO valida**, porque un presupuesto no es un checkout:

        - una línea cuyo producto ya no se vende **no aparece** en la respuesta; su hueco en la
          secuencia de `index` es la señal de que cayó;
        - una línea sin precio para la tarifa de ese día llega con `unit_price_cents: null` y
          `subtotal_cents: 0`. Se puede presupuestar, pero **no se puede comprar**: `POST orders` la
          rechazará.

        Es `POST` porque la cesta no cabe con garantías en una URL, no porque tenga efectos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartRequest'
      responses:
        '200':
          description: La cesta tarificada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

  /cart/validate-line:
    post:
      tags: [Compra]
      operationId: validateCartLine
      summary: ¿Cabe esta línea en mi cesta?
      description: |
        Comprueba una línea **antes** de meterla en la cesta, y dice en qué quedaría. Para un cliente
        que guarda su cesta en el navegador, este es el único momento en que el servidor participa al
        añadir: sin él habría que reimplementar reglas de servidor en el cliente.

        ⚠️ **Y una de ellas no se descubre leyendo código.** Las respuestas de un campo `number` se
        sanean a dígitos, así que una edad contestada «cinco» **el servidor la ve vacía** mientras
        cualquier validación ingenua en el cliente la ve contestada. El cliente lo descubriría cinco
        pasos después, ya identificado, con un error que ni siquiera nombra el campo.

        ### Responde 200 aunque la línea no sirva

        Preguntar «¿puedo?» y que te contesten «no, y por esto» no es un error de la petición: el
        veredicto va en `valid` y el motivo en `problems`. Solo la FORMA da 422 — una fecha que no es
        una fecha—. Mismo criterio que `GET me/reservation-eligibility`.

        ### Lo que devuelve aunque la línea sea válida

        - **`quantity`** — con cuántas unidades entraría **de verdad**. El servidor recorta al cupo
          en silencio desde siempre (anti-manipulación); `quantity_capped` avisa de que lo hizo, para
          que no se pinte la cantidad que se pidió en vez de la que se tiene.
        - **`merges_with_index`** — el índice de la línea de `items` que la **absorbería**. Solo se
          funden entradas del mismo producto, día y hora **sin complementos**: un pack es siempre su
          propio bloque. Sin este dato, un cliente crearía una línea duplicada donde el servidor
          habría sumado cantidades.

        ### Los `problems` vienen sin contexto, a propósito

        Cada motivo trae su código y, si aplica, el campo del evento afectado. **Los números que dan
        sentido al aviso ya los publicas tú**: `min_quantity` y los `event_fields` con su etiqueta
        están en `GET catalog/products/{id}`, y `cart_max_lines` en `GET config`. Repetirlos aquí
        sería un segundo sitio del que leer el mismo valor.

        **No retiene nada.** Lo que dice es cierto en el instante en que se dice; quien garantiza la
        plaza es el checkout, que revalida todo al crear el pedido.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartLineCheckRequest'
      responses:
        '200':
          description: El veredicto de la línea.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartLineVerdict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

  /me:
    get:
      tags: [Cuenta]
      operationId: getMe
      summary: El usuario autenticado
      description: |
        Devuelve el perfil de quien hace la petición. La identidad sale SIEMPRE del guard, nunca de
        un parámetro, así que no hay superficie de IDOR.

        No exige el correo verificado: el registro «pay-first» crea cuentas sin verificar y el
        cliente necesita poder leer ese estado (`email_verified_at: null`) para pedir el reenvío.
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '200':
          description: Perfil del usuario autenticado.
          headers:
            Cache-Control:
              description: Siempre `no-store` en respuestas autenticadas (`RGPD-04`).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

    patch:
      tags: [Cuenta]
      operationId: updateMyProfile
      summary: Actualizar mi perfil
      description: |
        Nombre, teléfono, idioma y —si cambia— **solicitud** de cambio de correo.

        ⚠️⚠️ **El correo NO se cambia aquí: se SOLICITA.** El vigente sigue intacto y el nuevo espera
        en `pending_email` hasta que el titular abra el enlace que se le manda **al buzón nuevo**. Esa
        es la defensa de fondo: si alguien entra en una sesión ajena y pide el cambio, el dueño **no
        pierde el acceso** — y además recibe un aviso al buzón viejo, con la dirección nueva
        enmascarada.

        ⚠️ **Reconfirmar la contraseña solo hace falta si el correo cambia.** Pedirla para corregir
        una errata en el teléfono no defiende nada y hace que el titular evite la pantalla. Cuando se
        pide, cuenta para el **mismo limitador** que `PUT /me/password`.

        La respuesta trae el perfil ya actualizado: su `email` sigue siendo **el viejo** —que es lo
        que el cliente necesita ver para no creer que el cambio ya está hecho— y `pending_email` dice
        qué se ha pedido.
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: Perfil actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

    delete:
      tags: [Cuenta]
      operationId: deleteMe
      summary: Borrar mi cuenta (derecho de supresión)
      description: |
        Ejerce el **art. 17** del RGPD sobre la cuenta de quien hace la petición.

        ⚠️⚠️ **NO borra la fila: la ANONIMIZA.** La identidad se sobrescribe con valores neutros
        —nombre, correo, teléfono y contraseña— y se purga la PII de terceros de sus pedidos
        (nombres y alergias de los invitados). Lo que **se conserva** es la historia contable
        —códigos, importes y fechas, ya sin identidad—, porque la ley fiscal obliga a guardar la
        factura ≥4 años. Para el titular el efecto es el mismo: no puede volver a entrar, sus datos
        personales han salido, y su correo queda **libre** para registrarse de nuevo.

        ⚠️ **Es irreversible, y por eso exige reconfirmar la contraseña actual** — con el mismo
        limitador por (titular, IP) que `PUT /me/password`: cinco fallos seguidos y responde `429`.

        ⚠️ **Todas las credenciales del titular dejan de valer**, incluida la de esta petición: en el
        art. 17 no hay ninguna que conservar. Un cliente por Bearer debe dar su token por muerto tras
        el `204`; uno por cookie recibe además la sesión invalidada.

        ⚠️ La petición lleva CUERPO, que en `DELETE` es legal pero poco común: un cliente que use una
        capa HTTP que no lo permita tendrá que enviarlo igualmente — no hay variante por query, y no
        la hay a propósito (una contraseña en la URL acabaría en los logs del servidor).

        ⚠️ **`409 account_has_upcoming_reservations` con una reserva POR CELEBRAR** (pagada, no
        cancelada y cuya franja no ha terminado): la supresión espera a que pase o se cancele, y el
        `message` se lo explica al titular. No se arregla reintentando.
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordConfirmation'
      responses:
        '204':
          description: La cuenta ha quedado anonimizada y todas sus credenciales revocadas.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: Hay reservas por celebrar; la cuenta aún no se puede borrar (`account_has_upcoming_reservations`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

  /me/reservation-eligibility:
    get:
      tags: [Compra]
      operationId: getMyReservationEligibility
      summary: ¿Puede este titular reservar ahora?
      description: |
        Aviso TEMPRANO, para poder decirle al cliente que no va a poder reservar **antes** de
        llevarlo a la pantalla de pago. Es lo que la web hace desde siempre al pasar del carrito a
        la identificación.

        **No consume nada.** Pregunta a la variante de solo consulta de la política de admisión, no
        a la que gasta un intento del limitador. Es la diferencia entre contar reservas y contar
        pantallas: si esto consumiera, pasar dos veces por la cesta impediría confirmar la segunda
        compra del mismo minuto.

        **Responde 200 aunque el veredicto sea que no**: es una consulta que salió bien, y el
        motivo viaja dentro. Los errores de verdad (401, 429, 503) siguen siendo errores.

        Sin parámetros a propósito: la identidad sale del guard, así que no hay forma de preguntar
        por la elegibilidad de otro titular.
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '200':
          description: Veredicto de elegibilidad del titular autenticado.
          headers:
            Cache-Control:
              description: Siempre `no-store` en respuestas autenticadas (`RGPD-04`).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationEligibility'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

  /me/pending-email:
    delete:
      tags: [Cuenta]
      operationId: cancelMyEmailChange
      summary: Cancelar el cambio de correo pedido
      description: |
        Descarta la solicitud: el correo vigente no se toca en ningún momento.

        ⚠️ **Es idempotente**: cancelar algo que ya no está pendiente responde igual. Quien pulsa dos
        veces no ha hecho nada malo, y un `404` obligaría a cada cliente a distinguir dos situaciones
        que para él son la misma.
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '204':
          description: Ya no hay ningún cambio pendiente.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/Maintenance'

  /me/pending-email/resend:
    post:
      tags: [Cuenta]
      operationId: resendMyEmailChange
      summary: Reenviar la confirmación del cambio de correo
      description: |
        Vuelve a mandar el enlace al buzón nuevo y **resella la ventana de validez**: cuenta desde el
        último envío, no desde el primero — si no, el enlace reenviado caducaría antes de llegar.

        ⚠️ **Un reenvío por minuto.** Este limitador es aparte del de la contraseña: aquí no se está
        adivinando nada, se está mandando correo, y lo que se protege es el buzón del destinatario.

        ⚠️ Si no hay nada pendiente responde `204`, por lo mismo que la cancelación.
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '204':
          description: Reenviado (o no había nada pendiente).
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /me/email/resend:
    post:
      tags: [Cuenta]
      operationId: resendMyVerification
      summary: Reenviar la verificación de mi correo
      description: |
        El hermano AUTENTICADO de `auth/email/resend`: reenvía el enlace de verificación al correo del
        titular que ya tiene sesión, **sin cuerpo** — la sesión dice quién es.

        Existe porque **se puede iniciar sesión sin haber verificado el correo**, y en ese estado el
        área de cuenta tiene algo que ofrecer: quien aceptó la exención de responsabilidad al darse de
        alta la tiene retenida hasta que verifique, así que reenviarse el correo es lo único que
        desbloquea su firma.

        ⚠️ El público NO se aflojó para esto: su cuerpo es el `EmailRequest` compartido con
        `auth/password/forgot`, y hacer el campo opcional lo habría aflojado también allí.

        ⚠️ Hereda los dos cooldowns del reenvío —por IP y por buzón destinatario— y responde `204`
        también cuando el correo ya estaba verificado: ahí es un no-op.
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '204':
          description: Reenviado (o el correo ya estaba verificado).
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

  /me/password:
    put:
      tags: [Cuenta]
      operationId: updateMyPassword
      summary: Cambiar mi contraseña
      description: |
        Exige **reconfirmar la contraseña actual** y, al conseguirlo, **cierra las demás credenciales**
        del titular —sesiones y tokens— conservando la que hace la petición. Es el caso de uso de quien
        sospecha que alguien más entró: cambiar la contraseña sin revocar lo anterior no serviría de
        nada si el intruso conserva una cookie viva o un Bearer.

        ⚠️ **La contraseña nueva no se envía repetida.** Confirmar el campo es cosa de un formulario,
        no del contrato: la web lo pide y un cliente nativo no tiene por qué.

        ⚠️ **Los fallos están LIMITADOS** por (titular, IP): cinco seguidos y responde `429` con
        `Retry-After`. El contador cuenta **solo los fallos** y se limpia al acertar, así que
        equivocarse una vez no penaliza. Sin él, una sesión secuestrada permitiría probar contraseñas
        sin techo antes de cambiarla.
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '204':
          description: Contraseña cambiada y demás credenciales revocadas.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

  /me/sessions/revoke-others:
    post:
      tags: [Cuenta]
      operationId: revokeMyOtherSessions
      summary: Cerrar sesión en los demás dispositivos
      description: |
        Cierra las demás sesiones del titular y revoca sus demás tokens; **la credencial en curso
        sobrevive**, para que no se autoexpulse al defenderse.

        Exige reconfirmar la contraseña actual, con el **mismo limitador** que `PUT /me/password`.
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordConfirmation'
      responses:
        '204':
          description: Las demás credenciales han dejado de valer.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

  /me/marketing:
    put:
      tags: [Cuenta]
      operationId: updateMyMarketingConsent
      summary: Dar o retirar el consentimiento de marketing
      description: |
        Enciende o apaga las comunicaciones comerciales (**art. 7.3**).

        ⚠️⚠️ **NO pide contraseña, y es una decisión legal, no una omisión**: el art. 7.3 exige que
        retirar un consentimiento sea *tan fácil como darlo*, y ponerle fricción solo a la retirada
        sería incumplirlo por otra puerta.

        ⚠️ **La retirada NO borra la prueba**: la fila de `consents` se conserva —sigue demostrando
        que en su día se aceptó, que es lo que justifica los envíos hechos— y se sella con
        `revoked_at`. Por eso `GET /me/consents` puede enseñar un consentimiento *retirado*, con sus
        dos fechas.

        Responde **204 siempre**, incluida la llamada que no cambia nada: el titular pide un ESTADO,
        no una transición.
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketingConsentRequest'
      responses:
        '204':
          description: Estado aplicado.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

  /me/export:
    get:
      tags: [Cuenta]
      operationId: exportMyData
      summary: Descargar mis datos (derecho de portabilidad)
      description: |
        Copia legible por máquina de los datos personales del titular (**art. 20**): perfil,
        consentimientos, roles y el historial de pedidos con su detalle de líneas, complementos,
        datos de evento y entradas emitidas.

        ⚠️ **No exige reconfirmar la contraseña**, y es coherente con la web: descargarse los datos
        propios no destruye ni cede nada, y poner fricción a un derecho que la ley quiere fácil de
        ejercer solo consigue que no se ejerza.

        ⚠️⚠️ **Es el cuerpo con más PII del producto** —incluye `event_data`: nombre y **alergias**
        del homenajeado, dato de salud del art. 9—. Sale siempre con `Cache-Control: no-store`
        (`RGPD-04`), que en `/api/v1` lo estampa el middleware del grupo en toda respuesta
        autenticada. Un cliente que lo persista asume esa responsabilidad: la SPA del cajón **no lo
        guarda** en `localStorage`, por la misma regla que excluye las respuestas del evento de la
        cesta.

        ⚠️ **Devuelve el documento, no un fichero adjunto.** El `Content-Disposition` de la página
        web es presentación de navegador; aquí el cliente recibe el cuerpo y decide qué hacer con él.

        ⚠️ Que `GET /me/orders` excluya `event_data` a propósito no contradice esto: allí es una
        lista que se pinta sola en cada página, y aquí es el titular pidiendo expresamente su copia.
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '200':
          description: El documento de portabilidad.
          headers:
            Cache-Control:
              description: Siempre `no-store` (`RGPD-04`).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalDataExport'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

  /me/identities:
    get:
      tags: [Cuenta]
      operationId: listMyIdentities
      summary: Mis cuentas vinculadas
      description: |
        Las cuentas de un proveedor externo (hoy, Google) con las que se entra a ésta
        (`specs/auth-con-google.md` §8).

        ⚠️ **No publica el identificador del proveedor** (el `sub`): lo que esta pantalla necesita es
        con qué cuenta se entra y desde cuándo. El `sub` sí viaja en `GET /me/export`, que es un acto
        explícito del titular — misma doctrina que la IP de los consentimientos.
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '200':
          description: Las identidades vinculadas, de la más reciente a la más antigua.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LinkedIdentity'
                  meta:
                    $ref: '#/components/schemas/ListMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

  /me/identities/{provider}:
    delete:
      tags: [Cuenta]
      operationId: unlinkMyIdentity
      summary: Desvincular una cuenta externa
      description: |
        Quita el vínculo con un proveedor. **Es el contrapeso del aviso de vinculación**: el vínculo
        se crea solo al entrar con un correo que ya tenía cuenta, se avisa por correo, y ese aviso
        solo sirve de algo si quien lo recibe **puede deshacerlo**.

        ⚠️ **Exige la contraseña actual** y comparte el limitador de `PUT /me/password` — cinco
        intentos por titular e IP—. No es una contradicción con el art. 12.2: la contraseña es lo que
        impide que alguien se cierre a sí mismo la única puerta que tenía. Quien entró con Google y no
        tiene ninguna la crea con «he olvidado mi contraseña».

        ⚠️ **Idempotente**: desvincular lo que ya no está responde 204 igual. El titular pide un
        estado, no una transición.
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordConfirmation'
      responses:
        '204':
          description: El vínculo ya no existe.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

  /me/consents:
    get:
      tags: [Cuenta]
      operationId: getMyConsents
      summary: Mis consentimientos
      description: |
        Los consentimientos legales que el titular ha otorgado, del más reciente al más antiguo: a
        qué dijo que sí, cuándo y **sobre qué versión** del documento.

        Es la prueba visible del **art. 7.1** que la web enseña hoy en «Privacidad y datos». Existe
        porque retirar esa página sin publicarlo le quitaría al cliente información que ya tiene
        (`DECISIONES #120(t)`).

        ⚠️ **NO publica la IP**, y no es un descuido: la página tampoco la enseña. La IP forma parte
        de la prueba y viaja en el export de portabilidad (`GET /me/export`), que es un acto
        explícito del titular — repetirla en una lista que se pinta sola añade un dato técnico a la
        pantalla sin decirle nada nuevo.

        Lista corta por naturaleza: no se pagina, pero lleva `meta.total` como cualquier otra.
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '200':
          description: Los consentimientos otorgados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

  /me/waiver:
    get:
      tags: [Cuenta]
      operationId: getMyWaiver
      summary: Mi waiver
      description: |
        El estado del waiver del titular según el modo de la instalación, y sus propias firmas con
        el PDF de cada una (Fase 6, `specs/waiver-probatorio.md` §4.5, §4.8).

        - `externo`: `signed` sale del sello que deja el sistema del parque; no hay versiones.
        - `interno`: manda el registro firmado aquí. `outdated` dice que se firmó una versión anterior
          del texto — **se deja pasar en la puerta**, y la re-firma se pide en el siguiente momento
          natural (al entrar o al comprar), nunca en el mostrador. `current_document_id` es el texto
          que hay que aceptar entonces: el mismo id que publica `GET /legal/waiver` en este idioma.
        - `desactivado`: no hay pregunta.

        ⚠️ **No publica ip, user-agent ni hashes** de las firmas, por el mismo criterio que
        `GET /me/consents`: la prueba completa es el PDF, que es un acto explícito del titular.
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '200':
          description: El estado y las firmas del titular.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaiverStatus'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'
    post:
      tags: [Cuenta]
      operationId: acceptMyWaiver
      summary: Aceptar el waiver vigente
      description: |
        Registra la aceptación del titular del texto que el servidor sirvió
        (`specs/waiver-probatorio.md` §4.4): **el servidor solo emite la aceptación si la petición trae
        el identificador de la versión vigente**. Si el texto se publicó de nuevo entre servirlo y
        aceptarlo, responde `409 waiver_document_stale` y el cliente vuelve a pedir `GET /legal/waiver`
        y a presentarlo. Fuera del modo interno, `409 waiver_not_internal`. Y **solo con el correo
        verificado**: sin él, `409 waiver_email_unverified` (`#179`, spec §7·5).

        Es la firma del titular desde su propio dispositivo: se guarda con su ip, su user-agent y el
        canal (`web` con cookie de sesión, `api` con un token personal REAL: una cabecera
        `Authorization` suelta junto a la cookie no cuenta), encadenada a su firma anterior.
        **Idempotente por versión**: repetir la aceptación de la versión vigente —en cualquier
        idioma— no crea una segunda firma ni un segundo consentimiento; responde `201` con el mismo
        estado. Sirve
        también para la re-firma cuando `outdated` es `true`.

        Responde **201 con el estado nuevo**, el mismo cuerpo que `GET /me/waiver`.
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaiverAcceptRequest'
      responses:
        '201':
          description: Aceptación registrada; el estado ya la refleja.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaiverStatus'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: |
            `waiver_not_internal` — el waiver no se firma en esta instalación ·
            `waiver_document_stale` — el identificador no es el del texto vigente: hay que volver a leerlo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

  /me/waiver/{signature}/pdf:
    get:
      tags: [Cuenta]
      operationId: getMyWaiverProof
      summary: El PDF de una firma mía
      description: |
        El registro probatorio de una firma PROPIA, legible (`specs/waiver-probatorio.md` §4.5): el
        texto íntegro que se aceptó, la identidad tal y como estaba al firmar, fecha con zona, ip,
        user-agent, canal y hashes, **en el idioma del texto firmado**. Compuesto del snapshot, nunca
        del CMS; el mismo documento que ve el operador desde el panel.

        Scoping por el guard: una firma que no sea del titular **no existe** (404). Cada descarga queda
        en la auditoría. `no-store`, como toda respuesta autenticada.
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: signature
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: El PDF.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

  /me/card:
    get:
      tags: [Cuenta]
      operationId: getMyCard
      summary: Mi carné QR
      description: |
        El carné QR del titular (Fase 6 · subsistema A, `specs/identidad-qr-puerta.md` §4.1, §4.5):
        un identificador **estable, opaco y rotable** que se enseña en la puerta. Si el titular aún
        no tiene, se emite en ese momento.

        `token` es el dato del QR **tal cual** —20 caracteres en mayúsculas, sin URL—: píntalo en
        modo alfanumérico con corrección **H** (cabe en versión 2, 25×25). **Escanearlo no autentica**:
        identifica al titular ante un empleado con sesión, y nada más; por eso puede imprimirse y
        viajar por correo. `token` es `null` solo si la clave de cifrado del servidor rotó: rota el
        carné y listo.
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '200':
          description: El carné activo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerCard'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

  /me/card/rotate:
    post:
      tags: [Cuenta]
      operationId: rotateMyCard
      summary: Rotar mi carné QR
      description: |
        Emite un carné nuevo y **mata el viejo en el acto** (`specs/identidad-qr-puerta.md` §4.5): un
        correo antiguo o una impresión dejan de valer al instante, sin ventana de gracia — una
        credencial revocada que sigue valiendo no es amable, es un hueco. Responde **201 con el
        carné nuevo**, la misma forma que `GET /me/card`.
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '201':
          description: El carné nuevo; el anterior ya no vale.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerCard'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

  /me/card/png:
    get:
      tags: [Cuenta]
      operationId: getMyCardImage
      summary: Mi carné QR como imagen
      description: |
        El carné activo dibujado como PNG (`specs/identidad-qr-puerta.md` §9.6 B·1): **los mismos
        bytes que el adjunto `carne-qr.png` del correo de confirmación** (corrección H, zona de
        silencio de 4 módulos). Es lo que la zona «Mi carné» pinta y ofrece descargar; su URL viaja en
        `CustomerCard.png_url`. Si el titular aún no tiene carné, se emite en ese momento, como en
        `GET /me/card`.

        **404** cuando el carné no se puede dibujar (`token` nulo: la clave de cifrado del servidor
        rotó) — rota el carné y vuelve a pedirla. `no-store`, como toda respuesta autenticada: es una
        credencial de puerta.
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '200':
          description: La imagen.
          content:
            image/png:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

  /me/dependents:
    get:
      tags: [Cuenta]
      operationId: getMyDependents
      summary: Mis menores a cargo
      description: |
        Las personas a cargo que el titular ha declarado y no ha retirado, en el orden en que las
        declaró (Fase 6, `specs/menores-a-cargo.md` §4.1, §4.2). Una retirada **no vuelve a salir**
        nunca: si tenía un waiver firmado detrás, sigue existiendo desvinculada bajo el régimen
        restringido del registro; si no, se borró.

        `age` e `is_minor` se **derivan** de `born_on` con el «hoy» del parque en cada petición: no
        hay edad guardada que pueda quedarse vieja. `adult_from` es el día en que cumple 18 y deja
        de estar cubierto por el waiver del adulto — la lista lo marca, nadie lo borra.

        Lista corta por naturaleza (tope de servidor, `dependents.max_per_account`): no se pagina,
        pero lleva `meta.total` como cualquier otra.
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '200':
          description: Las personas a cargo activas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DependentList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'
    post:
      tags: [Cuenta]
      operationId: addMyDependent
      summary: Declarar un menor a cargo
      description: |
        Declara una persona a cargo: **nombre y fecha de nacimiento, nada más** (`DECISIONES #142`).
        El nombre es la etiqueta con la que el titular la distingue —puede ser el que use en casa—;
        la puerta no lo enseña nunca.

        Dos reglas de dominio, con su código:
        - `422 dependent_not_minor` — hoy, en el reloj del parque, ya tiene 18 o más. Un adulto
          firma su propio waiver.
        - `422 dependents_limit_reached` — la cuenta está en el tope de la instalación
          (`params.max`). Es un tope de **servidor**, no de pantalla (`PAY-12`).

        Una fecha futura o mal formada es `422 validation_failed` sobre `born_on`. **No hay
        edición**: una fecha de nacimiento corregida es otra persona a cargo (quitar y volver a
        declarar), porque con una firma detrás sería reescribir lo firmado.

        Responde **201 con la persona a cargo**, la misma forma que cada elemento de la lista.
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DependentCreateRequest'
      responses:
        '201':
          description: Declarada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dependent'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: |
            `waiver_document_stale` — el texto del descargo se republicó entre que la pantalla lo
            sirvió y el momento de escribir. Se comprueba **bajo el lock** (`#181` S-3), así que puede
            saltar aunque la pantalla acabara de leerlo. **El menor NO se crea**: la transacción se
            deshace entera.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            `validation_failed` (con `fields`) · `dependent_not_minor` — ya tiene 18 o más ·
            `dependents_limit_reached` — la cuenta está en su tope (`params.max`).

            ⚠️ Desde `#441`, `validation_failed` incluye `accept_waiver` cuando la instalación pide
            la exención y no llega aceptada: declarar sin aceptar **no crea nada**.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

  /me/dependents/{dependent}:
    delete:
      tags: [Cuenta]
      operationId: removeMyDependent
      summary: Quitar un menor a cargo
      description: |
        Quita una persona a cargo de la cuenta (`specs/menores-a-cargo.md` §4.4). **Quitar es
        desvincular, no borrar, si hay algo detrás**: con un waiver firmado en su nombre la fila
        se conserva desvinculada —el registro probatorio sigue apuntando ahí— y desaparece de esta
        lista y de la pantalla de puerta; sin firma ni reservas se borra de verdad. El cliente no
        distingue los dos casos y no le hace falta. Volver a declararla después es **otra** persona
        a cargo, con su propia firma.

        Un id ajeno, inexistente o ya retirado responde `404`: la API no distingue los tres casos
        (anti-IDOR, §4.9).
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: dependent
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '204':
          description: Retirada (desvinculada o borrada).
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

  /me/dependents/{dependent}/waiver:
    post:
      tags: [Cuenta]
      operationId: acceptMyDependentWaiver
      summary: Aceptar el waiver vigente en nombre de un menor a cargo
      description: |
        Registra la aceptación del texto vigente **en nombre de** una persona a cargo (Fase 6,
        `specs/menores-a-cargo.md` §4.3): la firma la hace el ADULTO, y lo que queda registrado es
        «X, como responsable de Y, aceptó la versión V el día D». Cuelga del par (titular, menor) y
        forma **su propia cadena** de hashes, separada de la del titular (`DECISIONES #197`).

        Las mismas reglas que `POST /me/waiver`: la petición trae el `document_id` que el servidor
        sirvió (`GET /legal/waiver` o `current_document_id` de `GET /me/waiver`) — si el texto cambió
        entre medias, `409 waiver_document_stale`; fuera del modo interno, `409 waiver_not_internal`;
        sin el correo del titular verificado, `409 waiver_email_unverified`. **Idempotente por
        versión**: repetir la aceptación no crea una segunda firma. Y las del sujeto: ajeno,
        inexistente o retirado es `404`; si hoy ya tiene 18 o más, `422 dependent_not_minor` — el
        waiver del adulto ya no le cubre.

        La identidad del menor —nombre y fecha de nacimiento tal y como estaban al firmar— se copia
        en el registro y entra en su hash, como la del titular. La firma aparece en `GET /me/waiver`
        (con `dependent_id`/`dependent_name`) y su PDF se sirve por `GET /me/waiver/{signature}/pdf`.

        Responde **201 con la persona a cargo**, cuyo `waiver` ya refleja la firma.
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: dependent
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaiverAcceptRequest'
      responses:
        '201':
          description: Aceptación registrada en nombre del menor; su estado ya la refleja.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dependent'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            `waiver_not_internal` · `waiver_document_stale` — hay que volver a leer el texto ·
            `waiver_email_unverified` — el titular tiene que verificar su correo antes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: '`validation_failed` (con `fields`) · `dependent_not_minor` — ya tiene 18 o más.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

  /me/account-context:
    get:
      tags: [Cuenta]
      operationId: getMyAccountContext
      summary: Mi contexto de cuenta
      description: |
        Cómo saludar al titular, qué tiene por delante y qué le falta por rellenar, **en una sola
        petición**.

        Es el agregado que pintan el bloque de cuenta del cajón y el chip del nav desde `#221`, y sale
        del mismo servicio que ya los alimenta (`Identity\Services\CustomerAccountContext`), que a su
        vez pide las reservas al contrato de Booking. **Este endpoint no decide ninguna regla**: qué
        cuenta como próxima reserva y qué formulario está pendiente lo decide el dominio.

        ⚠️ **Por qué no basta componerlo desde `/me`, `/me/reservations` y `/me/orders`**:
        `GET /me/orders` **pagina**, así que contar formularios pendientes sobre una página cuenta
        mal, y `upcoming_count` no sale de ahí. Además el consumidor real lo necesita **en un viaje**:
        el bloque se repinta tras conseguir sesión sin recargar, en mitad de una compra.

        **No exige el correo verificado**, igual que `/me` y `/me/reservations`: el registro
        *pay-first* crea cuentas sin verificar y esas cuentas también tienen bloque que pintar.

        ⚠️ **Es defensivo por diseño**: ante un fallo al leer las reservas, el servicio devuelve un
        contexto vacío seguro y esto responde `200` con los campos a cero. Una cortesía de interfaz no
        tumba una pantalla — un `200` vacío es una respuesta legítima, no un error silenciado.
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '200':
          description: Contexto de cuenta del titular.
          headers:
            Cache-Control:
              description: Siempre `no-store` en respuestas autenticadas (`RGPD-04`).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountContext'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

  /me/reservations:
    get:
      tags: [Cuenta]
      operationId: getMyReservations
      summary: Mis próximas reservas
      description: |
        Reservas FUTURAS del cliente, de la más próxima a la más lejana: líneas principales de
        pedidos pagados, no canceladas, con franja y aún no terminadas. Qué cuenta como «próxima»
        lo decide el dominio (`Booking\Contracts\CustomerReservations`), no este endpoint.

        Lista corta por naturaleza: no se pagina, pero lleva `meta.total` como cualquier otra lista.
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '200':
          description: Reservas próximas del cliente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpcomingReservationList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

  /me/reservations/{scope}:
    get:
      tags: [Cuenta]
      operationId: getMyReservationPage
      summary: Mis reservas, por ámbito y paginadas
      description: |
        El historial del cliente **POR RESERVA**, no por pedido: un pedido puede llevar tres reservas
        de tres fechas distintas, y enseñarlas juntas no le dice nada a quien solo quiere saber qué
        tiene. Cada elemento es una línea principal con el contexto mínimo de su pedido.

        ⚠️⚠️ **Los dos ámbitos son los dos lados de UN predicado y su unión es el total.** No son dos
        consultas independientes: el reparto lo hace `Booking\Contracts\CustomerReservations::pageFor()`
        con `where`/`whereNot` sobre la misma expresión. Es lo que impide que una reserva no salga en
        ninguno de los dos — un fallo que no rompe nada y no lo nota nadie, porque una lista a la que
        le falta una fila se lee perfectamente.

        **`upcoming`** trae lo que el cliente aún tiene por delante, de lo más próximo a lo más
        lejano, con las que **no tienen franja asignada primero**. Incluye las de pedidos `pending`
        vivos, por la misma razón que `/me/orders` incluye todos los estados: es el camino por el que
        alguien recupera un pedido a medio pagar con su retención de aforo intacta.

        **`past`** trae las canceladas, las ya disfrutadas y las de pedidos cancelados, reembolsados
        o caducados, de lo más reciente a lo más antiguo.

        ⚠️ **El corte de «ya disfrutada» es exacto, no por día**: espeja
        `OrderItem::isFinishedInPractice()`, así que una reserva pasa al historial cuando termina su
        franja, no a medianoche. Si fuera por día, este reparto y `/me/reservations` discreparían.

        ⚠️ **El desglose financiero NO viaja aquí.** Es del PEDIDO, así que repetirlo en cada tarjeta
        lo duplicaría tantas veces como reservas tenga; se pide con `GET /orders/{code}` al
        desplegarlo. Mismo criterio que las respuestas del pack.
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: scope
          in: path
          required: true
          description: Qué mitad del historial se pide.
          schema:
            type: string
            enum: [upcoming, past]
        - name: page
          in: query
          required: false
          description: Página, empezando en 1.
          schema:
            type: integer
            minimum: 1
        - name: per_page
          in: query
          required: false
          description: |
            Reservas por página. Por defecto **5**, que es lo que cabe sin scroll infinito en el
            panel del cajón; el techo evita convertir el endpoint en una descarga completa.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 5
      responses:
        '200':
          description: Una página del historial de reservas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationCardList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

  /me/orders:
    get:
      tags: [Cuenta]
      operationId: getMyOrders
      summary: Mis pedidos
      description: |
        Historial de pedidos del cliente, del más reciente al más antiguo y con **todos los
        estados**. Incluir los `pending` es deliberado: es la única forma de que un cliente que
        perdió el estado recupere un pedido a medio pagar mientras su retención de aforo sigue
        viva (`expires_at` dice hasta cuándo, `online_amount_cents` por cuánto).

        ⚠️⚠️ **El orden es TOTAL, y hasta el 2026-08-24 no lo era** (`DECISIONES #129`). Ordenaba solo
        por fecha de creación, así que dos pedidos creados **en el mismo segundo** no tenían orden
        entre sí y `LIMIT/OFFSET` cortaba por un sitio distinto en cada página. **Medido sobre 57
        pedidos reales**: dos salían repetidos en dos páginas y otros dos **no salían en ninguna** —
        invisibles para su dueño por muchas páginas que pasara. El desempate es el `id`, que es único.
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          description: Página, empezando en 1.
          schema:
            type: integer
            minimum: 1
        - name: per_page
          in: query
          required: false
          description: Pedidos por página.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
        - name: containing
          in: query
          required: false
          description: |
            **El código de un pedido: devuelve la página que lo CONTIENE**, en vez de la primera.

            Existe porque «Ver pedido» de una reserva abre la pantalla de pedidos **en ese pedido**
            (`specs/desglose-dinero-cliente.md` §5·2), y **solo el servidor sabe en qué página cae**:
            el orden y el tamaño de página son suyos. Sin esto, el cliente tendría que pedir páginas
            hasta encontrarlo —N peticiones y sin cota— o abrir siempre la primera, que es la forma
            silenciosa de incumplir la decisión: no falla nada y no hace lo que promete.

            ⚠️ **Un código que no sea del cliente se comporta como si no se hubiera enviado** (primera
            página), no como un 404. Distinguir «no es tuyo» de «no existe» convertiría el parámetro
            en un **oráculo de códigos de pedido**, que es justo lo que `GET /orders/{code}` evita
            respondiendo 404 en los dos casos.

            ⚠️ Se ignora si viene junto a `page`: pedir a la vez una página concreta y la página que
            contiene algo es una contradicción, y `page` es el parámetro explícito.
          schema:
            type: string
            maxLength: 32
      responses:
        '200':
          description: Página del historial de pedidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'

components:

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: laravel_session
      description: |
        Modo SPA de primera parte. El cliente pide primero `GET /sanctum/csrf-cookie` y envía el
        token CSRF en `X-XSRF-TOKEN`. Solo funciona desde un origen declarado como *stateful*.
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Modo cliente nativo. Token emitido por `POST /auth/tokens`, con caducidad, renovable con
        `POST /auth/tokens/rotate` y revocable desde el borrado RGPD, el cambio y el
        restablecimiento de contraseña, «cerrar otras sesiones» y `POST /auth/logout`.

  parameters:
    SidebarLang:
      name: lang
      in: query
      required: true
      description: |
        El idioma de los rótulos. Va en la URL y no en `Accept-Language` para que la respuesta sea
        función de su URL y se pueda cachear.
      schema:
        type: string
        enum: [es, en, fr]

  responses:
    Unauthenticated:
      description: Falta identidad o ya no es válida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: |
        El recurso no existe, o no existe PARA QUIEN PREGUNTA. La API no distingue los dos casos:
        hacerlo convertiría un 404 en una forma de enumerar lo que hay en la base de datos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationFailed:
      description: Los datos enviados no validan. `error.fields` los enumera por campo.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Limitador alcanzado. `params.retry_after` indica los segundos que faltan.
      headers:
        Retry-After:
          description: Segundos hasta que se puede reintentar.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Maintenance:
      description: El sitio está en mantenimiento (#218). Alcanza también a la API, a propósito.
      headers:
        Retry-After:
          description: Segundos orientativos hasta el próximo intento.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:

    Error:
      type: object
      description: |
        Sobre único de error de toda la API (spec §4.3). `code` es el contrato estable; `message`
        es texto ya traducido, para mostrar cuando el cliente no sabe hacer nada mejor.
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              description: |
                Código estable. La lista es CERRADA: añadir uno es evolutivo, renombrarlo o
                quitarlo es incompatible y exige `v2`. Debe coincidir con `App\Http\Api\ApiErrorCode`.
              enum:
                - unauthenticated
                - invalid_credentials
                - unauthorized
                - not_found
                - method_not_allowed
                - session_expired
                - validation_failed
                - too_many_requests
                - maintenance
                - bad_request
                - server_error
                # Negocio — la cesta no se puede convertir en pedido (todos con 422).
                - cart_empty
                - cart_too_large
                - product_unavailable
                - line_unavailable
                - line_past_date
                - line_too_late
                - line_too_soon
                - line_outside_window
                - line_sold_out
                - line_pack_sold_out
                - line_pack_guests_range
                - line_event_required
                # La HORA EXTRA (`specs/hora-extra.md`): un complemento que OCUPA la franja
                # siguiente. El primero lleva `params.addon` además de `product`/`when`; el
                # segundo, `params.staying`/`params.entering`.
                - line_addon_occupancy
                - line_addon_over_quantity
                # La hora extra de un PACK (`specs/hora-extra.md` §10): la fiesta cabe, pero
                # alargada no. Código propio y no `line_pack_sold_out` porque el remedio es otro:
                # quitar la hora extra CONSERVA la reserva. Lleva `params.product`/`params.when`.
                - line_stay_extension
                # Negocio — la reserva no se admite (409) o el cobro no se abre (502).
                - reservations_paused
                - too_many_pending_orders
                - order_not_retryable
                - guest_form_closed
                - guest_form_stale
                - payment_unavailable
                # Fase 6 · waiver — aceptar el texto (409): no se firma aquí, o el texto cambió.
                - waiver_not_internal
                - waiver_document_stale
                - waiver_email_unverified
                # Fase 6 · menores a cargo (422 los dos).
                - dependent_not_minor
                - dependents_limit_reached
                # T5 · supresión (art. 17): con reservas por celebrar la cuenta no se borra (409).
                - account_has_upcoming_reservations
            message:
              type: string
              description: Mensaje legible en el idioma negociado.
            params:
              type: object
              description: |
                Datos para interpolar el mensaje en el cliente. Presente solo cuando aporta algo:
                hoy, `retry_after` en el 429; desde el paso 4, `product`/`when` de las reglas de
                reserva, sin los cuales el cliente pintaría «El producto — no está disponible».
              additionalProperties: true
            fields:
              type: object
              description: Errores por campo. Presente solo en `validation_failed`.
              additionalProperties:
                type: array
                items:
                  type: string

    BookingStatus:
      type: object
      additionalProperties: false
      required: [reservations_paused, notice]
      properties:
        reservations_paused:
          type: boolean
          description: |
            `true` cuando el operador ha pausado la reserva online. Mientras lo esté, `POST /orders`
            y el reintento de cobro responden **409 `reservations_paused`**.

            La pausa NO afecta al pedido manual del panel ni a los pagos ya iniciados: un cobro en
            curso puede terminar.
        notice:
          type: object
          additionalProperties: false
          required: [title, message, phone, phone_tel, whatsapp, contact_url]
          description: |
            Qué enseñar en lugar del flujo. Viaja **siempre**, también con las reservas abiertas: la
            forma de la respuesta no cambia con el estado, y todo lo que contiene es información
            pública del negocio.
          properties:
            title:
              type: string
              description: Ya traducido, con el literal por defecto si el operador no lo ha traducido.
            message:
              type: string
              description: Ídem. Nunca llega vacío.
            phone:
              type: string
              nullable: true
              description: Teléfono tal y como lo escribió el operador, para MOSTRARLO. `null` si no hay.
            phone_tel:
              type: string
              nullable: true
              description: El mismo teléfono listo para un enlace `tel:`. `null` si no hay.
            whatsapp:
              type: string
              nullable: true
              description: Número en dígitos, listo para `wa.me/{whatsapp}`. `null` si no hay.
            contact_url:
              type: string
              format: uri
              nullable: true
              description: |
                **Último recurso**, no «la página de contacto»: llega con valor **solo** cuando no
                hay ningún canal directo (ni teléfono ni WhatsApp), y `null` cuando sí lo hay.

                La regla de cuándo procede vive en el servidor a propósito, para que las distintas
                superficies no puedan discrepar sobre ella.

    SiteFacts:
      type: object
      description: |
        Los hechos de la instalación, en seis bloques. **Cada bloque es un objeto con las claves que
        esa instalación ha rellenado**: las demás no aparecen (no viajan vacías). Un bloque entero
        puede llegar `{}`, y eso también es una respuesta — significa «esta instalación no ha puesto
        nada de eso».
      additionalProperties: false
      required: [identity, address, contact, social, legal, seo]
      properties:
        identity:
          type: object
          additionalProperties: false
          description: Quién es. `name` es el nombre comercial; `legal_name` y `nif`, los de facturar.
          properties:
            name: { type: string }
            legal_name: { type: string }
            nif: { type: string }
            domain: { type: string, description: 'El dominio de la instalación, sin esquema.' }
        address:
          type: object
          additionalProperties: false
          description: |
            **Dónde está el local.** No es el domicilio fiscal, que va en `legal.fiscal_address` y
            puede ser otro municipio.
          properties:
            line1: { type: string }
            line2: { type: string }
            city: { type: string }
            maps_url: { type: string, format: uri }
            maps_embed_url: { type: string, format: uri, description: 'El `src` del iframe de Google Maps.' }
            written:
              type: string
              example: 'Ctra. de Prueba, 1, 30000 Ciudad'
              description: |
                Las dos líneas **ya escritas en una**, que es lo que se pinta. **Ausente** si la
                instalación no ha rellenado ninguna.
                ⚠️ Úsala en vez de unir `line1` y `line2` por tu cuenta: se unen con **coma**, porque
                «Ctra. de Prueba, 1 30000 Ciudad» se lee como si el código postal fuera parte del
                número de portal. Las dos líneas siguen viajando por si quieres maquetarlas aparte.
        contact:
          type: object
          additionalProperties: false
          properties:
            email: { type: string, format: email }
            phone: { type: string }
            whatsapp: { type: string }
        social:
          type: object
          additionalProperties: false
          description: |
            Las redes viven en el PANEL y salen por aquí (`DECISIONES #639`): cambiar un Instagram es
            editar un campo, no desplegar la landing.
          properties:
            instagram: { type: string, format: uri }
            tiktok: { type: string, format: uri }
            feed_embed_url: { type: string, format: uri }
            google_place_id: { type: string, description: 'Para pedirle las reseñas a Google.' }
        legal:
          type: object
          additionalProperties: false
          properties:
            jurisdiction: { type: string, description: 'Los juzgados a los que se someten las condiciones.' }
            fiscal_address: { type: string, description: 'Domicilio fiscal, para el aviso legal y la factura.' }
        seo:
          type: object
          additionalProperties: false
          properties:
            og_image: { type: string, description: 'La imagen de `og:image` de la instalación.' }

    Schedule:
      type: object
      additionalProperties: false
      required: [timezone, weekly, seasons, special_days]
      properties:
        timezone:
          type: string
          description: 'La zona horaria de la INSTALACIÓN. Sin ella, «21:30» no significa nada.'
        weekly:
          type: array
          description: Los siete días, con su ventana. Una instalación sin horario devuelve la lista vacía.
          items:
            type: object
            additionalProperties: false
            required: [weekday, closed, opens_at, closes_at]
            properties:
              weekday: { type: integer, minimum: 0, maximum: 6, description: '0 = domingo, como `Date.getDay()`.' }
              closed: { type: boolean }
              opens_at: { type: string, nullable: true, example: '16:30' }
              closes_at: { type: string, nullable: true, example: '21:30' }
        seasons:
          type: array
          description: Rangos que PISAN al horario semanal (verano, Navidad). Vacío si la instalación no usa.
          items:
            type: object
            additionalProperties: false
            required: [name, starts_on, ends_on, opens_at, closes_at, current]
            properties:
              name: { type: string }
              starts_on: { type: string, format: date }
              ends_on: { type: string, format: date }
              opens_at: { type: string, nullable: true }
              closes_at: { type: string, nullable: true }
              current: { type: boolean, description: Si hoy cae dentro de este rango. }
        special_days:
          type: array
          description: |
            Días que pisan a todo lo demás. `closed: true` sin horas es un cierre; con horas, un día de
            horario distinto. Las claves que la instalación no rellenó no viajan.
          items:
            type: object
            additionalProperties: false
            required: [date, closed]
            properties:
              date: { type: string, format: date }
              closed: { type: boolean }
              opens_at: { type: string }
              closes_at: { type: string }
              note: { type: string, description: 'Lo que escribió la instalación, p. ej. «Fiesta Nacional».' }
              rate_label: { type: string, description: 'La etiqueta de tarifa especial de ese día, si la tiene.' }

    OpeningNow:
      type: object
      additionalProperties: false
      required: [open_now, timezone]
      properties:
        open_now: { type: boolean }
        timezone: { type: string }
        closes_at: { type: string, description: 'Solo si está ABIERTO. `HH:MM` en la zona de arriba.' }
        opens_at:
          type: string
          format: date-time
          description: |
            Solo si está CERRADO: el instante de la próxima apertura, en ISO 8601 con desplazamiento. Puede
            faltar — es una instalación sin horario configurado, y entonces no se afirma nada.

    Rules:
      type: object
      additionalProperties: false
      required: [lang, moments, updated_at, rules]
      properties:
        lang:
          type: string
          description: El idioma en el que viene el texto, que es el que se pidió.
        moments:
          type: array
          description: 'El catálogo de momentos EN SU ORDEN: el recorrido de una visita.'
          items: { type: string, enum: [before, gate, inside] }
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: 'La norma tocada más recientemente. `null` con la tabla vacía: no se inventa una fecha.'
        rules:
          type: array
          description: Las normas ACTIVAS, ya ordenadas. Lo que la instalación no escribió no viaja.
          items:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              moment: { type: string, enum: [before, gate, inside], description: Falta en las que el negocio no ha situado. }
              name: { type: string }
              description: { type: string }
              reason: { type: string, description: 'El PORQUÉ de la norma, que es lo que hace que se cumpla.' }

    SocialProofFacts:
      type: object
      description: |
        El sobre de la prueba social. **Hoy lleva como mucho `rating`**, y está escrito como objeto —y no
        como la cifra suelta en la raíz— precisamente para que las reseñas quepan después como clave
        hermana sin romper a nadie.
      additionalProperties: false
      properties:
        rating:
          type: object
          description: |
            La cifra agregada. **Ausente** cuando no hay ninguna que se pueda sostener: sin fuente
            configurada, con la caché fría o por debajo del umbral publicable.
          additionalProperties: false
          required: [value, count, source]
          properties:
            value:
              type: number
              format: float
              example: 4.8
              description: La media tal y como la da la fuente. No se redondea en servidor.
            count:
              type: integer
              example: 320
              description: Cuántas opiniones la sostienen. Es el segundo argumento de la chapa, no un adorno.
            source:
              type: string
              example: google
              description: |
                Quién lo dice. ⚠️ Viaja con el dato porque **la atribución es obligatoria**: la cifra no
                se puede enseñar sin decir de dónde sale.
            url:
              type: string
              format: uri
              description: |
                La ficha pública de la fuente, para enlazar «ver todas». **Ausente** si la fuente no da
                una.

    Prices:
      type: object
      additionalProperties: false
      required: [lang, currency, rates, products]
      properties:
        lang: { type: string }
        currency:
          type: string
          example: EUR
          description: 'Hoy es constante: el producto vende en una sola moneda.'
        rates:
          type: array
          description: Las tarifas activas con el rótulo que escribe el panel.
          items:
            type: object
            additionalProperties: false
            required: [key, label]
            properties:
              key: { type: string, example: special }
              label: { type: string, example: 'Viernes, fines de semana, vísperas y festivos' }
        products:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, prices]
            properties:
              id: { type: integer }
              zone: { type: string, description: 'El `slug` de su zona. Falta en un producto sin zona.' }
              name: { type: string }
              unit: { type: string, example: por persona, description: La unidad de venta que escribe el panel. }
              prices:
                type: array
                description: 'Solo las tarifas en las que ese producto SE VENDE.'
                items:
                  type: object
                  additionalProperties: false
                  required: [rate, cents]
                  properties:
                    rate: { type: string }
                    cents: { type: integer, description: Céntimos enteros. }

    LegalDocumentIndex:
      type: object
      additionalProperties: false
      required: [lang, documents]
      properties:
        lang: { type: string }
        documents:
          type: array
          items:
            $ref: '#/components/schemas/LegalDocumentSummary'

    LegalDocumentSummary:
      type: object
      additionalProperties: false
      required: [key, title, updated_at]
      properties:
        key: { type: string, example: privacidad }
        title: { type: string }
        updated_at: { type: string, format: date-time }
        signed_version:
          $ref: '#/components/schemas/SignedVersion'

    SignedVersion:
      type: object
      additionalProperties: false
      required: [version, published_at]
      description: 'Solo donde hay documento publicado y versionado. Es un DATO, no el texto.'
      properties:
        version: { type: integer }
        published_at: { type: string, format: date-time }

    LegalDocument:
      type: object
      additionalProperties: false
      required: [key, title, updated_at, sections]
      properties:
        key: { type: string }
        title: { type: string }
        updated_at: { type: string, format: date-time }
        signed_version:
          $ref: '#/components/schemas/SignedVersion'
        sections:
          type: array
          description: 'Las secciones del texto, con los marcadores ya resueltos. Un bloque puede traer solo `h` o solo `p`.'
          items:
            type: object
            additionalProperties: false
            properties:
              h: { type: string }
              p: { type: string }

    SidebarBoot:
      type: object
      description: |
        La parte del arranque del cajón que no depende de quién mira. Los cinco grupos son
        diccionarios de rótulos o de rutas: su contenido lo decide `lang/` y no este contrato, así
        que se declaran abiertos.
      additionalProperties: false
      required: [messages, ui, account, auth, urls]
      properties:
        messages:
          type: object
          additionalProperties: true
          description: El grupo de rótulos del embudo de compra.
        ui:
          type: object
          additionalProperties: true
        account:
          type: object
          additionalProperties: true
          description: Los rótulos de entrar, darse de alta, recuperar la contraseña y el bloque de cuenta.
        auth:
          type: object
          additionalProperties: true
        urls:
          type: object
          additionalProperties:
            type: string
          description: Las rutas que pinta el cajón (contacto, condiciones, privacidad…). Las compone el servidor.

    SidebarSession:
      type: object
      description: La parte del arranque del cajón que es de quien mira. Nunca se cachea.
      additionalProperties: false
      required: [outcome, orderCode, account, locales, userId, accountContext, urls]
      properties:
        outcome:
          type: string
          nullable: true
          enum: [confirmed, failed, verifying, null]
          description: En qué quedó el último pago, si está pendiente de enseñar. Se consume al leerlo.
        orderCode:
          type: string
          nullable: true
        account:
          type: object
          additionalProperties: true
          description: Los rótulos del área de cliente. Vacío sin sesión.
        locales:
          type: array
          description: Los idiomas que ofrece el selector del perfil. Lista vacía sin sesión.
          items:
            type: object
            additionalProperties: false
            required: [value, label]
            properties:
              value:
                type: string
              label:
                type: string
        userId:
          type: integer
          nullable: true
          description: El titular de la sesión, o `null` para el visitante anónimo.
        accountContext:
          type: object
          nullable: true
          additionalProperties: true
          description: |
            El contexto de cuenta del titular, o `null` sin sesión. **Tiene la forma de
            `AccountContext`** —sale del mismo Resource que `GET /me/account-context`, que es donde
            se valida campo a campo—, podada por cardinalidad: como mucho un formulario pendiente.

            ⚠️ Va declarado ABIERTO y no con `$ref`: en OpenAPI 3.0 un `$ref` no admite `nullable` a
            su lado y la forma canónica (`allOf: [$ref]` + `nullable`) no funciona con el validador
            (`DECISIONES #27`; re-medido aquí: «The data (null) must match the type: object»). Copiar
            el esquema entero para vigilar que no diverja sería una segunda definición de algo que
            ya tiene una.
        urls:
          type: object
          additionalProperties:
            type: string
          description: Las rutas que solo existen con sesión (vincular con Google).

    PublicConfig:
      type: object
      additionalProperties: false
      required: [registration, catalog_search_min_items, cart_max_lines, low_availability_max, turnstile_site_key]
      properties:
        registration:
          type: object
          nullable: true
          additionalProperties: false
          required: [url, label, description]
          description: |
            Enlace al sistema de registro del negocio, que se ofrece junto a la reserva confirmada.
            `null` cuando la instalación no lo tiene configurado — no es un error, es lo normal en
            una instalación que no lo usa.

            La etiqueta y la descripción llegan **ya traducidas** al idioma resuelto para la
            petición, con el literal por defecto si el operador no las ha traducido.

            ⚠️ La `url` viene **saneada en el servidor**: solo `http(s)`. Es la única defensa que hay
            (`SEC-07`) — en una página web el escape de la plantilla remataba la jugada, pero un
            cliente JSON no tiene escape que lo remate, así que si el saneado no ocurriese antes de
            serializar no ocurriría en ninguna parte. Cuando la URL configurada no es válida, el
            bloque entero llega `null` en vez de viajar a medias.
          properties:
            url:
              type: string
              format: uri
            label:
              type: string
            description:
              type: string
        catalog_search_min_items:
          type: integer
          description: |
            El buscador del catálogo se ofrece cuando el número TOTAL de productos es
            **estrictamente mayor** que este número (`total > catalog_search_min_items`), sobre el
            catálogo **sin filtrar** — no sobre el resultado de un `?type=`.

            El operador va escrito aquí a propósito: publicar el número sin él reparte la regla entre
            servidor y cliente, que es exactamente como divergen.
        cart_max_lines:
          type: integer
          description: |
            Tope de líneas de la cesta. El servidor rechaza con `cart_too_large` una cesta de
            **más** líneas que este número (`líneas > cart_max_lines`), así que una cesta de
            exactamente `cart_max_lines` es válida y un cliente debe impedir AÑADIR cuando ya las
            tiene.

            Es invariante de servidor (`PAY-12`): esto es un reflejo para no ofrecer un botón que el
            servidor va a rechazar, nunca la autoridad.
        low_availability_max:
          type: integer
          minimum: 0
          description: |
            Una hora se presenta como **casi llena** cuando las plazas libres que publica
            `POST /availability/{product}/times` son **menores o iguales** que este número
            (`available <= low_availability_max`).

            `0` **desactiva** el aviso, y es una respuesta del operador, no una falta: con `0` no se
            anuncia ninguna hora aunque `available` valga `0`.

            ⚠️ Viaja el UMBRAL y no el veredicto por hora. El veredicto se derivaría de `available`,
            que ya viaja en cada hora; meterlo además ahí sería un campo derivado repetido once veces
            por día. El operador va escrito aquí por lo mismo que en los otros dos números: publicarlo
            sin él reparte la regla entre servidor y cliente.

            ⚠️ **No es una regla de aforo** (`AFORO-02`). Cambiarlo no vende una plaza más ni menos:
            solo cambia cuántas horas llevan el aviso. Quien decide el cupo es `SlotOffer`.
        turnstile_site_key:
          type: string
          nullable: true
          description: |
            Clave PÚBLICA del anti-bot (Cloudflare Turnstile) para el formulario de alta. `null`
            cuando la instalación no tiene anti-bot configurado, que es un estado normal: sin claves
            el widget es un no-op y el alta funciona igual.

            **No nulo ⟺ el alta EXIGE captcha**, y por eso este campo se puede usar como el bit que
            decide si se pinta el widget. El anti-bot necesita las **dos** claves (pública y secreta):
            con solo una configurada no está activo, el servidor no verifica ningún token y aquí viaja
            `null`. Dibujar el widget con media configuración pondría al usuario a resolver un captcha
            que su propio servidor deja pasar.
    ReservationEligibility:
      type: object
      additionalProperties: false
      required: [allowed, reason, max_pending_orders]
      properties:
        allowed:
          type: boolean
          description: Si `false`, `reason` dice por qué.
        reason:
          type: string
          nullable: true
          enum: [reservations_paused, too_many_pending_orders, too_many_requests, null]
          description: |
            Código estable del motivo, `null` si se admite. Es el MISMO código que devolvería el
            sobre de error de `POST /orders` en esa situación, así que un cliente puede ramificar
            igual en los dos sitios.

            `too_many_requests` es el único que se arregla esperando; `reservations_paused` invita a
            llamar al negocio, y `too_many_pending_orders` a pagar o dejar caducar lo pendiente.
        max_pending_orders:
          type: integer
          nullable: true
          description: |
            Máximo de reservas sin pagar por titular. Solo viaja con `too_many_pending_orders`, que
            es cuando el aviso lo nombra; `null` en cualquier otro caso.

            ⚠️ **No se publica cuántas tiene** el titular, ni cuáles, ni cuándo se levanta el límite
            de frecuencia: un endpoint de elegibilidad es por naturaleza un oráculo sobre una cuenta,
            y se acota devolviendo lo justo para pintar el aviso.

    User:
      type: object
      description: |
        El usuario autenticado. La lista de campos es una ALLOWLIST (`SEC-10`): una columna nueva
        en `users` no aparece aquí hasta que alguien la añade a propósito, en el documento y en
        `UserResource`.
      required:
        - id
        - name
        - email
        - phone
        - locale
        - marketing_opt_in
        - email_verified_at
        - pending_email
        - pending_email_sent_at
        - pending_email_expires_at
        - created_at
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        locale:
          type: string
          enum: [es, en, fr]
          nullable: true
        marketing_opt_in:
          type: boolean
        email_verified_at:
          type: string
          format: date-time
          nullable: true
          description: '`null` = cuenta sin verificar (registro «pay-first»).'
        pending_email:
          type: string
          format: email
          nullable: true
          description: Cambio de correo en curso (doble opt-in por enlace firmado).
        pending_email_sent_at:
          type: string
          format: date-time
          nullable: true
        pending_email_expires_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Cuándo deja de valer el enlace de confirmación. `null` si no hay cambio pendiente.

            ⚠️ **Se publica en vez de dejar que el cliente lo calcule**: hacerlo exigiría quemar la
            ventana en cada superficie, y el día que cambie una se quedaría atrás sin que nada avise.
            Su fuente única es `Identity\Services\AccountProfile::PENDING_EMAIL_HOLD_MINUTES`.
        created_at:
          type: string
          format: date-time
          nullable: true

    ListMeta:
      type: object
      description: |
        Metadatos de una lista. `total` está SIEMPRE; los campos de paginación solo en endpoints que
        paginan, para que un cliente pueda leer `meta.total` sin saber si el endpoint pagina.
      required: [total]
      additionalProperties: false
      properties:
        total:
          type: integer
          description: Elementos totales, no los de esta página.
        current_page:
          type: integer
        last_page:
          type: integer
        per_page:
          type: integer

    ProfileUpdateRequest:
      type: object
      description: |
        Los cuatro campos del perfil. `current_password` **solo hace falta si `email` cambia**.
      required: [name, phone, locale, email]
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 255
        phone:
          type: string
          maxLength: 30
        locale:
          type: string
          description: Uno de los idiomas que la instalación sirve.
        email:
          type: string
          format: email
          maxLength: 255
          description: |
            El correo deseado. Si difiere del actual, **se solicita el cambio** y este valor NO pasa a
            ser el email del titular hasta que confirme desde el buzón nuevo.
        current_password:
          type: string
          format: password
          description: Obligatoria **solo** cuando `email` cambia.

    PasswordConfirmation:
      type: object
      description: |
        La contraseña actual del titular, para reconfirmar una acción sensible. **No se envía junto a
        ningún identificador**: quién la manda lo dice la credencial de la petición.
      required: [current_password]
      additionalProperties: false
      properties:
        current_password:
          type: string
          format: password
    PasswordChangeRequest:
      type: object
      description: 'La contraseña actual —para reconfirmar— y la nueva.'
      required: [current_password, password]
      additionalProperties: false
      properties:
        current_password:
          type: string
          format: password
        password:
          type: string
          format: password
          description: |
            La nueva. Debe cumplir la política del producto —mínimo 8 caracteres y no aparecer en el
            corpus de filtraciones—, que vive en un solo sitio (`Identity\Services\PasswordPolicy`).

    PersonalDataExport:
      type: object
      description: |
        El documento de portabilidad del titular (**art. 20**). No es una vista ni un resumen: es lo
        que hay guardado sobre él, con los importes en **céntimos** y las fechas en ISO-8601, igual
        que en la base de datos — un resumen bonito no es portable, y redondear importes al
        formatearlos pierde información.

        Su forma la componen dos módulos: Identity pone perfil, consentimientos y roles, y Booking
        pone `orders` por contrato (`Booking\Contracts\CustomerOrderHistory`) — porque son sus datos.
      required: [exported_at, profile, consents, roles, identities, dependents, orders]
      additionalProperties: false
      properties:
        exported_at:
          type: string
          format: date-time
          description: Cuándo se generó esta copia. No es un dato del titular; sitúa el documento.
        profile:
          $ref: '#/components/schemas/ExportedProfile'
        consents:
          type: array
          description: Los consentimientos legales otorgados, con su prueba (art. 7.1).
          items:
            $ref: '#/components/schemas/ExportedConsent'
        roles:
          type: array
          description: |
            Roles asignados, por su nombre. Un cliente normal no tiene ninguno: la lista vacía es lo
            esperable, y va igualmente porque es un dato que existe sobre él.
          items:
            type: string
        identities:
          type: array
          description: |
            Las cuentas de un proveedor externo (hoy, Google) con las que se entra a ésta
            (`specs/auth-con-google.md` §11). Un cliente que nunca haya vinculado ninguna tiene la
            lista vacía, y va igualmente: es un dato que existe sobre él.
          items:
            $ref: '#/components/schemas/ExportedIdentity'
        dependents:
          type: array
          description: |
            Las personas a cargo que declaró y no ha retirado (Fase 6). Datos que él mismo aportó,
            así que le pertenecen (art. 20).
          items:
            $ref: '#/components/schemas/ExportedDependent'
        orders:
          type: array
          description: Los pedidos del titular, del más antiguo al más reciente.
          items:
            $ref: '#/components/schemas/ExportedOrder'

    ExportedProfile:
      type: object
      description: |
        Los datos de la cuenta. ⚠️ **No es el mismo objeto que `User`**, y no debe unificarse: aquel
        es una ALLOWLIST de lo que una pantalla necesita (`SEC-10`) y éste es un volcado de lo que
        hay guardado — llevan `id` uno y `last_login_at` el otro por ese motivo, no por descuido.
      required:
        - name
        - email
        - pending_email
        - pending_email_sent_at
        - phone
        - locale
        - marketing_opt_in
        - email_verified_at
        - created_at
        - last_login_at
      additionalProperties: false
      properties:
        name:
          type: string
        email:
          type: string
        pending_email:
          type: string
          nullable: true
          description: Cambio de correo pedido y aún sin confirmar.
        pending_email_sent_at:
          type: string
          format: date-time
          nullable: true
        phone:
          type: string
          nullable: true
        locale:
          type: string
          nullable: true
          description: |
            El idioma guardado, tal cual. ⚠️ Sin `enum`, al revés que en `User`: aquí se vuelca lo
            que hay en la fila, y una instalación que deje de servir un idioma no debe convertir el
            export de quien lo tenía guardado en una respuesta inválida.
        marketing_opt_in:
          type: boolean
        email_verified_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        last_login_at:
          type: string
          format: date-time
          nullable: true

    ExportedConsent:
      type: object
      description: |
        Un consentimiento otorgado. La **IP** va incluida a propósito: es parte de la prueba del art.
        7.1 y es un dato personal del titular, así que le pertenece.
      required: [type, accepted_at, revoked_at, ip, version]
      additionalProperties: false
      properties:
        type:
          type: string
          description: '`privacy` · `terms` · `waiver` · `marketing`.'
        accepted_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
          description: Cuándo se retiró (art. 7.3), o `null` si sigue vivo.
        ip:
          type: string
          nullable: true
        version:
          type: string
          description: Versión del documento que se aceptó, para saber a QUÉ se dijo que sí.

    ExportedIdentity:
      type: object
      description: |
        Una identidad externa vinculada a la cuenta (`specs/auth-con-google.md` §6.2).

        ⚠️ **No es una credencial**: con lo que hay aquí no se entra a ninguna parte —entrar exige que
        el proveedor lo afirme en una petición servidor-a-servidor—. Por eso el identificador SÍ sale
        en el export: es un dato personal del titular en un tercero, y portabilidad quiere decir
        llevarse lo que hay.
      required: [provider, provider_id, email_at_link, linked_via, linked_at]
      additionalProperties: false
      properties:
        provider:
          type: string
          description: '`google` es el único de hoy.'
        provider_id:
          type: string
          description: El identificador estable de esa persona en el proveedor (el `sub` de OpenID Connect).
        email_at_link:
          type: string
          nullable: true
          description: |
            El correo **con el que se vinculó**, como copia probatoria. Puede diferir del correo actual
            de la cuenta o del que tenga hoy en el proveedor: dice con cuál se estableció el vínculo.
        linked_via:
          type: string
          description: 'Por qué puerta se vinculó: `signup` · `login` · `account`.'
        linked_at:
          type: string
          format: date-time
          nullable: true

    ExportedDependent:
      type: object
      description: |
        Una persona a cargo declarada por el titular y no retirada (Fase 6,
        `specs/menores-a-cargo.md` §5). Las retiradas con un waiver firmado detrás viven bajo el
        régimen restringido del registro probatorio y, como la propia firma, **no salen aquí**.
      required: [name, born_on, added_at]
      additionalProperties: false
      properties:
        name:
          type: string
        born_on:
          type: string
          format: date
        added_at:
          type: string
          format: date-time
          nullable: true

    ExportedOrder:
      type: object
      description: |
        Un pedido con su detalle. ⚠️ **No es el mismo objeto que `Order`** (el de `GET /me/orders`) y
        tampoco debe unificarse: aquél publica lo que una pantalla necesita —estado efectivo,
        reembolsos, si se puede reintentar, etiquetas ya formateadas— y éste vuelca lo guardado.
      required:
        - code
        - status
        - subtotal_cents
        - tax_cents
        - total_cents
        - currency
        - created_at
        - paid_at
        - expires_at
        - items
        - tickets
      additionalProperties: false
      properties:
        code:
          type: string
        status:
          type: string
          description: |
            El estado GUARDADO, sin el `expired` calculado que sí publica `GET /me/orders`: aquí se
            entrega el dato, no su lectura.
        subtotal_cents:
          type: integer
        tax_cents:
          type: integer
        total_cents:
          type: integer
        currency:
          type: string
        created_at:
          type: string
          format: date-time
          nullable: true
        paid_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        items:
          type: array
          description: Las líneas principales; los complementos van anidados en cada una.
          items:
            $ref: '#/components/schemas/ExportedOrderItem'
        tickets:
          type: array
          description: Las entradas emitidas para este pedido.
          items:
            $ref: '#/components/schemas/ExportedTicket'

    ExportedOrderItem:
      type: object
      required: [product, date, time, quantity, unit_price_cents, seats, event_data, addons, dependents]
      additionalProperties: false
      properties:
        product:
          type: string
          nullable: true
          description: Nombre del producto en el idioma de la instalación. `null` si ya no existe.
        date:
          type: string
          format: date
          nullable: true
          description: La fecha de la franja, CIVIL — sin hora y sin zona horaria.
        time:
          type: string
          nullable: true
          description: Hora de inicio de la franja, `HH:MM:SS`.
        quantity:
          type: integer
        unit_price_cents:
          type: integer
        seats:
          type: integer
          description: Plazas que ocupa la línea (cantidad × plazas por unidad).
        event_data:
          type: object
          nullable: true
          description: |
            Las respuestas del formulario del pack, tal cual se guardaron.

            ⚠️⚠️ **Aquí está el art. 9**: nombre y **alergias** del homenajeado. Va entero y en claro
            porque es exactamente lo que el art. 20 obliga a entregarle al titular; lo que la ley
            exige a cambio es no cachearlo (`no-store`), no recortarlo. Es también el motivo de que
            `GET /me/orders` lo excluya y lo sirva aparte: una cosa es la lista que se pinta sola en
            cada página y otra el titular pidiendo su copia.

            Forma LIBRE: sus claves las definen los campos que el panel haya configurado para ese
            producto, así que no se declaran aquí.
        addons:
          type: array
          items:
            $ref: '#/components/schemas/ExportedOrderAddon'
        dependents:
          type: array
          description: |
            Los nombres de los menores a cargo para los que era esta entrada (Fase 6 · menores a
            cargo, tanda 4, `RGPD-04`): dato personal de terceros que el titular declaró y por eso
            forma parte de su copia del art. 20. Vacío si ninguna unidad era para un menor.
          items:
            type: string

    ExportedOrderAddon:
      type: object
      description: 'Un complemento de la línea. No lleva franja: hereda la de su línea principal.'
      required: [product, quantity, unit_price_cents]
      additionalProperties: false
      properties:
        product:
          type: string
          nullable: true
        quantity:
          type: integer
        unit_price_cents:
          type: integer

    ExportedTicket:
      type: object
      description: |
        Una entrada emitida.

        ⚠️ **No lleva el `qr_token`**, y no es un olvido: ese token es la credencial que canjea la
        entrada en la puerta, y un export es un fichero que el titular guarda, reenvía y a veces
        pierde. Lo que se entrega es qué pasó con la entrada, no con qué se abre.
      required: [status, issued_at]
      additionalProperties: false
      properties:
        status:
          type: string
          description: '`purchased` · `prepared` · `redeemed` · `void`.'
        issued_at:
          type: string
          format: date-time
          nullable: true

    ConsentList:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Consent'
        meta:
          $ref: '#/components/schemas/ListMeta'

    Consent:
      type: object
      description: Un consentimiento otorgado, tal como el titular lo ve.
      required: [type, type_label, accepted_at, accepted_label, revoked_at, revoked_label, version]
      additionalProperties: false
      properties:
        type:
          type: string
          description: '`privacy` · `terms` · `waiver` · `marketing`. El identificador, para programar.'
        type_label:
          type: string
          description: |
            El nombre del documento en el idioma negociado («Política de privacidad»).

            ⚠️ **Lo compone el servidor** para que el cliente no tenga que llevar su propia tabla de
            cuatro rótulos: sería una segunda lista que envejece sola el día que se añada un quinto
            tipo de consentimiento. Un tipo desconocido devuelve su propio identificador, nunca
            cadena vacía — un rótulo en blanco se lee como «no hay nada».
        accepted_at:
          type: string
          format: date-time
          nullable: true
        accepted_label:
          type: string
          description: |
            La fecha ya compuesta («23/08/2026`»), **en la zona horaria de la instalación**, por el
            mismo motivo que `created_label` en un pedido.
        revoked_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Cuándo se RETIRÓ (art. 7.3), o `null` si sigue vivo. La fila no se borra al retirar: sigue
            probando que en su día se aceptó —lo que justifica los envíos que se hicieron— y esta
            fecha dice cuándo dejó de valer.

            ⚠️ Hoy **solo `marketing` se puede retirar**: los otros tres no son consentimientos
            revocables en el sentido del RGPD.
        revoked_label:
          type: string
          nullable: true
          description: La fecha de la retirada ya compuesta, en la zona horaria de la instalación.
        version:
          type: string
          description: Versión del documento que se aceptó. Es lo que dice a QUÉ se dijo que sí.

    AccountContext:
      type: object
      description: |
        El contexto de cuenta del titular: saludo, próxima reserva, cuántas quedan y qué formularios
        de invitados están pendientes.
      required: [first_name, email_verified, upcoming_count, next_reservation, pending_forms, pending_forms_count, waiver, terms_pending, terms_updated, phone_missing, extras_invite]
      additionalProperties: false
      properties:
        first_name:
          type: string
          description: |
            El nombre de pila, ya recortado. **Puede ser cadena vacía** —un titular cuyo nombre son
            solo espacios—, y el cliente debe tratarlo: es lo que evita saludar con «Hola,   ».
        email_verified:
          type: boolean
          description: |
            ¿El titular ha verificado su correo?

            Desde `#331` el alta suelta **abre sesión**, así que el área de cuenta es donde se le pide
            que lo verifique — y para pedírselo hay que saber si le falta. Junto con `waiver.pending`
            forma el aviso ÚNICO del índice: «verifica tu correo» y, si además dejó la exención
            aceptada, «con él quedará firmada».
        upcoming_count:
          type: integer
          minimum: 0
          description: Cuántas reservas futuras tiene. Es el mismo total que `meta.total` de `/me/reservations`.
        next_reservation:
          type: object
          nullable: true
          description: |
            La más próxima, o `null` si no tiene ninguna. **Misma forma exacta que un elemento de
            `/me/reservations`**, y no por casualidad: la compone el mismo recurso
            (`UpcomingReservationResource`), para que no haya dos definiciones de «reserva próxima»
            en esta API.

            ⚠️⚠️ **Va escrito INLINE y es una COPIA VIGILADA de `UpcomingReservation`, no un
            `$ref`.** En OpenAPI 3.0 un `$ref` no admite `nullable` a su lado, y la forma canónica
            —`allOf: [$ref]` con `nullable: true`— **no funciona con el validador**: medido aquí el
            2026-08-23, con ella una reserva presente falla con «The data (object) must match the
            type: null». Es el mismo hallazgo que ya documentó `DECISIONES #27` para la zona del
            catálogo, y se resuelve igual. Que las dos definiciones no diverjan lo vigila
            `ApiContractTest`.
          required: [date, date_label, time_window, product_name]
          additionalProperties: false
          properties:
            date:
              type: string
              format: date
            date_label:
              type: string
              description: |
                El día ya compuesto para mostrar, en el idioma de la petición: «Dom. 23 ago.».

                ⚠️ **No lo recompongas en el cliente.** Medido el 2026-08-22: `Intl.DateTimeFormat` no
                reproduce esta cadena en español —«Sáb 5 sept» frente a «Sáb. 5 sep.»: ICU no abrevia
                con punto—, y reproducirla exigiría una tabla de meses traducidos en el cliente. Su
                fuente única en el servidor es `Platform\Services\DisplayTime::dayLabel()`.
            time_window:
              type: string
              nullable: true
              description: '«10:00–12:00», «10:00 – sin límite», o `null` si la franja no tiene hora.'
            product_name:
              type: string
        pending_forms:
          type: array
          description: |
            Un elemento por RESERVA con formulario de invitados pendiente (#217) cuya franja aún no ha
            terminado — no por pedido: un pedido puede llevar dos packs.

            ⚠️ **Lista completa y sin paginar**, porque es corta por naturaleza. Quien la siembra en
            un HTML puede podarla; el contrato no.
          items:
            $ref: '#/components/schemas/PendingGuestForm'
        pending_forms_count:
          type: integer
          minimum: 0
          description: |
            Cuántos hay. Va aparte y **no es `pending_forms.length`** para el cliente que reciba la
            lista podada: es el número que decide si el aviso lleva a un formulario concreto o al
            listado.
        waiver:
          type: object
          description: |
            Fase 6 · waiver (`specs/waiver-probatorio.md` §4.8): **si hay que firmar, y qué texto**.
            Este contexto es lo que el cajón repinta al conseguir sesión, y «el siguiente momento
            natural» de la re-firma es entrar o comprar — nunca el mostrador.

            `required`: modo interno y sin ninguna firma · `outdated`: firmado en una versión anterior
            del texto (en la puerta se deja pasar) · `document_id`: el texto vigente en este idioma,
            para `POST /me/waiver` — el mismo id que publica `GET /legal/waiver` ·
            `dependents_pending`: le queda algún MENOR sin firma vigente (`#441`).
          required: [mode, required, pending, outdated, document_id, dependents_pending]
          additionalProperties: false
          properties:
            mode:
              type: string
              enum: [externo, interno, desactivado]
            required:
              type: boolean
            pending:
              type: boolean
              description: La aceptación del alta espera al correo verificado (`#181`).
            outdated:
              type: boolean
            document_id:
              type: integer
              nullable: true
            dependents_pending:
              type: boolean
              description: |
                `#441` — ¿le queda algún menor a cargo ACTIVO **sin firma de la versión vigente**?

                Hasta esta tanda el índice de la cuenta miraba solo el waiver del TITULAR, así que un
                menor sin firma no generaba aviso en ninguna parte: el cliente se enteraba al intentar
                asignarle una entrada, o en la puerta del parque.

                ⚠️ Cubre los dos casos que el producto deja vivos —el menor declarado antes de que
                declarar exigiera aceptar, y el que queda `outdated` al publicarse un texto nuevo, que
                es el recurrente porque el asignador exige firma VIGENTE—. Siempre `false` fuera del
                modo `interno`.
        terms_pending:
          type: boolean
          description: |
            ¿Le faltan las **condiciones** antes de poder contratar? (`#349`)

            Es el mismo tipo de hecho que `waiver.pending` —qué le debe esta cuenta al producto antes
            de comprar— y por eso viaja por aquí: el cajón repinta este contexto al conseguir sesión,
            así que el embudo lo tiene sin una petición más.

            ⚠️ **Es una PISTA para saber qué pintar, nunca la autoridad.** Quien decide es el servidor
            al crear el pedido (`POST /orders` responde `422` con `accept_terms` si faltan), y un
            cliente correcto sabe reaccionar a ese `422` aunque esta pista dijera `false`.

            `false` cuando esta instalación **no ha publicado** ninguna versión de las condiciones: sin
            versión no hay nada que aceptar y la venta sigue.
        terms_updated:
          type: boolean
          description: |
            ¿Le faltan porque **han cambiado**? (`#349`)

            ⚠️ Va aparte de `terms_pending` porque son dos hechos: aquél decide si se PIDE y éste
            decide qué se DICE. `[owner]`: *«si se cambian las condiciones, se pide de nuevo diciendo
            que se han actualizado»* — y decírselo a quien nunca las aceptó sería contarle una
            historia que no es la suya. Solo puede ser `true` si `terms_pending` lo es.
        phone_missing:
          type: boolean
          description: |
            ¿La cuenta **no tiene teléfono**? (`#349`)

            ⚠️ Se llama `missing` y no `pending` a propósito: el teléfono no espera una decisión del
            titular, sencillamente no está — y de eso depende que la pantalla de pagar pinte un CAMPO
            y no una casilla. Es lo que permite que el alta con Google no lo pregunte: se pide donde
            hace falta, y solo a quien no lo ha dado.
        extras_invite:
          type: object
          nullable: true
          description: |
            **La reserva a la que invitar a añadir EXTRAS**, o `null` si no hay ninguna
            (`specs/complementos-post-reserva.md` §4.7·quinquies, D15).

            ⚠️ **No es `pending_forms` y no se mezcla con ella**: aquélla es una DEUDA («te faltan
            los datos de los invitados») y ésta una INVITACIÓN («todavía puedes añadir algo»). En la
            misma lista, «tienes 2 formularios pendientes» contaría como pendiente uno completo.

            ⚠️⚠️ Existe porque el aviso de formulario **muere en cuanto las fichas están completas**,
            que es justo cuando quedan extras por elegir. **Una sola reserva y no una lista**: el
            aviso nombra un producto, y con varias la más cercana es la que antes cierra su plazo.

            ⚠️⚠️ **Va escrito INLINE y es una COPIA VIGILADA de `PendingGuestForm`, no un `$ref`.**
            En OpenAPI 3.0 un `$ref` no admite `nullable` a su lado, y la forma canónica —`allOf:
            [$ref]` con `nullable: true`— **no funciona con el validador**: medido aquí, con ella un
            contexto sin invitación falla con «The data (null) must match the type: object». Es el
            hallazgo que `DECISIONES #27` documentó para la zona del catálogo y que
            `AccountContext.next_reservation` ya pagó. Que las dos definiciones no diverjan lo vigila
            `ApiContractTest`.
          required: [product_name, url]
          additionalProperties: false
          properties:
            product_name:
              type: string
              description: El nombre del producto de esa reserva, para nombrarlo en el aviso.
            url:
              type: string
              format: uri
              description: |
                La ruta WEB del post-form de esa reserva, **sin firmar** — la misma que
                `pending_forms[].url`, con las mismas razones y la misma prohibición: aquí NUNCA
                viaja la URL firmada.

    PendingGuestForm:
      type: object
      description: Una reserva cuyo formulario de invitados está por rellenar.
      required: [product_name, url]
      additionalProperties: false
      properties:
        product_name:
          type: string
          description: Nombre del producto en el idioma de la petición.
        url:
          type: string
          format: uri
          description: |
            La página WEB del formulario, **sin firmar**. La autoriza la sesión del titular
            (`Http\Concerns\AuthorizesGuestForm` acepta firma **o** titularidad), y es el mismo valor
            que `guest_form_url` en `/me/orders`.

            ⚠️⚠️ **Nunca es la URL firmada del correo.** Ésa es una credencial portadora que abre y
            **reescribe** nombres y alergias de menores (art. 9) sin sesión y durante días; publicarla
            en un agregado que además se siembra en HTML sería repartirla.

            ⚠️ **Un cliente por Bearer no puede seguirla**: al abrirla recibiría `403`, porque quien
            la autoriza es la sesión web. Un cliente nativo que necesite el formulario tendrá su
            propio campo firmado cuando llegue.

    UpcomingReservationList:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UpcomingReservation'
        meta:
          $ref: '#/components/schemas/ListMeta'

    UpcomingReservation:
      type: object
      description: |
        Una reserva futura. La fecha viaja **cruda y etiquetada**: cruda para un cliente que quiera
        formatear a su manera, y etiquetada porque el idioma de la abreviatura es del servidor. La
        ventana horaria ya viene compuesta porque componerla —según la franja tenga fin o no— es
        regla del dominio.
      required: [date, date_label, time_window, product_name]
      additionalProperties: false
      properties:
        date:
          type: string
          format: date
        date_label:
          type: string
          description: |
            El día ya compuesto para mostrar, en el idioma de la petición: «Dom. 23 ago.».

            ⚠️ **No lo recompongas en el cliente.** Medido el 2026-08-22: `Intl.DateTimeFormat` no
            reproduce esta cadena en español —«Sáb 5 sept» frente a «Sáb. 5 sep.»: ICU no abrevia
            con punto—, y reproducirla exigiría una tabla de meses traducidos en el cliente. Su
            fuente única en el servidor es `Platform\Services\DisplayTime::dayLabel()`.
        time_window:
          type: string
          nullable: true
          description: '«10:00–12:00», «10:00 – sin límite», o `null` si la franja no tiene hora.'
        product_name:
          type: string

    ReservationCardList:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ReservationCard'
        meta:
          $ref: '#/components/schemas/ListMeta'

    ReservationCard:
      type: object
      description: |
        Una reserva con el contexto mínimo de su pedido.

        ⚠️ **La reserva va ANIDADA y no aplanada** porque `OrderItem` declara
        `additionalProperties: false`: un `allOf` que le añadiera campos al lado sería inválido, y
        aplanarla obligaría a copiar sus veinte propiedades en un esquema nuevo destinado a divergir.

        ⚠️ **No hay ningún `is_terminated`, y se descartó a propósito.** Sería un eco del ámbito que
        acabas de pedir —no puede decir nada nuevo— o una segunda definición del predicado que
        reparte los dos ámbitos. Para atenuar una tarjeta basta con saber en qué ámbito estás; para
        distinguir «cancelada» de «disfrutada», `reservation.cancelled` y `reservation.status`.
      required: [reservation, order]
      additionalProperties: false
      properties:
        reservation:
          $ref: '#/components/schemas/OrderItem'
        order:
          $ref: '#/components/schemas/ReservationCardOrder'

    ReservationCardOrder:
      type: object
      description: |
        Lo mínimo del pedido para pintar la tarjeta plegada: de dónde viene y si hay algo que hacer
        con él. El resto —el ledger completo— se pide con `GET /orders/{code}` al desplegarlo.
      required: [code, status, created_label, can_be_retried]
      additionalProperties: false
      properties:
        code:
          type: string
          description: La referencia que se enseña en la tarjeta y con la que se pide el pedido entero.
        status:
          type: string
          description: |
            Estado DE HECHO, no la columna: un pedido cuyo hold ya venció es `expired` aunque el
            barrido periódico no haya pasado — y en staging llegó a llevar 24 h muerto.
          enum: [pending, paid, cancelled, refunded, expired]
        created_label:
          type: string
          description: Cuándo se hizo el pedido, ya compuesto para mostrar.
        can_be_retried:
          type: boolean
          description: |
            Lo decide el dominio, no el cliente: es la misma respuesta que gobierna el botón de
            reintentar el cobro, y recomponerla sería una superficie más que puede divergir.

    OrderList:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        meta:
          $ref: '#/components/schemas/ListMeta'

    Order:
      type: object
      description: |
        Un pedido visto por su dueño. Todos los importes en **céntimos enteros**, con `currency` al
        lado: la API no formatea dinero porque eso obligaría a decidir aquí el locale.
      required:
        - code
        - status
        - currency
        - online_amount_cents
        - ledger
        - refund
        - can_be_retried
        - created_at
        - created_label
        - paid_at
        - expires_at
        - items
        - guest_form_pending
      additionalProperties: false
      properties:
        code:
          type: string
          description: Código visible del pedido; su prefijo lo fija cada instalación.
        status:
          type: string
          enum: [pending, paid, cancelled, expired, refunded]
          description: |
            Estado EFECTIVO: un pedido cuyo hold ya venció sale `expired` aunque el barrido
            periódico todavía no haya pasado. `refunded` solo aparece en datos antiguos — el
            reembolso vive en `refund`, no aquí.
        currency:
          type: string
        online_amount_cents:
          type: integer
          description: |
            Importe que se cobra ONLINE: la señal si el producto la usa, el total si no. **No** es
            «lo pendiente»: un pedido ya pagado informa el mismo importe. Es la misma fuente que
            usará el reintento de pago, así que el cliente puede anticipar el cargo sin recalcularlo.
        ledger:
          allOf:
            - $ref: '#/components/schemas/Ledger'
          description: |
            **EL LIBRO, y es el único sitio donde vive** (`DECISIONES #305`). Hasta la tanda B
            cada superficie componía su desglose con campos sueltos de esta raíz, y así es como
            divergieron: medido, 18 de 23 gestiones del panel dejaban la columna del cliente
            ilegible. Desde la T3 del libro es la MISMA composición (`Booking\Services\OrderBook`)
            que leen el panel, la hoja de sala, la puerta y los correos.

            ⚠️ `online_amount_cents` se queda FUERA a propósito: es «cuánto se te cobrará si pagas
            ahora» —lo que consume el reintento—, no una dimensión del ledger. Leerlo como si fuera
            «lo pagado» es lo que hacía que un pedido SIN pagar anunciara «Pagado online 11,90 €».
        refund:
          $ref: '#/components/schemas/OrderRefund'
        can_be_retried:
          type: boolean
          description: Lo decide el dominio, no el cliente. Lo servirá `POST orders/{code}/payment`.
        created_at:
          type: string
          format: date-time
          nullable: true
        created_label:
          type: string
          description: |
            Cuándo se hizo el pedido, ya compuesto para mostrar («23/08/2026 14:30») **en la zona
            horaria de la instalación**.

            ⚠️ Ese es el motivo de que viaje compuesto y no solo como instante: `display_timezone`
            es un ajuste del panel, y un cliente en otra zona formatearía el mismo pedido con una
            hora distinta de la que enseña el panel. Cadena vacía si no hay fecha.
        paid_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Cuándo se libera la retención de aforo. `null` en un pedido firme.
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        guest_form_pending:
          type: boolean
          description: |
            Si alguna reserva de este pedido tiene todavía pendiente el formulario de invitados.

            ⚠️ **No es el `any()` de `items[].needs_guest_form`, y por eso se llama distinto.** El
            servidor descarta primero las líneas CANCELADAS: un cliente que agregara el campo de las
            líneas contaría una cancelada y prometería un formulario que nadie va a pedir.
    Ledger:
      type: object
      description: |
        **EL LIBRO del pedido** (`DECISIONES #305` `[DECIDIDO owner]`, `specs/desglose-libro.md` §4.3):
        cada gestión es una línea con su signo y su fecha, el Total es la suma y el SALDO se liquida
        EN EL PARQUE — positivo se paga, negativo se devuelve.

            total_cents    = Σ movements[].amount_cents        (identidad I3, evaluada en ejecución)
            paid_cents     = cobros − devoluciones con éxito + liquidado en el parque
            balance.cents  = total_cents − paid_cents          (con signo)

        ⚠️ **Nada se cobra ni se devuelve online después de la reserva** (D2): el saldo se liquida en
        el parque, o lo devuelve un operador a mano. ⚠️ Un reembolso EN CURSO o FALLIDO se lista en
        `settlements` con su estado y **no** entra en `paid_cents`: el saldo sigue diciendo «a devolver X»
        mientras el dinero no ha vuelto.

        ⚠️⚠️ Sustituye desde la T3 del libro (2026-09-01) al desglose de DOS EJES de `#127`
        (`value`/`cash`/`gate_lines`/`invoiced_*`/`in_favour_hint`): cambio INCOMPATIBLE de `v1`,
        asumido porque el único consumidor era el cajón (`specs/desglose-libro.md` §4.5).
      required: [total_cents, paid_cents, balance, movements, settlements, has_deposit, is_consistent, note]
      additionalProperties: false
      properties:
        total_cents:
          type: integer
          description: |
            Lo que vale HOY lo que sigue vivo del pedido, cortesías incluidas. Es la Σ de las líneas de
            valor: si no lo fuera, `is_consistent` sería `false`.
        paid_cents:
          type: integer
          description: |
            Lo que ya está saldado: cobros con éxito − devoluciones con éxito + lo liquidado en el
            parque (una visita pasada de un pedido cobrado se da por liquidada, D9 de la T5 de mixtos).
        balance:
          $ref: '#/components/schemas/LedgerBalance'
        movements:
          type: array
          description: |
            Las líneas de VALOR, cronológicas: el nacimiento, cada gestión, cada cancelación, cada
            cortesía. **Etiquetas ya compuestas y traducidas por el servidor**, neutras de voz — el
            mismo diccionario que lee el panel (D1: cliente y operador ven lo MISMO). En un pedido con
            varias reservas cada línea lleva delante el nombre de la suya.
          items:
            $ref: '#/components/schemas/LedgerMovement'
        settlements:
          type: array
          description: |
            Las líneas de DINERO, cronológicas: cada cobro, cada devolución (con su estado) y lo
            liquidado en el parque. Es lo que el cliente puede cotejar con su extracto.
          items:
            $ref: '#/components/schemas/LedgerSettlement'
        has_deposit:
          type: boolean
          description: |
            Si alguna reserva viva del pedido nació con SEÑAL (una parte online y el resto en el
            parque). Un HECHO del pedido —el reparto que se escribió al comprar—, no una lectura del
            catálogo ni de que quede algo pendiente: un pedido con señal cuyo resto ya se liquidó
            **sigue siendo** un pedido con señal.
        is_consistent:
          type: boolean
          description: |
            **¿El libro CIERRA?** Cuatro identidades evaluadas **en ejecución** sobre ESTE pedido y
            AHORA (spec §4.1): nacimiento (`Order.total` es lo que las líneas dicen que nació), caja
            (lo cobrado es lo que las líneas aportaron), libro (el Total es la Σ de sus líneas) y
            columna de reembolso.

            ⚠️ **Cuando es `false`, un cliente NO debe pintar el libro**: si las identidades no cierran,
            ninguna línea es cierta. Lo que sigue siendo un hecho es el Total y los cobros; `note` trae
            la frase de revisión y `balance.kind` vale `under_review`.
        note:
          type: string
          nullable: true
          description: |
            La frase que explica el estado, ya compuesta y traducida, o `null`. Solo TRES casos
            sobreviven al libro (spec §4.3): «en revisión», «caducó sin cobro» y «pendiente de pago».
            Lo demás lo dicen las líneas: en un libro cada línea es su propia explicación.
    LedgerBalance:
      type: object
      description: |
        **El SALDO y su sentido** (spec §4.4). El signo dice qué pasa en el parque; `kind` dice cuál de
        los siete casos es, y **eso lo decide el servidor**: recomponerlo comparando importes en el
        cliente sería la novena superficie que diverge.
      required: [kind, cents, rest_at_park_cents]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [pay_at_park, refund_at_park, refund_pending, settled, pay_online, expired, under_review]
          description: |
            · `pay_at_park` · cobrado y `cents > 0`: «A pagar en el parque».
            · `refund_at_park` · cobrado, `cents < 0` y hay una reserva viva sin finalizar: «A devolver
              en el parque».
            · `refund_pending` · cobrado, `cents < 0` y NO habrá visita (pedido cancelado, o todo
              finalizado o cancelado): «Pendiente de devolución» — el operador decide el canal.
            · `settled` · cobrado y a cero: sin línea de saldo.
            · `pay_online` · sin cobrar y aún pagable: `cents` es lo que falta POR WEB y
              `rest_at_park_cents` lo que además se pagará en el parque (la señal).
            · `expired` · caducado sin cobro (`cents = 0`).
            · `under_review` · las identidades no cierran (`cents = 0`): no se afirma ningún saldo.
        cents:
          type: integer
          description: |
            **Con signo**: positivo se paga, negativo se devuelve. En `pay_online` es lo que falta por
            cobrar POR WEB, no el saldo entero; en `expired` y `under_review`, `0`.
        rest_at_park_cents:
          type: integer
          description: |
            Solo en `pay_online`: lo que, además de lo online, se pagará en el parque. Publicado y no
            derivado (`total − cents`): una superficie que lo restara por su cuenta sería la clase de
            duplicado del que nacieron las divergencias de `#127`. `0` en los demás casos.
    LedgerMovement:
      type: object
      description: Una línea de VALOR del libro.
      required: [kind, label, amount_cents, occurred_at, occurred_label, reservation_id]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [booking, edit, mixed, cancel, courtesy]
          description: |
            `booking` (con qué nació el pedido: lo facturado) · `edit` (el delta ENTERO de una gestión:
            cantidad, producto, fecha con re-tarifa, complemento) · `mixed` (la línea viva de fiesta
            mixta: suplemento + o descuento −) · `cancel` (lo que una cancelación retira, cortesía
            incluida) · `courtesy` (dinero devuelto sin que desapareciera producto, siempre ≤ 0).
        label:
          type: string
          description: "Ya compuesta y traducida por el servidor («Cantidad: 4 → 2», «Cancelado: Cumple Jump · 8 invitados»…)."
        amount_cents:
          type: integer
          description: 'Con signo: + sube el valor, − lo baja.'
        occurred_at:
          type: string
          format: date-time
        occurred_label:
          type: string
          description: '`d/m/Y` en la zona horaria de la instalación; la hora vive en el historial.'
        reservation_id:
          type: integer
          format: int64
          nullable: true
          description: La reserva (su línea principal) a la que pertenece; `null` en el nacimiento del PEDIDO.
    LedgerSettlement:
      type: object
      description: Una línea de DINERO del libro.
      required: [kind, label, amount_cents, occurred_at, occurred_label, status, method]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [payment, refund, gate]
          description: '`payment` (un cobro) · `refund` (una devolución, con su estado) · `gate` (lo liquidado en el parque al pasar la visita, CON SIGNO: + lo que quedaba por pagar se dio por cobrado en recepción, «Liquidado en el parque»; − lo que quedaba por devolver se dio por entregado allí, «Devuelto en el parque» — la liquidación es simétrica, `DECISIONES #316`).'
        label:
          type: string
          description: Ya compuesta y traducida («Pagado online», «Devuelto a la tarjeta», «Devolución en curso», «Liquidado en el parque»…).
        amount_cents:
          type: integer
          description: 'Con signo: + cobros y liquidación a favor del parque; − devoluciones y liquidación a favor del cliente.'
        occurred_at:
          type: string
          format: date-time
        occurred_label:
          type: string
          description: '`d/m/Y`; para `gate`, la fecha CIVIL de la franja.'
        status:
          type: string
          enum: [succeeded, pending, failed]
          description: |
            Solo `succeeded` cuenta en `paid_cents`. Un `pending` (en curso) o un `failed` se lista para
            que el cliente sepa que hay una devolución en camino o que falló — y `PAY-09` impide
            devolverla dos veces.
        method:
          type: string
          # `null` va DENTRO del enum además de `nullable`, como en `charged_method` de antes.
          enum: [web, desk, card, manual, null]
          nullable: true
          description: '`web` (pasarela) o `desk` (taquilla) en un cobro; `card` (REST) o `manual` (registrada por el operador) en una devolución; `null` en `gate`.'
    OrderRefund:
      type: object
      description: |
        El reembolso es una dimensión INDEPENDIENTE del estado: un pedido puede estar `paid` y
        parcialmente reembolsado a la vez.
        ⚠️ **Aquí va CUÁNDO y si fue total; el IMPORTE vive en `ledger.cash.refunded_cents`.** Un
        número, un sitio: tenerlo en dos era la clase de duplicado del que nacen las divergencias.
      required: [refunded_at, refunded_label, fully_refunded]
      additionalProperties: false
      properties:
        refunded_at:
          type: string
          format: date-time
          nullable: true
        refunded_label:
          type: string
          description: 'La fecha con la que se anuncia el reembolso («23/08/2026»). Vacía si no lo hay.'
        fully_refunded:
          type: boolean

    OrderItem:
      type: object
      description: Una línea principal del pedido. Sus complementos van anidados en `addons`.
      required:
        - id
        - product_name
        - date
        - date_label
        - time_window
        - quantity
        - charged_subtotal_cents
        - status
        - cancelled
        - guest_form_status
        - needs_guest_form
        - addons
        - is_pack
        - start_time
        - ledger
        - guest_form_url
        - shows_deposit_note
        - quantity_label
        - icon
        - can_add_extras
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        product_name:
          type: string
        date:
          type: string
          format: date
          nullable: true
        date_label:
          type: string
          description: |
            El día de la reserva ya compuesto para mostrar («Dom. 23 ago.»), en el idioma de la
            petición. Mismo criterio que `time_window`: el servidor publica el texto y el cliente no
            lo recompone — `Intl` no reproduce esta cadena en español. Vacío si la reserva no tiene
            franja. Fuente única: `Platform\Services\DisplayTime::dayLabel()`.
        time_window:
          type: string
          nullable: true
        quantity:
          type: integer
        charged_subtotal_cents:
          type: integer
          description: Lo realmente cobrado por la línea, no el precio de catálogo.
        status:
          type: string
          enum: [active, finished]
          description: Derivado de si su franja ya pasó. `cancelled` es un eje aparte.
        cancelled:
          type: boolean
        guest_form_status:
          type: string
          # `null` va DENTRO del enum además de `nullable`: en OpenAPI 3.0 un enum sin él rechaza
          # el nulo aunque el campo se declare anulable (lo destapó el test de contrato).
          enum: [ok, pending, null]
          nullable: true
          description: |
            `null` = esta línea no pide datos por invitado; así el cliente distingue «no aplica» de
            «pendiente». `pending` también cuando alguna edad declarada NO tiene producto en las
            condiciones de la reserva (una fiesta por edad, `specs/cumple-mixto.md` §22): el
            formulario no se da por completo hasta que el parque lo resuelva con el titular.
        needs_guest_form:
          type: boolean
        addons:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemAddon'
        is_pack:
          type: boolean
          description: |
            Si esta reserva es un PACK (un servicio con invitados) o una entrada. Se pinta distinto
            —«N invitados · Nombre» frente a «N× Nombre»— y no se deduce de ningún otro campo.
        start_time:
          type: string
          nullable: true
          description: |
            Hora de inicio en crudo (`HH:MM:SS`), o `null` si la reserva no tiene franja.
            `time_window` es un texto YA compuesto para mostrar; esto evita tener que partirlo.
        ledger:
          allOf:
            - $ref: '#/components/schemas/Ledger'
          description: |
            El desglose **de esta reserva** (principal + sus complementos), con la misma forma que el
            del pedido: en una cesta mixta entrada+pack, el agregado del pedido no sirve para
            etiquetar una línea.

            ⚠️ Es el libro de la RESERVA (`OrderBook::forReservation`): su nacimiento es lo que
            nació ESTA reserva, y el cobro y las devoluciones del pedido viajan ATRIBUIDOS a ella
            (un reembolso total se reparte por la misma prorrata en todas las superficies). Su saldo
            es el suyo: en un pedido con dos reservas en días distintos, cada una se liquida en su
            visita. `is_consistent` es la del PEDIDO: las identidades son del pedido.
        guest_form_url:
          type: string
          nullable: true
          description: |
            Dónde rellenar los datos de los invitados de ESTA reserva, o `null` si no los admite —lo
            decide el dominio (`acceptsGuestForm()`: pedido pagado y producto con invitados), no el
            cliente—.

            ⚠️ Es la ruta **web**, que acepta al dueño autenticado sin firma. La variante firmada de
            la API (`reservations/{id}/guest-form`) la entrega `GuestFormResource`, y no vale aquí:
            la firma cubre la URL EXACTA (§10.duodecies 64). La URL la compone el servidor porque
            componerla en el cliente significaría quemar el enrutador en JavaScript.
        shows_deposit_note:
          type: boolean
          description: |
            Si procede enseñar «señal pagada · resto en el parque» para esta reserva.

            Son TRES condiciones compuestas por el servidor —el pedido está pagado, el producto usa
            señal y queda algo en puerta—. Se publica el resultado y no las piezas a propósito: hay
            cuatro superficies pintando este bloque, y recomponerlo en cada una es como divergen.
        quantity_label:
          type: string
          description: |
            La cantidad ya compuesta con su NOMBRE («8 invitados», «2 entradas»), en el idioma de la
            petición. Mismo criterio que `date_label` y `time_window`.

            ⚠️⚠️ **Publicarla arregla el defecto `L2`**: el cliente pintaba `quantity` y el importe de
            la línea pegados —`8×216,00 €`—, que se lee como «8 unidades a 216 € cada una» = 1.728 €
            cuando son **8 invitados y 216 € en total**. El número solo no distingue cantidad de
            importe, y el sustantivo es lo que lo desambigua.

            ⚠️ Y no se compone en el cliente porque el sustantivo depende del TIPO de producto (pack
            → invitados, entrada → entradas, con plural) y del idioma: era la quinta copia de una
            regla que el dominio ya tenía.
        icon:
          type: string
          description: |
            **Clave del icono que marca este producto** en el sistema de diseño (`ic-b1`,
            `ticket-tear-off`, `socks`…). Siempre presente: si el producto no ha elegido, el dominio
            resuelve el que le toca por su tipo.

            ⚠️⚠️ **Se publica para que el cliente NO lo derive de `is_pack`**, que es lo que hacía —y
            con la geometría del dibujo copiada dentro, en dos componentes distintos—. Con esa regla
            un catálogo entero se reparte en DOS dibujos: la tirolina, la tarta y los calcetines son
            «no-pack», así que los tres salen como un ticket (`DECISIONES #140`).

            ⚠️ Es una CLAVE de un set curado, no una URL ni un SVG: el cliente la mapea a su propio
            dibujo. Así cada instalación puede llevar su set sin que el contrato cambie, y la paridad
            de dibujos entre superficies sigue siendo comprobable.
        can_add_extras:
          type: boolean
          description: |
            **Si esta reserva admite EXTRAS ahora mismo** en su post-form: complementos de venta
            posterior (`stage: postform`) con configuración sana y **dentro de su plazo**
            (`specs/complementos-post-reserva.md` §4.6).

            ⚠️ Se publica para que el cliente pueda NOMBRARLOS donde invita a abrir el formulario. El
            rótulo de ese botón decía «Ver o editar el formulario de reserva», que no insinúa que ahí
            se compre — y el aviso de formulario pendiente **muere en cuanto las fichas están
            completas**, que es justo cuando quedan extras por elegir. Medido: sin este dato, la
            feature puede construirse entera y no venderse un solo cubo de refrescos.

            ⚠️⚠️ **No es «el catálogo tiene extras»**: es «este cliente todavía podría añadir algo».
            `false` cuando la fiesta ya pasó, cuando el pedido no está pagado, cuando todos los
            plazos vencieron y en la instalación que no configura ninguno — que es el caso por
            defecto.
    OrderItemAddon:
      type: object
      description: |
        Complemento contratado dentro de una línea. Deliberadamente con menos campos: no tiene
        franja ni post-form propios —los hereda del padre— y repetirlos invitaría a leerlos del
        sitio equivocado.
      required: [id, product_name, quantity, charged_subtotal_cents, free_quantity, quantity_label]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        product_name:
          type: string
        quantity:
          type: integer
        charged_subtotal_cents:
          type: integer
        free_quantity:
          type: integer
          description: |
            Unidades que van INCLUIDAS sin cargo. Sin este número, «2 incluidas + 1 extra» y «3 de
            pago» se pintan igual, y el importe cobrado no basta para distinguirlas cuando el extra
            vale 0.
        quantity_label:
          type: string
          description: |
            La cantidad ya compuesta con su nombre («2 unidades»), por lo mismo que en la línea
            principal (`OrderItem.quantity_label`): el complemento sufría el MISMO defecto `L2`
            —`· 2×` pegado al importe de la línea—, y arreglar solo el principal habría dejado la
            ambigüedad viva una fila más abajo.

    OrderGuestMinors:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [reservations]
          properties:
            reservations:
              type: array
              description: |
                Una entrada **por RESERVA**, en el orden de la compra: las que se compraron marcadas
                más las que ya tienen justificantes firmados.

                ⚠️ Devolvía UNA cosa por pedido hasta que el justificante pasó a colgar de la visita.
                Un pedido con una excursión el lunes y una entrada el miércoles tiene **dos** enlaces,
                dos cupos y dos listas: un padre autoriza que su hijo entre a UNA visita.
              items:
                type: object
                additionalProperties: false
                required: [reservation_id, product_name, date, minors, places, link]
                properties:
                  reservation_id:
                    type: integer
                    format: int64
                    description: La línea del pedido a la que pertenece este justificante.
                  product_name:
                    type: string
                    description: A qué va el menor, con la etiqueta de fiesta mixta si la lleva.
                  date:
                    type: string
                    format: date
                    nullable: true
                    description: Día de la visita, o `null` si la reserva aún no tiene franja.
                  minors:
                    type: array
                    description: Los menores invitados con justificante firmado, en el orden en que se firmaron.
                    items:
                      type: object
                      additionalProperties: false
                      required: [minor, waiver]
                      properties:
                        minor:
                          type: string
                          description: Nombre y apellidos del menor, tal y como los declaró quien firmó.
                        waiver:
                          type: string
                          nullable: true
                          enum: [current, outdated, missing]
                          description: |
                            Estado del justificante. `null` cuando la instalación no gestiona el
                            waiver aquí. `outdated` significa que se firmó una versión anterior del
                            texto: se señala y se deja pasar.
                  places:
                    type: integer
                    description: |
                      Plazas de ESTA reserva que todavía pueden recibir un menor invitado: su
                      cantidad menos los menores a cargo ya asignados y los justificantes ya firmados.

                      ⚠️ **No es un denominador inventado.** No se puede saber cuántos de los
                      comprados son menores —por eso no se dice «3 de 100»—, pero una plaza asignada
                      a un menor a cargo **ya tiene dueño**, y eso es un hecho.
                  link:
                    type: string
                    nullable: true
                    format: uri
                    description: |
                      Enlace firmado de ESTA reserva, para repartir a los padres. `null` si el pedido
                      no está pagado, si la visita ya pasó **o si no quedan plazas libres**: en los
                      tres casos repartirlo sería mandar a un padre a una pantalla que le dirá que no.
                      ⚠️ Es una credencial portadora: quien lo tenga puede firmar.

    OrderEventData:
      type: object
      description: |
        Lo que se contestó al reservar, por reserva del pedido. ⚠️ Contiene datos personales de
        menores (art. 9); la respuesta va con `no-store`. Se pide aparte del pedido justamente para
        que listarlo no los arrastre.
      required: [order_code, reservations]
      additionalProperties: false
      properties:
        order_code:
          type: string
        reservations:
          type: array
          description: |
            Una entrada por línea de PRODUCTO del pedido, incluidas las que no tienen respuestas.
            Los complementos no aparecen: no tienen datos de evento propios.
          items:
            $ref: '#/components/schemas/OrderEventDataReservation'

    OrderEventDataReservation:
      type: object
      required: [reservation_id, answers, dependents]
      additionalProperties: false
      properties:
        reservation_id:
          type: integer
          format: int64
          description: |
            El `id` de la línea en `GET orders/{code}`. Es la única llave: aquí no se repite nada de
            lo que aquel ya publica.
        answers:
          type: array
          description: |
            En el orden del esquema del pack. Vacío si la reserva no es de un pack, si el pack no
            pide datos al reservar, o si no se contestó nada.
          items:
            $ref: '#/components/schemas/EventAnswer'
        dependents:
          type: array
          description: |
            Los menores a cargo para los que es esta entrada (Fase 6 · menores a cargo, tanda 4), en
            el orden en que se asignaron; vacío si ninguna unidad es para un menor o si la reserva es
            un pack. Sale por AQUÍ y no por `OrderItem` por la misma razón que las respuestas del
            pack: es el nombre de un menor y no debe viajar en cada página del historial. Nunca más
            entradas que unidades tenga hoy la línea. La edad y el estado de su exención se leen en
            `GET /me/dependents`.
          items:
            $ref: '#/components/schemas/AssignedDependent'

    AssignedDependent:
      type: object
      description: Un menor a cargo al que se asignó una entrada — solo lo que identifica al titular su etiqueta.
      required: [id, name]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          description: El `id` de `GET /me/dependents`. Puede ser el de un menor ya retirado de la cuenta.
        name:
          type: string
          description: La etiqueta que el titular le puso («el nombre que use en casa»).

    EventAnswer:
      type: object
      description: Una respuesta del cliente con la etiqueta de su campo.
      required: [key, label, value]
      additionalProperties: false
      properties:
        key:
          type: string
          description: |
            Clave estable del campo, tal como la configuró la instalación. Es lo que permite dar a
            una respuesta un tratamiento propio sin emparejar por la etiqueta, que es traducible.
        label:
          type: string
          description: Etiqueta ya resuelta al idioma negociado (los textos viven en la base de datos).
        value:
          type: string

    OfferedDateList:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OfferedDate'
        meta:
          $ref: '#/components/schemas/ListMeta'

    OfferedDate:
      type: object
      description: Un día con franjas reservables, y lo que cuesta el producto ese día.
      required: [date, price_cents, rate_key]
      additionalProperties: false
      properties:
        date:
          type: string
          format: date
        price_cents:
          type: integer
          nullable: true
          description: |
            Precio unitario de ese día. **`null` = el producto no tiene precio para la tarifa que le
            aplica**: el día se ofrece porque tiene franjas, pero el checkout rechazará la línea.
            Distinto de un `0`, que es un producto gratuito intencionado.
        rate_key:
          type: string
          description: |
            Clave de configuración de la tarifa aplicada (`normal`, `special`…). No es una etiqueta
            traducible: sirve para marcar los días de tarifa especial sin deducirlos del precio.

    OfferedTimeList:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OfferedTime'
        meta:
          $ref: '#/components/schemas/ListMeta'

    OfferedTime:
      type: object
      description: Una hora de entrada reservable, con el cupo ya descontada la cesta enviada.
      required: [time, available, max_quantity, sellable]
      additionalProperties: false
      properties:
        time:
          type: string
          description: Hora de inicio de la franja, en formato `HH:MM:SS`.
        available:
          type: integer
          description: |
            Plazas —o invitados— que le quedan a la franja. Es para MOSTRAR («quedan N»), no para
            acotar el selector de cantidad.
        max_quantity:
          type: integer
          description: |
            Máximo contratable en esta franja. En una entrada coincide con `available`; en un pack
            está topado además por el máximo de invitados del propio pack, así que puede ser MENOR.
            **Este es el número que acota un selector de cantidad.**
        sellable:
          type: boolean
          description: |
            `false` = la hora existe pero está completa. Se lista igualmente para que el cliente vea
            que esa hora existe, en vez de que desaparezca sin explicación. Un pack por debajo de su
            mínimo de invitados no llega a listarse: no es reservable de ninguna forma.

    AvailabilityTimesRequest:
      type: object
      required: [date]
      additionalProperties: false
      properties:
        date:
          type: string
          format: date
          description: Día que se consulta.
        items:
          type: array
          maxItems: 50
          description: |
            La cesta actual del cliente. **Opcional**: ausente equivale a vacía. Solo sirve para
            descontar el cupo que uno mismo ya retiene, así que la línea que se está configurando no
            debe ir aquí.
          items:
            $ref: '#/components/schemas/CartLine'

    GuestForm:
      type: object
      description: |
        El formulario de invitados de una reserva: su esquema, lo ya rellenado y a dónde guardarlo.
        ⚠️ Contiene datos personales de menores; la respuesta va con `no-store`.
      required:
        - reservation_id
        - order_code
        - product_name
        - date
        - time_window
        - guest_count
        - status
        - progress
        - readonly
        - guest_fields
        - general_fields
        - guests
        - general
        - save_url
        - addons
        - version
        - guest_count_editable
        - guest_count_min
        - guest_count_max
        - guest_count_locked_reason
        - guest_count_deadline
        - invitation
      additionalProperties: false
      properties:
        reservation_id:
          type: integer
          format: int64
        order_code:
          type: string
        product_name:
          type: string
        date:
          type: string
          format: date
          nullable: true
        time_window:
          type: string
          nullable: true
        guest_count:
          type: integer
          description: |
            Cuántas fichas hay que rellenar. Es la cantidad ACTUAL de invitados de la reserva: si el
            operador la sube, aparecen fichas nuevas vacías y el estado vuelve solo a `pending`.
        status:
          type: string
          enum: [ok, pending, null]
          nullable: true
          description: |
            `null` = esta reserva no pide datos por invitado. `pending` también con todas las fichas
            rellenas si alguna edad declarada no tiene producto en las condiciones de la reserva
            (`specs/cumple-mixto.md` §22): esa ficha no cuenta en `progress` hasta que el parque lo
            resuelva con el titular.
        progress:
          type: object
          description: Fichas completas sobre el total, para el indicador «X/N».
          required: [done, total]
          additionalProperties: false
          properties:
            done:
              type: integer
            total:
              type: integer
        readonly:
          type: boolean
          description: |
            `true` cuando la fiesta ya se ha celebrado: se consulta pero guardar devuelve 409.
        guest_fields:
          type: array
          description: Columnas POR INVITADO, configuradas por la instalación.
          items:
            $ref: '#/components/schemas/GuestFormField'
        general_fields:
          type: array
          description: Campos generales del formulario (no por invitado).
          items:
            $ref: '#/components/schemas/GuestFormField'
        guests:
          type: array
          description: |
            Respuestas por invitado, en el mismo orden que las fichas. Cada elemento es un mapa
            `clave de campo → valor`; las claves son las de `guest_fields`.
          items:
            type: object
            additionalProperties:
              type: string
        general:
          type: object
          additionalProperties:
            type: string
          description: Respuestas de los campos generales, por su clave.
        save_url:
          type: string
          description: |
            **El canje**: la URL de guardar, ya firmada y con la misma caducidad que el enlace del
            correo. Quien entra con una firma no puede construírsela, así que recibirla aquí es lo
            que le permite completar el formulario sin tener cuenta.
        addons:
          type: array
          description: |
            Los EXTRAS que se pueden añadir después de reservar (cubo de refrescos, tapas…), con lo
            que el cliente ya tiene de cada uno. Lista **vacía** cuando la instalación no ha
            configurado ninguno, que es el caso por defecto.

            Se pagan **en el parque**: añadir uno sube el Total del pedido y su saldo, y no se cobra
            nada online (`DECISIONES #244`).
          items:
            $ref: '#/components/schemas/PostFormAddon'
        version:
          type: string
          description: |
            El TESTIGO de la reserva en el momento de leerla. Hay que devolverlo en `expected_version`
            al guardar: si el parque movió algo entre medias, el servidor responde 409 en vez de
            dejar que un envío con la pantalla vieja pise su trabajo.

        guest_count_editable:
          type: boolean
          description: |
            Si el titular puede cambiar ahora mismo cuántos invitados tiene su reserva
            (`DECISIONES #444`). `false` no es «no existe»: viene con `guest_count_locked_reason`,
            porque un control que desaparece sin explicación deja al cliente sin saber qué hacer.
        guest_count_min:
          type: integer
          description: |
            El suelo EFECTIVO, que son **dos preguntas resueltas en una**: el mínimo contratable del
            pack y las plazas que ya tienen dueño (menores a cargo asignados + justificantes
            firmados). Viaja resuelto para que ningún cliente recomponga la regla.
        guest_count_max:
          type: integer
          nullable: true
          description: El máximo del producto. `null` = solo lo limita el aforo de la sala.
        guest_count_locked_reason:
          type: string
          nullable: true
          enum: [closed, cutoff, null]
          description: |
            Por qué no se puede cambiar: `cutoff` (pasó el plazo) o `closed` (la reserva ya no
            admite cambios). `null` cuando sí se puede.
        guest_count_deadline:
          type: string
          format: date-time
          nullable: true
          description: |
            El instante EXACTO del corte, en la zona del parque. Se mide contra la hora de PARED de
            la franja, no contra el fin de la visita: son preguntas distintas.
        invitation:
          type: object
          nullable: true
          description: |
            La invitación digital de esta reserva, si su producto la ofrece. `null` cuando no la
            ofrece — que es el caso de casi todos los productos.

            ⚠️ **Nace al pedir este formulario**, no antes: compartir por Web Share necesita el
            enlace **en el mismo gesto** del usuario y un `fetch` previo pierde la activación en
            Safari.

            ⚠️⚠️ **Va escrito INLINE y es una COPIA VIGILADA de `Invitation`, no un `$ref`.** En
            OpenAPI 3.0 un `$ref` no admite `nullable` a su lado, y la forma canónica —`allOf: [$ref]`
            con `nullable: true`— **no funciona con el validador**: medido aquí el 2026-09-18, con
            ella una reserva CON invitación falla con «The data (object) must match the type: null».
            Es el mismo hallazgo de `DECISIONES #27`, que `AccountContext.next_reservation` y
            `extras_invite` ya pagaron, y se resuelve igual. Que las dos definiciones no diverjan lo
            vigila `ApiContractTest`.
          required: [url, token, theme, honoree_name, honoree_age, host_line, show_host_phone, shareable, replies_yes, replies_no, replies_pending, pending_replies]
          additionalProperties: false
          properties:
            url:
              type: string
              format: uri
              nullable: true
            token:
              type: string
              minLength: 12
              maxLength: 12
            theme:
              type: string
            honoree_name:
              type: string
              maxLength: 60
            honoree_age:
              type: integer
              nullable: true
              minimum: 0
              maximum: 255
            host_line:
              type: string
              maxLength: 80
            show_host_phone:
              type: boolean
            shareable:
              type: boolean
            replies_yes:
              type: integer
            replies_no:
              type: integer
            replies_pending:
              type: integer
            pending_replies:
              type: array
              items:
                $ref: '#/components/schemas/InvitationPendingReply'

    GuestFormField:
      type: object
      description: Una columna del formulario, tal y como la configuró la instalación.
      required: [key, label, type, required]
      additionalProperties: false
      properties:
        key:
          type: string
        label:
          type: string
          description: Etiqueta ya resuelta al idioma negociado (los textos viven en la base de datos).
        type:
          type: string
          description: Pista de presentación del campo (`text`, `textarea`, `number`…).
        required:
          type: boolean

    GuestFormRequest:
      type: object
      description: |
        El envío SUSTITUYE la lista entera de invitados. Todo se sanea en servidor contra el esquema
        del pack: lo que no esté en `guest_fields` se descarta.

        **La AUSENCIA de una clave significa «no la toques»; mandarla vacía significa «vacíala».**
        Las dos propiedades son opcionales precisamente para eso: se puede guardar solo las fichas,
        o solo las observaciones generales, sin reenviar lo que no se está tocando.

        ⚠️ Hasta 2026-09-03 el servidor convertía la ausencia en «vacía», así que un `PUT` que solo
        mandara `general` **borraba las fichas de todos los invitados** y respondía 200. Un cliente
        que guarde por partes debe omitir la clave, nunca mandarla vacía.
      additionalProperties: false
      properties:
        guests:
          type: array
          maxItems: 200
          description: |
            Una ficha por invitado, con sus respuestas por clave de campo. Ausente = se conservan
            las que ya hay; `[]` = se vacían todas.
          items:
            type: object
            additionalProperties:
              type: string
        general:
          type: object
          additionalProperties:
            type: string
          description: |
            Respuestas de los campos generales. Ausente = se conservan; `{}` = se vacían.
        addons:
          type: array
          description: |
            El estado DESEADO de los extras de venta posterior: cuántas unidades quieres de cada uno.
            Una cantidad `0` significa «este ya no lo quiero». **Ausente = no se toca ninguno**, con
            la misma regla que las otras dos claves.

            ⚠️ Solo gobierna los complementos **ofrecidos y dentro de su plazo**: lo que esté fuera de
            plazo se conserva aunque no venga en el cuerpo — que es lo que hace inofensivo un envío
            hecho con esos campos deshabilitados en la pantalla.
          items:
            $ref: '#/components/schemas/AddonQuantity'
        expected_version:
          type: string
          description: |
            El `version` que traía el `GET`. Si el parque movió la reserva entre medias, el servidor
            responde **409 `guest_form_stale`** y no escribe nada, en vez de dejar que un envío hecho
            con la pantalla vieja pise el trabajo del operador.
        guest_count:
          type: integer
          minimum: 1
          maximum: 200
          description: |
            Cuántos invitados quieres que tenga la reserva (`DECISIONES #444`). **Ausente = no se
            toca**, con la misma regla que las otras claves — y aquí importa el doble: un `?? ` la
            convertiría en un cambio que nadie pidió.

            ⚠️ Aquí solo se valida la FORMA. El techo, los **dos** suelos (el mínimo del pack y lo
            que ya tiene dueño), el plazo y el AFORO los decide el servidor **bajo el lock de la
            zona y el día**, con la misma receta que la compra: es la primera puerta por la que el
            cliente mueve aforo.

            ▶ **Un cambio rechazado NO tumba el guardado del resto**: las fichas y los extras se
            guardan igual. La respuesta trae el estado nuevo, así que `guest_count` de la reserva
            dice si se aplicó.
        adopt:
          type: array
          maxItems: 200
          description: |
            Ids de las respuestas de la invitación que el anfitrión ADOPTA con este guardado: dejan
            de proponerse y pasan a ser fichas suyas.

            ⚠️⚠️ **Va FUERA de `guests`, y eso no es estética.** Cada fila de `guests` es un mapa
            ABIERTO de respuestas por clave de campo, y esas claves las inventa cada instalación
            desde su panel: una marca metida dentro de la fila chocaría el día que alguien llamara a
            una columna igual. Fuera no puede chocar con nada.

            ⚠️ Ausente = no se adopta ninguna, con la misma regla que las otras claves. Un id que ya
            no esté pendiente, o que sea de otra reserva, **se ignora en silencio**: es el estado
            normal cuando dos pestañas guardan, no un error que deba tumbar el envío.
          items:
            type: integer
            format: int64
            minimum: 1

    # ─── La INVITACIÓN DIGITAL (`specs/celebracion-e-invitacion.md` §4.10, `DECISIONES #574`) ───
    # Los nombres y las formas se fijan AQUÍ antes de escribir una sola línea de código de API, que
    # es lo que impide que el contrato acabe siendo un calco de lo que hizo la web. Sus endpoints
    # llegan en la T4·6; estos esquemas son lo que van a hablar.
    Invitation:
      type: object
      description: |
        La invitación de una reserva **vista por su ANFITRIÓN**: el enlace para compartir, cómo la ha
        personalizado y el resumen de lo que han contestado los padres.

        ⚠️ No la confundas con `InvitationCard`, que es lo que ve un desconocido: **aquélla no lleva
        ni una respuesta**, y ésta sí. Son dos objetos distintos a propósito y no dos vistas del
        mismo, porque el día que alguien añada un campo aquí no puede filtrarse allí por descuido.
      required: [url, token, theme, honoree_name, honoree_age, host_line, show_host_phone, shareable, replies_yes, replies_no, replies_pending, pending_replies]
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          nullable: true
          description: |
            El enlace que el anfitrión reparte. Cambia si el operador lo anula.

            ⚠️ **`null` mientras la página pública no exista** (llega en la T5). No se clava el path
            a mano para «ir teniendo algo»: el enlace se compone preguntando por el NOMBRE de esa
            ruta, así que aparece **solo** en cuanto nazca. Un cliente que lo reciba `null` no debe
            ofrecer «compartir»; el `token` sí va desde el primer día.
        token:
          type: string
          minLength: 12
          maxLength: 12
          description: Doce caracteres base62 (~71 bits), opacos — no llevan ni el nombre ni la edad de nadie.
        theme:
          type: string
        honoree_name:
          type: string
          maxLength: 60
        honoree_age:
          type: integer
          nullable: true
          minimum: 0
          maximum: 255
        host_line:
          type: string
          maxLength: 80
        show_host_phone:
          type: boolean
          description: El teléfono sale del de la CUENTA; esto solo dice si se enseña.
        shareable:
          type: boolean
          description: |
            ⚠️ Sigue siendo `true` **pasado el plazo de respuestas**: la información de la fiesta hace
            falta justo el día de la fiesta. Lo que el plazo cierra son las respuestas, no el enlace.
        replies_yes:
          type: integer
        replies_no:
          type: integer
        replies_pending:
          type: integer
          description: Cuántas respuestas le quedan al anfitrión por repasar.
        pending_replies:
          type: array
          description: |
            Las respuestas por repasar, cada «sí» con la ficha sobre la que se propone.

            ⚠️ De un niño repetido sale **solo su respuesta más reciente**: dos respuestas con el
            mismo nombre son el mismo niño, y proponer las dos le pediría al anfitrión que eligiera
            entre una cosa y ella misma.
          items:
            $ref: '#/components/schemas/InvitationPendingReply'
    InvitationPendingReply:
      type: object
      description: |
        Una respuesta que el anfitrión todavía no ha repasado, y **dónde iría** si la adopta.
      required: [id, child_name, attending, companion, guest_data, slot_index, repeated]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          description: Lo que se manda en `adopt[]` al guardar el formulario.
        child_name:
          type: string
        attending:
          type: boolean
        companion:
          type: string
          enum: [with_adult, alone, unknown, null]
          nullable: true
        guest_data:
          type: object
          additionalProperties:
            type: string
          description: Lo que el padre dejó, ya saneado contra el esquema del pack.
        slot_index:
          type: integer
          nullable: true
          minimum: 0
          description: |
            La POSICIÓN de la ficha propuesta, empezando en 0. La calcula el servidor para que la web
            y la app no repitan la regla de emparejado.

            ⚠️⚠️ **`null` no es un error**: un «no» no se pinta sobre ninguna ficha, y un «sí» lo
            lleva a `null` cuando **ya no cabe** — entre que el anfitrión pintó y guardó entraron más
            «sí». Eso es lo que se enseña como «hay respuestas que ya no caben».
        repeated:
          type: boolean
          description: |
            Hay más de una respuesta de este niño. Lo ve **el anfitrión**, nunca quien contesta: al
            padre se le da el mismo desenlace que la primera vez.
    InvitationPersonalizeRequest:
      type: object
      description: |
        Cómo el anfitrión personaliza su invitación. **Se envía entera**, como el resto del
        formulario: es un `PUT`, no un parcheo campo a campo.

        ⚠️ `honoree_name` y `host_line` se publican bajo el dominio del parque, así que **se rechaza**
        —no se limpia— un valor con enlaces o direcciones de correo: una invitación no puede decir
        «paga el regalo en este enlace». El valor anterior se queda como estaba.
      required: [theme, honoree_name, honoree_age, host_line, show_host_phone]
      additionalProperties: false
      properties:
        theme:
          type: string
          description: |
            Lista CERRADA. Un valor que no esté en ella cae al de por defecto en vez de dar 422: un
            tema desconocido no rompe nada, y el cliente puede ir por delante de la instalación.
        honoree_name:
          type: string
          maxLength: 60
        honoree_age:
          type: integer
          nullable: true
          minimum: 0
          maximum: 255
        host_line:
          type: string
          maxLength: 80
        show_host_phone:
          type: boolean
          description: El teléfono sale del de la CUENTA; esto solo dice si se enseña.
    InvitationCard:
      type: object
      description: |
        La invitación **vista por un desconocido** que abre el enlace, y por eso es una HOJA EN
        BLANCO: ni una respuesta, ni cuántos han contestado, **ni si un nombre concreto ya contestó**.
        Ése es el motivo por el que su enlace se puede repartir a un grupo de clase entero.
      required: [theme, honoree_name, honoree_age, host_line, host_phone, date, time_window, product_name, replies_open]
      additionalProperties: false
      properties:
        theme:
          type: string
        honoree_name:
          type: string
        honoree_age:
          type: integer
          nullable: true
        host_line:
          type: string
        host_phone:
          type: string
          nullable: true
          description: Solo si el anfitrión lo marcó. Sale de su cuenta y nunca se teclea aquí.
        date:
          type: string
          format: date
        time_window:
          type: string
          description: |
            ⚠️ El fin sale de la duración EFECTIVA de la reserva (base + horas extra), nunca del fin
            de la franja: la rejilla es de 60 min y una fiesta de dos horas diría una hora de menos.
        product_name:
          type: string
        replies_open:
          type: boolean
          description: Si ya pasó el plazo, la tarjeta se sigue viendo pero no admite respuestas.
    InvitationReplyRequest:
      type: object
      description: Lo que manda un padre. Solo el nombre y el gesto son obligatorios.
      required: [child_name, attending]
      additionalProperties: false
      properties:
        child_name:
          type: string
          minLength: 1
          maxLength: 120
          description: Nombre y apellidos, que es lo que distingue a dos niños que se llaman igual.
        attending:
          type: boolean
        companion:
          type: string
          enum: [with_adult, alone, unknown, null]
          nullable: true
        guest_data:
          type: object
          nullable: true
          additionalProperties:
            type: string
          description: |
            Las columnas del pack que quiera dejar (alergias, menú…), todas opcionales. Se sanean con
            el mismo saneo del formulario del anfitrión: una clave que el esquema no declare se cae.
    InvitationReplyResult:
      type: object
      description: |
        El desenlace de contestar.

        ⚠️⚠️ **Lo que un padre puede saber por él está ACOTADO a propósito.** Un nombre repetido NO
        tiene motivo propio: devuelve `accepted: true`, exactamente igual que la primera vez. Decirle
        «ya nos habéis contestado por Hugo» le confirmaría a cualquiera con el enlace quién va a esa
        fiesta, y bastaba con probar nombres. La hoja es en blanco también en sus errores.

        ❗❗ **Y por lo mismo NO existe un motivo `full`.** Rechazar por lista completa abría el mismo
        oráculo por otra puerta: el nombre que emparejaba con una ficha ya escrita se aceptaba y el
        nuevo recibía «full», así que se podía **reconstruir la lista probando nombres**. Desde
        `DECISIONES #700` el «sí» se acepta siempre y el que no cabe sale en el aviso del anfitrión.
      required: [accepted, reason]
      additionalProperties: false
      properties:
        accepted:
          type: boolean
        reason:
          type: string
          enum: [closed, cutoff, no_name, too_many, null]
          nullable: true
          description: |
            ⚠️⚠️ **Los cuatro motivos tienen algo en común, y es lo que los hace seguros: ninguno
            depende del NOMBRE que traiga la respuesta.** Cerrada, fuera de plazo, sin nombre o
            demasiadas contestan igual a todo el mundo, así que no sirven para preguntarle nada a la
            lista. Los dos que sí dependían del nombre —«repetido» y `full`— no existen, y su
            ausencia es la propiedad, no un olvido.
    PaymentStatus:
      type: object
      description: El desenlace del pago de un pedido, en su forma mínima para sondear.
      required:
        - order_code
        - order_status
        - payment_status
        - can_be_retried
        - declined_reason
        - declined_message
        - expires_at
      additionalProperties: false
      properties:
        order_code:
          type: string
        order_status:
          type: string
          enum: [pending, paid, cancelled, expired, refunded]
          description: |
            Estado EFECTIVO de la reserva: un pedido cuyo hold ya venció sale `expired` aunque el
            barrido periódico no haya pasado todavía.
        payment_status:
          type: string
          enum: [none, pending, authorized, paid, failed, superseded]
          description: |
            En qué ha quedado el ÚLTIMO intento de cobro. `none` = todavía no se ha abierto ninguno.
            `superseded` = ese intento quedó sustituido por otro posterior. Un pedido pagado responde
            `paid` aunque después se abriera otro intento: manda el cobro que triunfó.
        can_be_retried:
          type: boolean
          description: |
            Lo decide el servidor, no el cliente: es la misma respuesta que va a honrar
            `POST orders/{code}/payment`.
        declined_reason:
          type: string
          # `null` va DENTRO del enum además de `nullable`: en OpenAPI 3.0 un enum sin él rechaza el
          # nulo aunque el campo se declare anulable (lo destapó el test de contrato en el paso 1a).
          enum:
            - card_expired
            - card_invalid
            - cvv_wrong
            - card_unsupported
            - fraud_suspicion
            - pin_attempts_exceeded
            - auth_failed
            - bank_denied
            - user_cancelled
            - system_error
            - default
            - null
          nullable: true
          description: |
            **Código** del motivo del rechazo, para PROGRAMAR la respuesta. `null` salvo que el
            último intento sea el rechazado — enseñar el motivo de un rechazo anterior mientras hay
            otro cobro en curso diría que la tarjeta ha fallado cuando está esperando respuesta.
        declined_message:
          type: string
          nullable: true
          description: El mismo motivo en texto, ya traducido, para MOSTRAR.
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Hasta cuándo se retiene la plaza. Es el margen que queda para reintentar.

    OrderPayment:
      type: object
      description: |
        Un pedido y el formulario firmado para pagarlo. Es la respuesta de crear la reserva y la de
        reintentar su cobro: las dos devuelven lo mismo, y en el reintento eso incluye el pedido con
        su retención ya extendida.
      required: [order, payment]
      additionalProperties: false
      properties:
        order:
          $ref: '#/components/schemas/Order'
        payment:
          $ref: '#/components/schemas/PaymentTicket'

    PaymentTicket:
      type: object
      description: |
        Lo necesario para mandar al cliente a la pasarela. **La tarjeta nunca toca este servidor.**
      required: [provider, method, url, fields]
      additionalProperties: false
      properties:
        provider:
          type: string
          description: Pasarela que ha abierto el cobro (hoy siempre `redsys`).
        method:
          type: string
          description: Verbo con el que enviar el formulario.
        url:
          type: string
          description: Dónde enviarlo.
        fields:
          type: object
          additionalProperties:
            type: string
          description: |
            Campos del formulario, con sus nombres. **Se reenvían TAL CUAL y sin tocarlos**: van
            firmados y modificar uno solo hace que la pasarela rechace el cobro. El contrato no los
            enumera a propósito — es lo que permite cambiar de proveedor sin romper a ningún cliente.

    Quote:
      type: object
      description: |
        Una cesta tarificada por el servidor.

        `total_cents` y `online_amount_cents` son cosas distintas y **ninguna se deriva de la otra**:
        el primero es lo que vale la reserva y el segundo lo que la pasarela cobra ahora. Con
        productos de señal difieren, y la diferencia es lo que se paga presencialmente.
      required: [lines, total_cents, online_amount_cents]
      additionalProperties: false
      properties:
        lines:
          type: array
          description: Una por línea VENDIBLE de la cesta enviada, en su orden.
          items:
            $ref: '#/components/schemas/QuoteLine'
        total_cents:
          type: integer
          description: 'Valor total de la cesta: principales + complementos cobrados.'
        online_amount_cents:
          type: integer
          description: |
            Lo que se cobra ONLINE. Sin señal coincide con `total_cents`. No es «lo pendiente»: no
            baja a cero al pagarse.

    QuoteLine:
      type: object
      description: Una línea de la cesta con su precio resuelto. Sus complementos van anidados.
      required:
        - index
        - product_id
        - product_name
        - is_pack
        - date
        - time
        - quantity
        - unit_price_cents
        - subtotal_cents
        - has_deposit
        - deposit_cents
        - gate_remainder_cents
        - addons
        - icon
      additionalProperties: false
      properties:
        index:
          type: integer
          description: |
            Posición de la línea en la cesta que se envió (base 0). Una línea cuyo producto ya no se
            vende no se tarifica, así que la secuencia puede tener huecos: ese hueco es la señal.
        product_id:
          type: integer
          format: int64
        product_name:
          type: string
        is_pack:
          type: boolean
          description: En un pack, `quantity` cuenta INVITADOS; en una entrada, unidades.
        date:
          type: string
          format: date
        time:
          type: string
          description: Hora de inicio de la franja, en formato `HH:MM:SS`.
        quantity:
          type: integer
        unit_price_cents:
          type: integer
          nullable: true
          description: |
            Precio del día según la tarifa que aplique a `date`. **`null` = el producto no tiene
            precio para esa tarifa**, así que no se puede comprar ese día y `subtotal_cents` es 0.
            Es distinto de un `0`, que sí es un producto gratuito intencionado.
        subtotal_cents:
          type: integer
          description: '`quantity × unit_price_cents` del PRINCIPAL, sin complementos.'
        has_deposit:
          type: boolean
          description: ¿Esta línea cobra solo señal y deja un resto para el parque?
        deposit_cents:
          type: integer
          description: Parte del principal que se cobra online. Sin señal, el subtotal entero.
        gate_remainder_cents:
          type: integer
          description: |
            Lo que queda por cobrar presencialmente de esta línea: el resto del principal más sus
            complementos íntegros. Cero si la línea no cobra señal.
        addons:
          type: array
          items:
            $ref: '#/components/schemas/QuoteLineAddon'
        icon:
          type: string
          description: |
            **Clave del icono que marca el producto** en el sistema de diseño. Siempre presente: si
            el producto no ha elegido, el dominio resuelve el que le toca por su tipo.

            ⚠️⚠️ Se publica para que el cliente **no lo derive de `is_pack`**, que es lo que hacía —y
            con la geometría copiada dentro, en dos componentes—: con esa regla la tirolina, la tarta
            y los calcetines son los tres «un ticket» (`DECISIONES #140`).

    QuoteLineAddon:
      type: object
      description: |
        Complemento tal y como el servidor lo ha RESUELTO, que no es siempre lo que se pidió: los
        obligatorios se inyectan, cada grupo excluyente toma su opción por defecto y los
        per-invitado ajustan su cantidad a la línea.
      required: [product_id, product_name, quantity, free_quantity, subtotal_cents]
      additionalProperties: false
      properties:
        product_id:
          type: integer
          format: int64
        product_name:
          type: string
        quantity:
          type: integer
          description: Cantidad efectiva tras aplicar la configuración del complemento.
        free_quantity:
          type: integer
          description: Unidades incluidas (gratis) de esas `quantity`.
        subtotal_cents:
          type: integer
          description: '`(quantity − free_quantity) × precio unitario`.'

    CartRequest:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          description: |
            Las líneas de la cesta. El tope espeja el invariante de servidor del checkout: una cesta
            desmedida bloquearía muchas franjas a la vez al comprarla.
          items:
            $ref: '#/components/schemas/CartLine'

    CreateOrderRequest:
      type: object
      description: |
        La cesta **más lo que el COMPRADOR debe** antes de contratar (`#349`).

        ⚠️⚠️ **Es un esquema propio y NO `CartRequest` con dos campos más**, y la repetición de `items`
        es deliberada: `CartRequest` lo comparte el **presupuesto**, y añadirle estos dos campos
        obligaría a aceptar las condiciones para ver un precio. Es la lección de `#329` con el
        `EmailRequest` compartido. (`allOf` tampoco valdría: con `additionalProperties: false` cada
        subesquema valida por su cuenta y los campos nuevos fallarían contra `CartRequest`.)

        **Los dos campos se envían SOLO cuando hacen falta**, y quién lo decide es el servidor:
        `GET /me/account-context` publica `terms_pending`, y la cuenta sabe si tiene teléfono. Un
        cliente que no los mande cuando hacían falta recibe **422 por campo**, que es la forma
        correcta de enterarse — la pista puede equivocarse, el 422 no.
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          description: |
            Las líneas de la cesta. El tope espeja el invariante de servidor del checkout: una cesta
            desmedida bloquearía muchas franjas a la vez al comprarla.
          items:
            $ref: '#/components/schemas/CartLine'
        accept_terms:
          type: boolean
          description: |
            La aceptación de las **condiciones** en su versión vigente, en el momento del contrato.

            Obligatorio (y tiene que ser `true`) cuando `account-context.terms_pending` lo es: esta
            instalación publica condiciones y este titular no tiene aceptada la versión en vigor. Al
            aceptarlas se escribe un consentimiento con la **versión, la fecha y la IP**, que es la
            prueba de qué texto exacto rigió la compra (LCGC art. 5).
        phone:
          type: string
          maxLength: 32
          description: |
            El teléfono, **solo si la cuenta no lo tiene**. Se pide aquí porque es donde hace falta —
            gestionar la reserva— y porque al crear la cuenta no siempre está: ni el alta con Google
            ni la de mostrador lo preguntan. A quien ya lo dio no se le vuelve a preguntar.

    CartLineCheckRequest:
      type: object
      description: |
        Una línea candidata y la cesta que el cliente **ya tiene**. La candidata NO va dentro de
        `items`: `items` es lo que ya retiene cupo, y meterla ahí la haría competir consigo misma
        por las plazas, devolviendo un cupo menor del real.
      required: [line]
      additionalProperties: false
      properties:
        line:
          $ref: '#/components/schemas/CartLine'
        items:
          type: array
          maxItems: 50
          description: |
            La cesta actual. Se puede omitir: la primera línea de una compra se añade sobre una
            cesta vacía.
          items:
            $ref: '#/components/schemas/CartLine'

    CartLineVerdict:
      type: object
      description: Si la línea puede entrar, y en qué quedaría si entra.
      required: [valid, problems, quantity, quantity_capped, max_quantity, merges_with_index]
      additionalProperties: false
      properties:
        valid:
          type: boolean
        problems:
          type: array
          description: Vacío cuando `valid` es `true`.
          items:
            $ref: '#/components/schemas/CartLineProblem'
        quantity:
          type: integer
          description: |
            Con cuántas unidades entraría **de verdad**, ya recortada al cupo disponible. **0** si no
            entra: una línea rechazada no tiene cantidad efectiva.
        quantity_capped:
          type: boolean
          description: |
            `true` si la cantidad pedida no cabía y el servidor la recortó. Lo hace en silencio desde
            siempre (anti-manipulación); esto es lo que evita pintar la cantidad que se pidió en vez
            de la que se tiene.
        max_quantity:
          type: integer
          description: |
            Techo de esta franja con la cesta enviada ya descontada — el mismo número que acota el
            selector en `availability/{product}/times`, para no obligar a pedir las dos cosas.
        merges_with_index:
          type: integer
          nullable: true
          description: |
            Índice dentro de `items` de la línea que **absorbería** a la candidata sumando
            cantidades, o `null` si entraría como línea nueva. Solo se funden entradas del mismo
            producto, día y hora **sin complementos**: un pack es siempre su propio bloque, porque
            fundirlo mezclaría dos fiestas y cambiaría señal y ocupación.

    CartLineProblem:
      type: object
      description: |
        Un motivo por el que la línea no puede entrar. **Sin contexto a propósito**: los números que
        dan sentido al aviso ya los publican `GET catalog/products/{id}` (`min_quantity` y los
        `event_fields` con su etiqueta) y `GET config` (`cart_max_lines`).
      required: [reason, field, suggestion]
      additionalProperties: false
      properties:
        reason:
          type: string
          enum:
            - product_unavailable
            - time_unavailable
            - sold_out
            - quantity_below_minimum
            - cart_full
            - event_field_required
            - celebrant_age_out_of_range
          description: |
            - `product_unavailable` — no existe, no se vende online o su zona no opera. Las tres dan
              la misma respuesta: distinguirlas contaría qué hay en la base de datos.
            - `time_unavailable` — esa fecha y hora no se ofrecen para este producto. Cubre franja
              inexistente o cerrada, día pasado, hora ya pasada, fuera de la ventana del producto,
              sin la antelación mínima, y el pack cuyo cupo no llega a su mínimo de invitados.
              **Reintentar no ayuda**: hay que elegir otra hora.
            - `sold_out` — la hora se ofrece pero está completa. A diferencia del anterior, aquí
              volver a mirar más tarde sí tiene sentido.
            - `quantity_below_minimum` — por debajo del mínimo contratable (`min_quantity` del
              producto).
            - `cart_full` — la cesta ya está en su tope de líneas (`cart_max_lines`).
            - `event_field_required` — falta un campo obligatorio del pack. ⚠️ **«Falta» lo decide el
              saneo del servidor**: un campo `number` se reduce a dígitos, así que una edad
              contestada «cinco» llega vacía aunque el cliente la vea rellena.
            - `celebrant_age_out_of_range` — la edad del cumpleañero no cabe en el tramo del pack
              (el tramo lo publica el propio campo en `catalog/products/{id}`). Si hay un pack de la
              misma familia que la admite, viene en `suggestion`.
        field:
          type: string
          nullable: true
          description: |
            Clave del campo del evento afectado, para resaltar ESE input. `null` cuando el problema
            es de la línea entera.
        suggestion:
          type: object
          nullable: true
          description: |
            Solo con `celebrant_age_out_of_range`: el pack de la misma familia de edades que SÍ admite
            esa edad y se vende online, para recomendarlo. `null` si no hay ninguno o en otro motivo.
            ⚠️ Es la única pieza de contexto que viaja: es una respuesta del servidor que ningún otro
            endpoint publica.
          required: [product_id, name]
          additionalProperties: false
          properties:
            product_id:
              type: integer
            name:
              type: string

    CartLine:
      type: object
      description: |
        Una línea de la cesta. Es el MISMO cuerpo que aceptan la disponibilidad, la validación de
        línea y la creación del pedido, para que el cliente no tenga que guardar dos formas de su
        carrito.
      required: [product_id, date, time, quantity]
      additionalProperties: false
      properties:
        product_id:
          type: integer
          format: int64
          minimum: 1
        date:
          type: string
          format: date
        time:
          type: string
          description: Hora de inicio de la franja. Se acepta `HH:MM` y `HH:MM:SS`.
        quantity:
          type: integer
          minimum: 1
        event_data:
          type: object
          description: |
            Respuestas de los campos del evento de un pack. **No influyen en el precio y no se
            devuelven**: son datos personales —de un menor, en el sector de origen— y este endpoint
            es público. Se aceptan para que este mismo cuerpo sirva también para crear el pedido.
        addons:
          type: array
          items:
            $ref: '#/components/schemas/CartLineAddon'
        dependent_ids:
          type: array
          uniqueItems: true
          description: |
            Los menores a cargo del titular para los que son estas entradas (Fase 6 · menores a cargo,
            tanda 4). Enteros de `GET /me/dependents`, sin repetidos **dentro de la línea** y nunca más
            que `quantity`; el resto de unidades son adultos. **El mismo menor SÍ puede ir en otra
            línea de la cesta** (`#567`): un id repetido en la misma responde 422 sobre
            `items.{i}.dependent_ids`. **Solo `POST /orders` lo lee**: la disponibilidad, la
            validación de línea y el presupuesto aceptan el mismo cuerpo y lo ignoran. El servidor
            comprueba ANTES de crear el pedido que cada menor es suyo, que es menor el día de la
            visita y que tiene la exención firmada y vigente (modo interno); si no, `422
            validation_failed` con el campo `items.{i}.dependent_ids.{j}`. Solo entradas: en un pack
            responde 422 sobre `items.{i}.dependent_ids`.
          items:
            type: integer
            format: int64
            minimum: 1
        guardian_authorization:
          type: boolean
          default: false
          description: |
            «Viene un menor que NO está a cargo de quien reserva» — el amigo del hijo, un alumno de
            una excursión. Su padre, madre o tutor tendrá que firmar el justificante desde un enlace,
            sin cuenta (`specs/waiver-por-reserva.md` §12.2).

            **Es una INTENCIÓN y el servidor la resuelve contra el producto**: si el producto declara
            `guardian_authorization: required` la línea nace marcada aunque aquí venga `false`; si
            declara `none`, lo que llegue aquí se ignora. Solo con `optional` manda este campo — es lo
            único que el cliente sabe y el catálogo no. Lo publica el detalle del producto
            (`GET /catalog/products/{id}`), y **solo `POST /orders` lo persiste**: disponibilidad,
            validación de línea y presupuesto aceptan el mismo cuerpo y lo ignoran.

    CartLineAddon:
      type: object
      description: |
        Complemento pedido para la línea. Es una INTENCIÓN: el servidor la resuelve contra la
        configuración del producto, así que la respuesta puede traer más complementos (obligatorios)
        o cantidades distintas de las pedidas.
      required: [product_id, quantity]
      additionalProperties: false
      properties:
        product_id:
          type: integer
          format: int64
          minimum: 1
        quantity:
          type: integer
          minimum: 1

    CatalogZoneList:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CatalogZoneDetail'
        meta:
          $ref: '#/components/schemas/ListMeta'

    CatalogZone:
      type: object
      description: |
        La IDENTIDAD de una zona operativa: lo que viaja anidado dentro de cada producto, y la base
        de la que parte su ficha (`CatalogZoneDetail`), para que «zona» signifique lo mismo en los
        dos sitios.
      required: [id, slug, name]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
          description: Clave estable de la zona; es la que usa el deep-link de la landing.
        name:
          type: string

    CatalogZoneDetail:
      type: object
      description: |
        La FICHA de una zona (contrato 1.8.0): su identidad **al mismo nivel** —una zona es un solo
        objeto, se venga de aquí o de dentro de un producto— más lo que se cuenta de ella.

        Los campos de la identidad se repiten aquí escritos porque OpenAPI 3.0 no compone objetos de
        forma que el validador acepte (el mismo motivo por el que la zona va inline dentro de un
        producto); que no diverjan de `CatalogZone` lo vigila `ApiContractTest`.
      required: [id, slug, name]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
          description: Clave estable de la zona; es la que usa el deep-link de la landing.
        name:
          type: string
        description:
          type: string
          description: |
            Qué es esta zona, en el idioma activo. **Ausente** si la instalación no la ha escrito:
            no viaja como `""`.
        image_url:
          type: string
          format: uri
          description: |
            URL ABSOLUTA de la foto de la zona. **Ausente** si no tiene. Absoluta porque quien la
            pinta puede estar en otro dominio (una landing de instancia) o no ser un navegador (la
            app nativa).

    CatalogProductList:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CatalogProduct'
        meta:
          $ref: '#/components/schemas/ListMeta'

    CatalogProduct:
      type: object
      description: |
        Un producto en venta, en su forma de lista. Todos los importes en **céntimos enteros**; la
        API no formatea dinero (decidir el locale del importe es de quien lo pinta), con la única
        excepción de `deposit_label`, que ya viene compuesta porque componerla es regla de dominio.
      required:
        - id
        - type
        - name
        - badge
        - features
        - gifts
        - from_price_cents
        - price_varies
        - deposit_label
        - period_label
        - featured
        - icon
        - zone
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum: [entry, pack]
          description: '`entry` = entrada; `pack` = servicio/pack (cumpleaños y similares).'
        name:
          type: string
        badge:
          type: string
          nullable: true
          description: Distintivo comercial configurable («Novedad»), o `null`.
        features:
          type: array
          description: Ventajas del producto, ya normalizadas. Unirlas con un separador es cosa del cliente.
          items:
            type: string
        gifts:
          type: array
          description: |
            Lo que el parque da SIN COBRAR (`DECISIONES #589`), ya normalizado y traducido. Va aparte de
            `features` porque se pinta distinto: **cada regalo en su etiqueta**, no unido a las ventajas.
            Lista vacía si el producto no declara ninguno.
          items:
            type: string
        from_price_cents:
          type: integer
          nullable: true
          description: |
            Precio MÍNIMO configurado. Es un «precio desde», **no** lo que se cobrará: el importe
            real lo decide la tarifa del día y lo confirma `POST orders/quote`. `null` = el producto
            no tiene ningún precio configurado.
        price_varies:
          type: boolean
          description: |
            Hay tarifas con importes distintos, así que anunciar el precio sin el «desde» mentiría.
            Lo decide el dominio para que no lo deduzca cada cliente por su cuenta.
        deposit_label:
          type: string
          nullable: true
          description: |
            SEÑAL configurada, ya formateada («30,00 €», «30 %»). `null` = el producto se cobra
            entero online. El importe exacto de la señal depende del total y lo calcula el servidor.
        period_label:
          type: string
          nullable: true
          description: Unidad de precio configurable («por niño», «por persona»), o `null`.
        featured:
          type: boolean
        icon:
          type: string
          description: >-
            Clave del MARCADOR de producto en el sistema de diseño, ya resuelta por el servidor
            (la elegida en el panel, o el respaldo de su tipo). Nunca `null`.
            ⚠️ El cliente NO la deduce de `type`: hacerlo reparte el catálogo entero en dos dibujos
            y convierte «elegir el icono de un producto» en tocar código de cliente.
        zone:
          # ⚠️ Escrito INLINE y no como `$ref`, a propósito. En OpenAPI 3.0 una referencia no admite
          # `nullable` a su lado, y la forma canónica —`allOf: [$ref]` + `nullable: true`— la
          # IGNORA el validador: se probó, y una zona nula fallaba con «The data (null) must match
          # the type: object». Que las dos definiciones no diverjan lo vigila `ApiContractTest`.
          type: object
          nullable: true
          description: Zona operativa del producto. `null` solo en productos sin zona, que no tienen franjas.
          required: [id, slug, name]
          additionalProperties: false
          properties:
            id:
              type: integer
              format: int64
            slug:
              type: string
              description: Clave estable de la zona; es la que usa el deep-link de la landing.
            name:
              type: string
        image_url:
          type: string
          format: uri
          description: |
            URL ABSOLUTA de la foto del producto (contrato 1.8.0). **Ausente** si esta instalación
            no ha subido ninguna: no viaja como `""`.
            ⚠️ La foto va en la LISTA y la descripción NO: un catálogo se recorre mirando fotos y la
            prosa se lee al abrir un producto. Cada campo de la lista se paga en todas las filas.

    CatalogProductDetail:
      type: object
      description: |
        Ficha completa: los campos de `CatalogProduct` **al mismo nivel** —el producto es un solo
        objeto, se venga de la lista o del detalle— más lo que solo hace falta al abrirlo.
      required:
        - id
        - type
        - name
        - badge
        - features
        - gifts
        - from_price_cents
        - price_varies
        - deposit_label
        - period_label
        - featured
        - icon
        - zone
        - min_quantity
        - max_quantity
        - event_fields
        - addons
        - guardian_authorization
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum: [entry, pack]
        name:
          type: string
        badge:
          type: string
          nullable: true
        features:
          type: array
          items:
            type: string
        gifts:
          type: array
          description: Los regalos, como en `CatalogProduct.gifts`.
          items:
            type: string
        from_price_cents:
          type: integer
          nullable: true
        price_varies:
          type: boolean
        deposit_label:
          type: string
          nullable: true
        period_label:
          type: string
          nullable: true
        featured:
          type: boolean
        icon:
          type: string
          description: Igual que en `CatalogProduct` (ver la descripción de allí).
        zone:
          # Inline por el mismo motivo que en `CatalogProduct` (ver el comentario de allí).
          type: object
          nullable: true
          required: [id, slug, name]
          additionalProperties: false
          properties:
            id:
              type: integer
              format: int64
            slug:
              type: string
              description: Clave estable de la zona; es la que usa el deep-link de la landing.
            name:
              type: string
        min_quantity:
          type: integer
          description: |
            Cantidad mínima contratable: los invitados mínimos de un pack, 1 en una entrada. Es la
            misma regla que aplica el servidor al admitir la línea, así que respetarla evita pedidos
            rechazados por cantidad.
        max_quantity:
          type: integer
          nullable: true
          description: |
            Tope contratable configurado, o `null` si no lo hay. El AFORO es otro límite distinto y
            lo sirve disponibilidad: este no depende de la fecha.
        event_fields:
          type: array
          description: |
            Campos del formulario del evento que se piden AL RESERVAR (packs). Los de la etapa
            posterior —el formulario por invitado— son de otra superficie y no se mezclan aquí.
          items:
            $ref: '#/components/schemas/CatalogEventField'
        addons:
          type: array
          description: Complementos que ESTE producto ofrece, en el orden configurado.
          items:
            $ref: '#/components/schemas/CatalogAddon'
        guardian_authorization:
          type: string
          enum: [none, optional, required]
          description: |
            Qué hace este producto con el JUSTIFICANTE de un menor invitado —un menor que no está a
            cargo de quien reserva— (`specs/waiver-por-reserva.md` §12.2).

            · `none` — no se ofrece. Es el defecto y lo que son casi todas las entradas.
            · `optional` — se pregunta: la pantalla pinta una casilla y lo que se marque viaja en
              `CartLine.guardian_authorization`.
            · `required` — hace falta siempre (una excursión de colegio). **No se pregunta**: la
              pantalla informa, y el servidor marca la línea llegue lo que llegue en el cuerpo.
        image_url:
          type: string
          format: uri
          description: |
            La misma foto que publica `CatalogProduct` (contrato 1.8.0), porque el detalle sirve los
            campos de la lista al mismo nivel. **Ausente** si no la hay.
        description:
          type: string
          description: |
            Qué es este producto, en el idioma activo (contrato 1.8.0). **Ausente** si la
            instalación no lo ha escrito: no viaja como `""`.
            ⚠️ Vive SOLO en el detalle: es prosa y se lee al abrir un producto, no al recorrer el
            catálogo, donde cada campo se paga en todas las filas.

    CatalogEventField:
      type: object
      description: Un campo del formulario de evento, definido desde el panel.
      required: [key, label, type, required, min, max]
      additionalProperties: false
      properties:
        key:
          type: string
          description: Clave estable con la que se envía la respuesta.
        label:
          type: string
        type:
          type: string
          enum: [text, number, textarea, celebrant_age]
          description: |
            `celebrant_age` es la edad del CUMPLEAÑERO (una por fiesta): se contesta como número y el
            servidor la compara con el tramo del pack (`min`/`max`).
        required:
          type: boolean
        min:
          type: integer
          nullable: true
          description: Solo en `celebrant_age` — la edad mínima del tramo del pack. `null` si no tiene.
        max:
          type: integer
          nullable: true
          description: Solo en `celebrant_age` — la edad máxima del tramo del pack. `null` si es abierto.

    AddonSelectionRequest:
      type: object
      description: |
        La cantidad de la línea y lo que llevas elegido. La primera llamada puede ir solo con
        `quantity`: los grupos se resuelven con su elegido por defecto.
      required: [quantity]
      additionalProperties: false
      properties:
        quantity:
          type: integer
          minimum: 1
          description: Cantidad de la LÍNEA (los invitados de un pack), no de los complementos.
        date:
          type: string
          format: date
          description: |
            Solo para tarificar la línea. Los complementos **no** dependen del día reservado.
        time:
          type: string
          description: Hora de inicio de la franja (`HH:MM` o `HH:MM:SS`). Solo para tarificar.
        addons:
          type: array
          description: |
            Cantidades de los complementos de cantidad libre. Una cantidad `0` es válida y significa
            «este ya no lo quiero»: no hace falta rehacer la lista.
          items:
            $ref: '#/components/schemas/AddonQuantity'
        choices:
          type: array
          description: |
            El elegido de cada grupo excluyente. Un grupo que no mandes usa su elegido por defecto.
          items:
            $ref: '#/components/schemas/AddonChoice'

    PostFormAddon:
      type: object
      description: |
        Un complemento de **venta POSTERIOR** ofrecido en el formulario de una reserva
        (`specs/complementos-post-reserva.md`): lo que el cliente puede añadir DESPUÉS de reservar, y
        que se paga **en el parque**.

        ⚠️ **No es `ResolvedAddon`, y no por gusto.** Aquél publica el precio del CATÁLOGO de hoy, y
        aquí manda el precio de la LÍNEA: si el parque sube el cubo de refrescos de 12 a 14 €, quien
        ya tiene dos sigue viéndolos a 12 —es lo que se le comunicó— y el libro dice lo mismo.
        Reutilizarlo habría dado dos pantallas con dos importes y ningún fallo. Además `ResolvedAddon`
        arrastra `selection` y `line`, que son de la CESTA: post-reserva no hay ni una cosa ni la otra.
      required:
        - product_id
        - product_name
        - unit_price_cents
        - note
        - gifts
        - features
        - quantity
        - max_quantity
        - charged_cents
        - closed
        - closed_reason
        - closes_at
      additionalProperties: false
      properties:
        product_id:
          type: integer
          format: int64
        product_name:
          type: string
        unit_price_cents:
          type: integer
          description: |
            El precio unitario que se aplicará. **El de la LÍNEA** si ya hay unidades compradas —lo
            que se le comunicó al cliente—, y el del catálogo de hoy si aún no hay ninguna.
        note:
          type: string
          description: La línea de precio ya compuesta y traducida. Viaja hecha, como en el embudo.
        gifts:
          type: array
          description: |
            Lo que el extra trae de REGALO (`DECISIONES #589`), traducido. A la vista, cada uno en su
            etiqueta —no dentro del «Más info»—. Lista vacía si no declara ninguno.
          items:
            type: string
        features:
          type: array
          description: |
            Lo que lleva dentro, traducido — el «Más info» que la landing ya enseña de cada
            complemento (`DECISIONES #416`). Lista vacía si el producto no declara ninguna.

            ⚠️ **Aquí no es adorno.** Estos complementos se eligen en esta pantalla y en ninguna otra,
            así que sin esto el cliente decide entre «Combo 1 · 39 €» y «Combo 2 · 59 €» sin saber qué
            llevan. El dato ya existía en el catálogo; solo no se publicaba.
          items:
            type: string
        quantity:
          type: integer
          description: Lo que el cliente tiene ahora mismo de este complemento. `0` = ninguno.
        max_quantity:
          type: integer
          description: |
            El tope de este enganche. **Es obligatorio declararlo** en un complemento de venta
            posterior: el enlace del formulario viaja por correo y se reenvía, así que la deuda máxima
            que alguien puede crear la decide el parque y no una constante del código.
        charged_cents:
          type: integer
          description: Lo que suman las unidades actuales (`quantity × unit_price_cents`).
        closed:
          type: boolean
          description: |
            `true` cuando su PLAZO ya venció: entonces no se puede añadir **ni quitar**. ⚠️ El estado
            es **por complemento**, no por formulario: con «tapas 48 h» y «cubo 2 h» sobre la misma
            fiesta, a 24 h uno está cerrado y el otro abierto.
        closed_reason:
          type: string
          nullable: true
          enum: [cutoff, sold_at_booking, null]
          description: |
            Por qué no se puede tocar. `cutoff` = venció su plazo. `sold_at_booking` = esas unidades
            **se compraron al reservar**, así que son del parque: quitarlas devolvería dinero ya
            cobrado, y eso se gestiona en las instalaciones.
        closes_at:
          type: string
          format: date-time
          nullable: true
          description: Cuándo vence su plazo, para poder decírselo al cliente antes de que pase.

    AddonQuantity:
      type: object
      required: [product_id, quantity]
      additionalProperties: false
      properties:
        product_id:
          type: integer
          format: int64
          minimum: 1
        quantity:
          type: integer
          minimum: 0

    AddonChoice:
      type: object
      required: [group, product_id]
      additionalProperties: false
      properties:
        group:
          type: string
          maxLength: 100
          description: Clave del grupo, tal como la publica `choice_group` en la ficha del producto.
        product_id:
          type: integer
          format: int64
          minimum: 1

    ResolvedAddons:
      type: object
      description: Los complementos ya resueltos, lo que hay que guardar, y el pie de la línea.
      required: [groups, singles, addons_total_cents, selection, line]
      additionalProperties: false
      properties:
        groups:
          type: array
          description: |
            Grupos EXCLUYENTES: dentro de cada uno hay exactamente uno seleccionado, y elegir otro
            deselecciona al anterior. Van aparte porque esa regla no se ve mirando las filas.
          items:
            $ref: '#/components/schemas/AddonChoiceGroup'
        singles:
          type: array
          description: Complementos sueltos.
          items:
            $ref: '#/components/schemas/ResolvedAddon'
        addons_total_cents:
          type: integer
          description: Lo que suman los complementos seleccionados.
        selection:
          type: array
          description: |
            **Lo que hay que guardar en la cesta.** Ya lleva los obligatorios inyectados y los
            dependientes huérfanos fuera, así que una cesta construida con esto es la que el checkout
            aceptará. Es la misma forma que los `addons` de una línea de cesta.
          items:
            $ref: '#/components/schemas/CartLineAddon'
        line:
          type: object
          nullable: true
          description: |
            El pie de la línea con esta selección. **`null` si no mandaste `date` y `time`**: sin
            ellos no hay precio del producto base, y un importe calculado sobre una fecha inventada
            sería peor que ninguno. Sale del mismo cálculo que `orders/quote`.
          required:
            - subtotal_cents
            - unit_price_cents
            - total_cents
            - has_deposit
            - deposit_cents
            - gate_remainder_cents
            - addons
          additionalProperties: false
          properties:
            subtotal_cents:
              type: integer
              description: Solo el principal. Lo que suman los complementos va en cada uno de ellos.
            unit_price_cents:
              type: integer
              nullable: true
              description: |
                `null` = el producto no tiene precio para la tarifa de ese día. Se puede presupuestar,
                pero **no se puede comprar**.
            total_cents:
              type: integer
              description: |
                Lo que vale la línea ENTERA: principal más complementos cobrados. **Es el importe que
                se pinta**, y viaja para que nadie lo componga sumando `subtotal_cents` con
                `addons_total_cents`: los dos salen de recorridos distintos y pueden divergir, mientras
                que este sale del mismo presupuesto que alimenta la creación del pedido (`PAY-12`).
            has_deposit:
              type: boolean
            deposit_cents:
              type: integer
            gate_remainder_cents:
              type: integer
              description: |
                Lo que quedaría por pagar en el parque. Los complementos de un producto CON señal se
                cobran allí íntegros.
            addons:
              type: array
              items:
                $ref: '#/components/schemas/QuoteLineAddon'

    AddonChoiceGroup:
      type: object
      description: Un grupo «elige uno».
      required: [key, label, options]
      additionalProperties: false
      properties:
        key:
          type: string
          description: Lo que hay que devolver en `choices.group` al elegir un miembro.
        label:
          type: string
          description: Título ya traducido del grupo.
        options:
          type: array
          items:
            $ref: '#/components/schemas/ResolvedAddon'

    ResolvedAddon:
      type: object
      description: |
        Un complemento ya resuelto contra la selección. Distinto de `CatalogAddon`, que publica la
        CONFIGURACIÓN: esto es el resultado de aplicarla.
      required:
        - product_id
        - product_name
        - price_cents
        - note
        - is_included
        - is_mandatory
        - per_guest
        - allow_extra
        - badge
        - gifts
        - features
        - selected
        - available
        - requires_name
        - quantity
        - free_quantity
        - charged_cents
        - min_quantity
        - max_quantity
        - can_toggle
        - can_increase
        - can_decrease
      additionalProperties: false
      properties:
        product_id:
          type: integer
          format: int64
        product_name:
          type: string
        price_cents:
          type: integer
          description: Precio unitario del día. `0` si es gratis.
        note:
          type: string
          description: |
            La línea de precio ya compuesta y traducida («Incluido», «5,00 € por invitado»…). Viaja
            hecha porque mezcla textos traducibles con importes formateados.
        is_included:
          type: boolean
          description: Va incluido en el producto; sus primeras unidades no se cobran.
        is_mandatory:
          type: boolean
          description: 'El producto lo exige: no se puede quitar.'
        per_guest:
          type: boolean
          description: La cantidad la fija el nº de invitados, no el cliente.
        allow_extra:
          type: boolean
          description: Admite unidades por encima de las incluidas.
        badge:
          type: string
          nullable: true
          enum: [included, free, null]
          description: |
            `included` = va con el producto · `free` = no cuesta nada. **No son lo mismo** y por eso
            no se derivan del precio.
        gifts:
          type: array
          description: |
            Lo que el complemento trae de REGALO (`DECISIONES #589`). A la vista, cada uno en su
            etiqueta; no va dentro del «Más info» de `features`.
          items:
            type: string
        features:
          type: array
          description: Ventajas, para el desplegable «Más info».
          items:
            type: string
        selected:
          type: boolean
          description: |
            ⚠️ **No se deduce de `quantity`.** En un grupo lo que selecciona es ser el elegido, y un
            complemento cuyo requisito no está elegido queda fuera aunque lo hubieras marcado. Es el
            mismo veredicto que aplicará el cobro.
        available:
          type: boolean
          description: |
            Su requisito («requiere X») está elegido. Si es `false`, el complemento se enseña pero no
            se puede activar.
        requires_name:
          type: string
          nullable: true
          description: 'Nombre del complemento que le falta, para el aviso «Requiere: X».'
        quantity:
          type: integer
        free_quantity:
          type: integer
          description: Cuántas de esas unidades van sin cargo.
        charged_cents:
          type: integer
          description: '`(quantity − free_quantity) × price_cents`.'
        min_quantity:
          type: integer
        max_quantity:
          type: integer
          nullable: true
        can_toggle:
          type: boolean
          description: |
            Se activa con un interruptor y no con un contador: es el caso por-invitado opcional,
            donde la cantidad la decide el aforo.
        can_increase:
          type: boolean
        can_decrease:
          type: boolean

    CatalogAddon:
      type: object
      description: |
        Un complemento tal y como lo OFRECE este producto. La configuración es por enganche: el
        mismo complemento puede ir incluido en un pack y ser un extra de pago en otro.

        Describe la oferta, no una selección. Lo que se cobra por una línea depende de las unidades
        incluidas y de la cantidad, y lo calcula el servidor al presupuestar: un cliente que lo sume
        por su cuenta está reimplementando reglas de dinero.
      required:
        - id
        - name
        - features
        - gifts
        - price_cents
        - included
        - included_quantity
        - mandatory
        - per_guest
        - allow_extra
        - max_quantity
        - choice_group
        - requires_addon_id
        - selected_by_default
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        features:
          type: array
          items:
            type: string
        gifts:
          type: array
          description: Los regalos del complemento (`DECISIONES #589`), como en `CatalogProduct.gifts`.
          items:
            type: string
        price_cents:
          type: integer
          description: |
            Precio unitario para la tarifa vigente. `0` en un complemento incluido sin precio propio
            (es gratis de verdad). Un complemento de pago sin precio ni siquiera se ofrece.
        included:
          type: boolean
          description: Las primeras `included_quantity` unidades van dentro del producto, sin coste.
        included_quantity:
          type: integer
        mandatory:
          type: boolean
          description: No se puede quitar; el servidor lo inyecta aunque el cliente no lo envíe.
        per_guest:
          type: boolean
          description: La cantidad la fija el número de invitados de la línea, no el cliente.
        allow_extra:
          type: boolean
          description: ¿Se pueden pedir unidades por encima de las incluidas, a su precio?
        max_quantity:
          type: integer
          nullable: true
        choice_group:
          type: string
          nullable: true
          description: |
            Grupo EXCLUYENTE: de todos los complementos que comparten esta clave se contrata
            exactamente uno. `null` = complemento independiente.
        requires_addon_id:
          type: integer
          format: int64
          nullable: true
          description: |
            Complemento que este REQUIERE para poder contratarse. El servidor descarta los
            dependientes cuyo requisito no esté seleccionado, en cadena.
        selected_by_default:
          type: boolean
          description: |
            Viene seleccionado de partida (el miembro por defecto de un grupo, o un obligatorio
            suelto). Lo decide el dominio para que ningún cliente lo adivine.

    LoginRequest:
      type: object
      description: Credenciales de acceso. El correo se normaliza en servidor (minúsculas y sin espacios).
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        remember:
          type: boolean
          description: Mantener la sesión abierta más allá del cierre del navegador.

    TokenRequest:
      type: object
      description: Credenciales más el nombre del dispositivo, que es lo que el titular verá si algún día se listan.
      required: [email, password, device_name]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        device_name:
          type: string
          minLength: 1
          maxLength: 60
          description: Nombre legible del dispositivo (p. ej. «iPhone de Ana»). No identifica al token.

    IssuedToken:
      type: object
      description: Un token recién emitido, con el perfil de su titular (la misma forma que `GET /me`).
      required: [token, token_type, expires_at, user]
      additionalProperties: false
      properties:
        token:
          type: string
          description: El valor en claro. Solo viaja aquí; el servidor guarda su hash.
        token_type:
          type: string
          enum: [Bearer]
        expires_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'

    LinkedIdentity:
      type: object
      description: |
        Una cuenta externa vinculada, vista por su titular (`specs/auth-con-google.md` §8).
      required: [provider, email_at_link, linked_at, linked_label]
      additionalProperties: false
      properties:
        provider:
          type: string
          description: '`google` es el único de hoy.'
        email_at_link:
          type: string
          nullable: true
          description: |
            El correo **con el que se vinculó**. Puede diferir del correo actual de la cuenta: dice
            con cuál se estableció el vínculo, que es lo que el titular necesita reconocer.
        linked_at:
          type: string
          format: date-time
          nullable: true
        linked_label:
          type: string
          description: La fecha ya compuesta, en la zona horaria de la instalación.

    MarketingConsentRequest:
      type: object
      description: |
        El ESTADO que el titular pide para sus comunicaciones comerciales. Un solo campo a propósito:
        aquí no hay nada más que decidir, y `additionalProperties: false` impide que un cliente cuele
        un campo que el servidor ignoraría en silencio.
      required: [accepted]
      additionalProperties: false
      properties:
        accepted:
          type: boolean
          description: '`true` los quiere; `false` los retira (art. 7.3).'

    GoogleSignupPending:
      type: object
      description: |
        El alta con Google que espera a completarse (`specs/auth-con-google.md` §7). Sale de la
        SESIÓN del servidor, no de nada que el cliente haya mandado.
      required: [name, email]
      additionalProperties: false
      properties:
        name:
          type: string
          nullable: true
          description: |
            El que sugiere Google, **editable**: a veces devuelve solo «Ana G.», y el nombre viaja a
            la firma del descargo. `null` si Google no lo dio.
        email:
          type: string
          format: email
          description: |
            La identidad verificada. **Es fijo**: no se pide, se enseña. Cambiarlo aquí sería crear
            una cuenta con un correo que nadie ha demostrado.

    GoogleSignupRequest:
      type: object
      description: |
        Lo único que Google no puede dar. **Ni el `sub` ni el correo viajan aquí** y no es un olvido:
        los pone el servidor desde la sesión (§6.3·3).

        ⚠️ Desde la T8·c (`[DECIDIDO owner, 2026-09-02]`) son **dos cosas**: el nombre y el descargo.
        El teléfono y las condiciones se piden al contratar (`POST /orders`), no al crear la cuenta.
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 255
        accept_waiver:
          type: boolean
          nullable: true
          description: |
            El descargo de responsabilidad. **Obligatorio cuando `GET /legal/waiver` sirve un
            documento** (modo interno con versión publicada); fuera de ese caso no se pide, y
            entonces esta pantalla ni se pinta.
        waiver_document_id:
          type: integer
          nullable: true
          minimum: 1
          description: |
            El identificador del texto que el servidor SIRVIÓ. Aceptar sin decir qué se leyó no prueba
            nada: si no es el vigente, la respuesta es `409 waiver_document_stale`.

    RegisterRequest:
      type: object
      description: |
        Datos del alta. El correo se normaliza en servidor.

        ⚠️⚠️ **Desde la T8·c el alta NO lleva casillas legales** (`[DECIDIDO owner, 2026-09-02]`), y
        cada una se fue por un motivo distinto:
          · **privacidad** — el art. 13 pide INFORMAR, no que se acepte. El enlace va visible en la
            pantalla y el rastro se sigue escribiendo (`privacy_accepted_at` y su fila de `consents`);
          · **condiciones** — se aceptan en el momento del contrato, donde las sitúan la LCGC (art. 5)
            y el TRLGDCU (art. 97): las pide `POST /orders`. La cuenta nace **sin aceptación
            registrada**, y ése es el estado correcto;
          · **marketing** — vive en `PUT /me/marketing`, con su interruptor, porque el art. 7.3 exige
            que retirarlo sea tan fácil como darlo.

        La única casilla que queda es la del descargo (`accept_waiver`).
      required: [name, email, phone, password]
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
        phone:
          type: string
          maxLength: 30
        password:
          type: string
          format: password
          minLength: 8
          description: Mínimo 8 caracteres y no puede aparecer en filtraciones conocidas.
        context:
          type: string
          enum: [standalone, purchase]
          description: |
            Desde dónde se registra. `standalone` (por defecto) envía verificación y no inicia
            sesión; `purchase` inicia sesión y no la envía (pay-first).
        website:
          type: string
          description: |
            Campo SEÑUELO. Un cliente legítimo lo deja vacío o no lo envía; si llega relleno, no se
            crea nada y la respuesta es indistinguible de un alta buena.
        turnstile_token:
          type: string
          description: Token del anti-bot, si la instalación lo tiene configurado.
        accept_waiver:
          type: boolean
          description: |
            Fase 6 · waiver (`specs/waiver-probatorio.md` §4.4): la casilla SEPARADA de la exención
            de responsabilidad, **desmarcada por defecto**. ⚠️ Desde `#178` (`[DECIDIDO owner]`, spec
            §7·7) es **OBLIGATORIA cuando el modo es `interno` y hay una versión publicada** —es
            decir, siempre que `GET /legal/waiver` devuelva un `document`—: sin marcarla, 422 sobre
            `accept_waiver` y no se crea la cuenta. Fuera de ese caso es opcional, y en modo externo
            marcarla se rechaza con un 422 sobre `waiver_document_id`.
        waiver_document_id:
          type: integer
          nullable: true
          description: |
            El `document.id` que `GET /legal/waiver` sirvió. **Obligatorio si `accept_waiver` es
            `true`**: aceptar sin decir qué texto se leyó no prueba nada. Si el texto se publicó de
            nuevo entre medias, 422 sobre este campo y el cliente vuelve a presentarlo — **antes** de
            crear la cuenta, nunca después. ⚠️ Desde `#179` el alta **no firma**: deja la aceptación
            pendiente y la firma se registra al VERIFICAR el correo, si ese texto sigue vigente.

    WaiverDocument:
      type: object
      description: El modo de la instalación y, si lo hay, el texto firmable vigente (Fase 6 · waiver).
      required: [mode, document]
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: [externo, interno, desactivado]
          description: Cómo gestiona el waiver esta instalación (`waiver.mode`).
        document:
          type: object
          nullable: true
          description: '`null` fuera del modo interno o sin versión publicada. No es un error.'
          required: [id, version, locale, title, sections, published_at]
          additionalProperties: false
          properties:
            id:
              type: integer
              description: El identificador que se devuelve al aceptar. Cambia con cada versión publicada.
            version:
              type: integer
              description: Número de versión del texto (1, 2, …), común a todos sus idiomas.
            locale:
              type: string
              description: El idioma en que se sirvió — puede ser el de respaldo. Es parte de la prueba.
            title:
              type: string
            sections:
              type: array
              description: El texto íntegro, ya interpolado, como lista de secciones encabezado + párrafo.
              items:
                type: object
                required: [h, p]
                additionalProperties: false
                properties:
                  h:
                    type: string
                    description: Encabezado de la sección; puede ser cadena vacía.
                  p:
                    type: string
            published_at:
              type: string
              format: date-time
              nullable: true

    WaiverAcceptRequest:
      type: object
      description: Aceptar el texto vigente del waiver.
      required: [document_id]
      additionalProperties: false
      properties:
        document_id:
          type: integer
          minimum: 1
          description: El `document.id` que `GET /legal/waiver` sirvió (o `current_document_id` de `GET /me/waiver`).

    WaiverStatus:
      type: object
      description: Mi waiver — el estado según el modo de la instalación, y mis firmas.
      required: [mode, signed, pending, outdated, accepted_at, accepted_label, version, current_document_id, signatures]
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: [externo, interno, desactivado]
        signed:
          type: boolean
          description: En `externo`, el sello del sistema del parque; en `interno`, si hay registro firmado aquí.
        pending:
          type: boolean
          description: |
            La aceptación marcada en el ALTA que espera a que el correo se verifique (`#181`): el titular ya
            aceptó, pero la firma no existe todavía — `signed` es `false` y aceptar de nuevo responde
            `409 waiver_email_unverified`. Se convierte en firma al verificar, si el texto sigue vigente.
        outdated:
          type: boolean
          description: Firmado, pero en una versión anterior del texto. Se deja pasar; se pide la re-firma.
        accepted_at:
          type: string
          format: date-time
          nullable: true
        accepted_label:
          type: string
          nullable: true
          description: La fecha ya compuesta, en la zona horaria de la instalación.
        version:
          type: integer
          nullable: true
          description: Número de la versión firmada (solo en modo interno).
        current_document_id:
          type: integer
          nullable: true
          description: El texto vigente en este idioma, para aceptar o re-firmar. `null` fuera del modo interno.
        signatures:
          type: array
          description: Mis firmas, de la más reciente a la más antigua. Sin ip, user-agent ni hashes.
          items:
            $ref: '#/components/schemas/WaiverSignatureSummary'

    WaiverSignatureSummary:
      type: object
      description: Una firma del titular, tal como él la ve; la prueba completa es su PDF.
      required: [id, version_label, accepted_at, accepted_label, channel, declared, subject, dependent_id, dependent_name, pdf_url]
      additionalProperties: false
      properties:
        id:
          type: integer
        version_label:
          type: string
          description: '«v2·es»: versión e idioma del texto firmado.'
        accepted_at:
          type: string
          format: date-time
          nullable: true
        accepted_label:
          type: string
        channel:
          type: string
          enum: [web, api, panel]
        declared:
          type: boolean
          description: '`true` si la declaró un operador en el mostrador (alta presencial): sustancialmente más débil.'
        subject:
          type: string
          enum: [holder, dependent]
        dependent_id:
          type: integer
          nullable: true
          description: 'Con `subject` = `dependent`, el menor a cargo en cuyo nombre se firmó.'
        dependent_name:
          type: string
          nullable: true
          description: Su nombre tal y como estaba al firmar (copiado en el registro).
        pdf_url:
          type: string
          format: uri
          description: '`GET /me/waiver/{signature}/pdf`.'

    DependentList:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Dependent'
        meta:
          $ref: '#/components/schemas/ListMeta'

    CustomerCard:
      type: object
      description: |
        El carné QR del titular (`specs/identidad-qr-puerta.md` §4.1, §4.5). `token` es el payload
        del QR tal cual: `JW` + 17 caracteres aleatorios + 1 de control, en Crockford Base32
        (`0-9 A-Z` sin `I L O U`).
      required: [token, issued_at, png_url]
      additionalProperties: false
      properties:
        token:
          type: string
          nullable: true
          pattern: '^JW[0-9A-HJKMNP-TV-Z]{18}$'
          description: '`null` solo si la clave de cifrado del servidor rotó: rota el carné.'
        issued_at:
          type: string
          format: date-time
        png_url:
          type: string
          format: uri
          nullable: true
          description: |
            La URL de `GET /me/card/png` —el carné como imagen, los mismos bytes que el adjunto del
            correo—, compuesta por el servidor. `null` cuando `token` es `null`: no hay nada que dibujar.

    Dependent:
      type: object
      description: |
        Una persona a cargo, vista por su titular (`specs/menores-a-cargo.md` §4.1, §4.2). La edad
        no se guarda: se deriva de `born_on` con el «hoy» del parque en cada petición.
      required: [id, name, surname, full_name, relationship, born_on, age, is_minor, adult_from, waiver]
      additionalProperties: false
      properties:
        id:
          type: integer
        name:
          type: string
          description: El nombre de pila. Es lo ÚNICO que enseña la pantalla de puerta, junto con la edad.
        surname:
          type: string
          nullable: true
          description: |
            Los apellidos (`#236`). **`null` en las fichas declaradas antes de esa tanda**: no había
            de dónde sacarlos y no se inventan. La pantalla de puerta NO los enseña — distinguir a
            un niño de otro en el mostrador no los necesita.
        full_name:
          type: string
          description: Nombre y apellidos ya compuestos, sin espacio sobrante si no hay apellidos.
        relationship:
          type: string
          nullable: true
          enum: [father, mother, legal_guardian, grandparent, other, null]
          description: |
            Qué es el titular del menor (`#236`). Es lo que sostiene que ese adulto pueda firmar por
            él. **`null` en las fichas anteriores a esa tanda.**
        born_on:
          type: string
          format: date
          description: '`Y-m-d`.'
        age:
          type: integer
          minimum: 0
          description: Años cumplidos hoy, en el reloj del parque. Derivada, nunca guardada.
        is_minor:
          type: boolean
          description: '`false` desde el día en que cumple 18: «ya no está cubierto». La fila no se borra.'
        adult_from:
          type: string
          format: date
          description: El día en que cumple 18 (`Y-m-d`).
        waiver:
          $ref: '#/components/schemas/DependentWaiverStatus'

    DependentWaiverStatus:
      type: object
      description: |
        El waiver del MENOR, según el modo de la instalación: su propia cadena de firmas, nunca el
        sello del titular (`specs/menores-a-cargo.md` §4.3). Fuera del modo interno no hay pregunta
        (`signed: false`). Sin `current_document_id`: el texto que hay que aceptar es el mismo que
        publican `GET /legal/waiver` y `GET /me/waiver`.
      required: [mode, signed, outdated, accepted_at, accepted_label, version, signature_id, pdf_url]
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: [externo, interno, desactivado]
        signed:
          type: boolean
        outdated:
          type: boolean
          description: Firmado en una versión anterior del texto; se deja pasar y se pide la re-firma.
        accepted_at:
          type: string
          format: date-time
          nullable: true
        accepted_label:
          type: string
          nullable: true
        version:
          type: integer
          nullable: true
        signature_id:
          type: integer
          nullable: true
          description: La firma que responde; su PDF es `pdf_url`.
        pdf_url:
          type: string
          format: uri
          nullable: true

    DependentCreateRequest:
      type: object
      description: |
        Nombre, apellidos, relación con el titular y fecha de nacimiento (`#236`). Nació como
        «nombre y fecha, nada más» —cada campo de más es dato personal de un menor— y el owner
        añadió los otros dos: los apellidos para identificar sin ambigüedad a quien no conoce a la
        familia, y la **relación**, que es lo que sostiene que ese adulto pueda firmar por él.

        ⚠️ Los tres son **obligatorios al declarar**, aunque en la tabla los dos nuevos sean
        nulables: las fichas de antes de `#236` no los tienen y no se inventan.

        ❗❗ **La EXENCIÓN se acepta aquí** (`#441`): declarar un menor y aceptar su descargo son un
        solo gesto. Los dos campos son **condicionalmente obligatorios** —solo cuando el modo del
        waiver es `interno` y hay una versión publicada—, y eso no se puede expresar en el esquema:
        **la autoridad es el SERVIDOR**, que responde `422 validation_failed` sobre `accept_waiver`
        cuando falta. Si estuvieran en `required`, una instalación en modo `externo` no podría
        declarar un menor.

        ⚠️ Van **DOS y no uno**, como las dos altas de cuenta: la casilla es el acto afirmativo del
        art. 7.1 RGPD y el identificador solo dice **qué texto** se sirvió. Un `document_id` suelto
        no prueba que nadie aceptara nada.
      required: [name, surname, relationship, born_on]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        surname:
          type: string
          minLength: 1
          maxLength: 120
        relationship:
          type: string
          enum: [father, mother, legal_guardian, grandparent, other]
          description: Lista cerrada. Con texto libre acabarían conviviendo veinte formas de escribir «madre».
        born_on:
          type: string
          format: date
          description: '`Y-m-d`, no futura y de un menor (hoy, menos de 18 años).'
        accept_waiver:
          type: boolean
          description: |
            El titular acepta el descargo EN NOMBRE del menor. Obligatorio cuando el servidor sirve
            un texto firmable; ignorado cuando no lo hay.
        waiver_document_id:
          type: integer
          description: |
            El identificador de la versión que la pantalla SIRVIÓ. El servidor comprueba que sigue
            siendo la vigente —también bajo el lock, al escribir— y responde `409` si se republicó
            mientras se rellenaba: **no se firma un texto que no se ha leído**.

    EmailRequest:
      type: object
      description: Solo el correo. Se usa para pedir el enlace de recuperación y para reenviar la verificación.
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email

    PasswordResetRequest:
      type: object
      description: Token del correo más la contraseña nueva, confirmada.
      required: [token, email, password, password_confirmation]
      additionalProperties: false
      properties:
        token:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        password_confirmation:
          type: string
          format: password
