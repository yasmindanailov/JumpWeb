<!--
  El LOGOTIPO de Bizum, versión principal en su azul (#05C0C7), ASSET DE PROVEEDOR (`DECISIONES #784`).

  Origen: el portal de marca oficial de Bizum (`https://company-207321.frontify.com/d/37F1zrxAognn/recursos`), paquete
  «Logotipo RGB», fichero `Bizum_Logotipo_VP_RGB_Azul.ai` (traído el 2026-09-26, sha256 del original
  1b252dde31f3de4b4f1b8dcb6e8a01c4ad541876492f1e506fc376f3fdc75705). El `.ai` es un PDF: este `<svg>` es su dibujo
  convertido de formato con PyMuPDF (`get_svg_image`), recortado a la caja del dibujo más 1,5 unidades por lado —justas
  para que el suavizado del borde no se corte: medido en Chromium, sin ellas la «m» perdía su último píxel—. El trazado
  y el color son los suyos, sin tocar; solo se añade este comentario.

  Para qué: las formas de pago al final del recibo de «Pagar», y solo si la instalación lo marca en el panel
  (`payment.marks`, `MarcasDePago`). El aire alrededor lo pone su chapa, no el fichero.
-->
