  La MARCA de Visa en BLANCO, la de fondos oscuros (su ReadMe: «White is used on dark backgrounds»), ASSET DE PROVEEDOR
  (`DECISIONES #786`). Hermana de `visa.svg` (el azul, sobre claro): el mismo trazado.

  Origen: el paquete oficial «Visa Brand Mark DIGITAL 2025» (`https://globalclient.visa.com/brand-mark`, bajado por el
  owner, que aceptó sus condiciones, el 2026-09-26), fichero `VBM_digital_2025/white/VBM_whtRGB_2025.svg` (sha256 del
  original c06c40f5cf35db969561ecf666a1fb6cca23dd32b828b4eab1270eed62bb516b). El `<svg>` de abajo es el suyo con UN
  cambio, el mismo que el azul: el `viewBox` (antes `0 0 278.075 169.374`), recortado a la caja del dibujo con medio
  punto de aire. El trazado y el color, sin tocar; se añade este comentario.

  Para qué: las formas de pago DENTRO de la isla (su caja es `data-surface="ink"`), si la instalación la marca.
-->
